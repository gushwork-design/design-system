# The Slack app "Bruce" (one app, two jobs). Paste into api.slack.com/apps -> Bruce -> App Manifest -> YAML -> Save.
#
#   1. The ✅ review loop: reaction_added on a notice records an approval (web/api/_slack-events.js).
#   2. The concierge: @Bruce in a channel, or a DM, hands over brand assets and points at templates and tools
#      (web/api/_concierge.js). No model is called.
#
# Both arrive at the same Request URL, so Socket Mode must stay OFF: turning it on stops Slack sending events to the URL
# and silently breaks the review loop.
#
# What the concierge added to the review loop's original manifest:
#   scopes  im:history (read DMs), im:write (open the DM), reactions:write (tick a reply)
#   event   message.im
#   home    the Messages tab, writable, so people can DM him
display_information:
  name: Bruce
  description: Design Assistant
  background_color: "#0d0d0d"
features:
  # Agent mode (R55 addendum, 6 Oct 2026): Bruce in Slack's agent pane. Turn on "Agents" in the app settings as well.
  agent_view:
    agent_description: "Gushwork's design agent. Brand files in any format, a landing page, one-pager, deck or banner on the design system, and a line to Utsav for anything else."
    suggested_prompts:
      - title: Send me the logo
        message: Send me the Gushwork logo, svg and png
      - title: Brand colours and fonts
        message: Send me the brand colours and fonts
      - title: Build a one-pager
        message: "Build a one-pager. Audience: ... Offer: ... Call to action: ..."
      - title: Which template do I use?
        message: Which template should I use for a ...
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Bruce Wayne
    always_online: true
oauth_config:
  scopes:
    bot:
      - reactions:read
      - reactions:write
      - app_mentions:read
      - channels:history
      - chat:write
      - files:write
      - groups:history
      - im:history
      - im:write
      - incoming-webhook
      - users:read
      - assistant:write
  pkce_enabled: false
settings:
  interactivity:
    is_enabled: true
    request_url: https://design.gushwork.ai/api/slack-events
  event_subscriptions:
    request_url: https://design.gushwork.ai/api/slack-events
    bot_events:
      - app_mention
      - message.im
      - reaction_added
      - app_home_opened
      - app_context_changed
      - agent_session_stopped
      - agent_session_title_changed
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  app_level_token_rotation_enabled: false
  is_mcp_enabled: false
