<!doctype html>
<!-- OG image SOURCE for the case-study template — renders to a static 1200×630
     PNG, same pattern as assets/og/_source.html. Rebuilt against a second,
     simpler Figma reference frame (2PbNu2kGHalHhMUfFyFoeG, node 1684:12373)
     after the first reference (1607:425 — topbar + hero photo + client-logo
     overlay) was dropped in favour of this one on Utsav's own call.

     Layout per the frame's own metadata (get_metadata, not eyeballed): a
     1200×630 frame, black ground, one full-bleed background asset ("Union",
     1200.625×675.625 — taller than the frame on purpose, clipped by
     overflow:hidden) and one column centred on both axes (920 wide, at frame
     x=140/y=143 — (1200-920)/2 and (630-344)/2 confirm true centring) holding
     logo → headline → button at a flat 60px gap, confirmed from the child
     nodes' own x/y: logo at 0, headline at 84 (=24 logo height + 60 gap),
     button at 288 (=84 + 144 headline height + 60 gap).

     The background is the frame's real downloaded vector
     (assets/og/case-study-grid.svg — an evenodd grid lattice filled with a
     radial gradient, dark at centre fading to lighter grey at the edges, 40%
     opacity), not a CSS approximation. A CSS mask attempt on the previous
     reference frame had the fade direction backwards — caught only by
     opening the real asset file instead of trusting the bounding-box JSON.

     Headline and button link are this template's own content (the case
     study's actual h1 and URL), not the reference frame's own sample copy
     ("John Maye…") — same convention every other generated slot here uses.

     TO GENERATE A NEW CASE STUDY'S OG IMAGE: swap the headline text and the
     button's href below to that case's own. Then screenshot this file at
     exactly 1200×630 (no scaling) to produce the static PNG a
     `<meta property="og:image">` tag needs — OG consumers (Slack, X,
     iMessage, etc.) fetch a static image URL, they don't render HTML. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image source — Cutting Edge Plasma</title>
<link rel="stylesheet" href="../../../../foundation/tokens.css">
<style>
@font-face{font-family:'Vert Grotesk Display';src:url('../../../../fonts/Vert_Grotesk_Display_VF.ttf') format('truetype-variations');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url('../../../../fonts/Inter-VariableFont_opsz_wght.ttf') format('truetype-variations');font-weight:100 900;font-style:normal;font-display:swap}

*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  position:relative;background:var(--gw-color-black);
  font-family:var(--gw-font-body);
}

/* Native size (1200.625×675.625) placed at the frame's own 0,0 — the JSX's
   left:calc(50%+0.31px)/translateX(-50%) is Figma's own centring math for
   this exact width, algebraically the same as left:0 at this size. Height
   overflows the 630 frame on purpose; overflow:hidden on html/body clips it,
   matching what the reference frame itself does. */
.og-grid{position:absolute;left:0;top:0;width:1200.625px;height:675.625px;display:block}

.og-content{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:920px;display:flex;flex-direction:column;align-items:center;gap:60px;
}
.og-content .og-logo{height:24px;width:auto;display:block}
.og-content h1{
  width:100%;text-align:center;
  font:700 60px/1.2 var(--gw-font-display);color:var(--gw-color-white);
}
.og-btn{
  display:inline-flex;align-items:center;gap:var(--gw-space-8);width:fit-content;
  padding:16px 16px 16px 20px;
  background:var(--gw-color-primary-500);color:var(--gw-color-white);
  text-decoration:none;
  border-radius:var(--gw-radius-12);
  font:var(--gw-text-body-16-med);letter-spacing:var(--gw-text-body-16-med-tracking);
}
.og-btn svg{width:16px;height:16px;display:block}
</style>
</head>
<body>
  <img class="og-grid" src="../../../../assets/og/case-study-grid.svg" alt="">

  <div class="og-content">
    <img class="og-logo" src="../../../../assets/logo/gushwork-logo-white.svg" alt="Gushwork">
    <h1>From Chasing CNC Buyers To Getting Found On Google</h1>
    <a class="og-btn" href="https://www.gushwork.ai/case-study/cutting-edge-plasma">
      See Case Study

    </a>
  </div>
</body>
</html>
