<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Gushwork Design</title>
<meta name="description" content="Sign in with your Gushwork account to open the internal pages.">
<meta name="robots" content="noindex">
<script>try{var t=localStorage.getItem('gw-theme')||'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2080%2080%22%3E%3Crect%20width%3D%2280%22%20height%3D%2280%22%20rx%3D%2220%22%20fill%3D%22%230d0d0d%22%2F%3E%3Cg%20transform%3D%22translate%2819.2%2019.2%29%20scale%280.52%29%22%3E%3Cpath%20d%3D%22M76.6088%204.56344C77.5025%202.36058%2075.8495%200%2073.4723%200H9.14286C4.0934%200%200%204.0934%200%209.14286V66.7778C0%2072.018%205.17081%2075.6829%209.9603%2073.5568C40.8494%2059.8449%2064.3785%2034.7075%2076.6088%204.56344Z%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Cpath%20d%3D%22M32.5161%2080C31.4022%2080%2030.9357%2078.5531%2031.8259%2077.8835C54.9007%2060.5265%2071.4338%2035.8047%2078.7658%208.0522C78.9403%207.39154%2080%207.51618%2080%208.19951V70.8571C80%2075.9066%2075.9066%2080%2070.8571%2080H32.5161Z%22%20fill%3D%22%23FFFFFF%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="/foundation/tokens.css">
<link rel="stylesheet" href="/shell.css">
<script src="/shell.js" defer></script>
</head>
<body data-gw-page="login">

<!-- login (488:21730). The shell draws the topbar and sidebar; this page is only
     the centred card and the grid behind it. -->
<div class="gw-login">

  <!-- The brand grid, as the same two-gradient recipe .gw-hero uses — one source
       for the pattern, not two. This is the neutral colourway: the lines take the
       chrome's own border tone and the filled cells its surface tone, so both
       follow the theme with no second block to keep in step. -->
  <div class="gw-login__grid" aria-hidden="true">
    <span class="gw-login__cell" style="left:400px;top:80px"></span>
    <span class="gw-login__cell" style="left:440px;top:120px"></span>
    <span class="gw-login__cell" style="left:800px;top:240px"></span>
    <span class="gw-login__cell" style="right:120px;bottom:200px"></span>
    <span class="gw-login__cell" style="right:280px;bottom:80px"></span>
  </div>

  <div class="gw-login__card">

    <div class="gw-login__head">
      <span class="gw-login__chip">
        <!-- The mark, from assets/logo/gushwork-symbol-white.svg — the same paths
             shell.js draws in the topbar chip, filled with currentColor. -->
        <svg viewBox="0 0 80 80" fill="none" aria-hidden="true">
          <path d="M76.6088 4.56344C77.5025 2.36058 75.8495 0 73.4723 0H9.14286C4.0934 0 0 4.0934 0 9.14286V66.7778C0 72.018 5.17081 75.6829 9.9603 73.5568C40.8494 59.8449 64.3785 34.7075 76.6088 4.56344Z" fill="currentColor"/>
          <path d="M32.5161 80C31.4022 80 30.9357 78.5531 31.8259 77.8835C54.9007 60.5265 71.4338 35.8047 78.7658 8.0522C78.9403 7.39154 80 7.51618 80 8.19951V70.8571C80 75.9066 75.9066 80 70.8571 80H32.5161Z" fill="currentColor"/>
        </svg>
      </span>
      <div class="gw-login__copy">
        <h1>You&rsquo;ll need to log in</h1>
        <p>Log in using your Gushwork email id to get access.</p>
      </div>
    </div>

    <!-- BOTH doors ship, and the server says which are open — the same thing
         modalHTML() does in shell.js, so the two entrances can never disagree
         about what is available. Both start hidden: /api/auth/me reveals the
         ones authModes() reports, so a door is never drawn onto a page that
         cannot honour it.

         628:5272. A link, not a button: it starts an OAuth redirect, which is a
         navigation. `next` is appended below. -->
    <a class="gw-login__google" href="/api/auth/login" data-google-href hidden>
      <!-- Google's mark, from assets/brand/google-g.svg — the same four paths
           shell.js draws in the modal. Brand artwork: it keeps its own colours
           in both themes and is never recoloured. -->
      <svg class="gw-login__g" viewBox="0 0 17.64 18" fill="none" aria-hidden="true">
        <path d="M8.99986 7.36361V10.8491H13.8435C13.6308 11.97 12.9925 12.9191 12.0353 13.5573L14.9562 15.8237C16.658 14.2528 17.6398 11.9455 17.6398 9.20461C17.6398 8.56644 17.5826 7.95274 17.4762 7.36371L8.99986 7.36361Z" fill="#4285F4"/>
        <path d="M3.95601 10.713L3.29723 11.2173L0.965378 13.0336C2.44628 15.9709 5.48151 18 8.99967 18C11.4296 18 13.4669 17.1982 14.956 15.8237L12.0351 13.5573C11.2333 14.0973 10.2105 14.4246 8.99967 14.4246C6.65968 14.4246 4.67156 12.8455 3.95969 10.7182L3.95601 10.713Z" fill="#34A853"/>
        <path d="M0.965384 4.96636C0.351781 6.17722 0 7.54361 0 8.99994C0 10.4563 0.351781 11.8227 0.965384 13.0335C0.965384 13.0417 3.95998 10.7099 3.95998 10.7099C3.77998 10.1699 3.67359 9.5972 3.67359 8.99985C3.67359 8.4025 3.77998 7.82981 3.95998 7.28981L0.965384 4.96636Z" fill="#FBBC05"/>
        <path d="M8.99985 3.58363C10.3253 3.58363 11.5035 4.0418 12.4444 4.92545L15.0216 2.34821C13.4589 0.891874 11.4299 0 8.99985 0C5.4817 0 2.44628 2.02091 0.965378 4.96637L3.95988 7.29001C4.67166 5.16271 6.65986 3.58363 8.99985 3.58363Z" fill="#EA4335"/>
      </svg>
      <span>Continue with Google</span>
      <svg class="gw-login__arrow" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224.49,136.49l-72,72a12,12,0,0,1-17-17L187,140H40a12,12,0,0,1,0-24H187L135.51,64.49a12,12,0,0,1,17-17l72,72A12,12,0,0,1,224.49,136.49Z"/></svg>
    </a>

    <!-- Only drawn when BOTH doors are open, which is the state README-auth.md
         calls out as temporary: close the password once Google works. -->
    <div class="gw-login__or" data-or hidden><span>or</span></div>

    <!-- The password stopgap. Not in 488:21730 — that frame draws the finished
         Google-only state — so this borrows the field and blue button from the
         same node's previous revision rather than inventing a second idiom. -->
    <form class="gw-login__pw" data-pw-form hidden>
      <label class="gw-login__label" for="gw-login-pw">Team password</label>
      <div class="gw-login__field">
        <input class="gw-login__input" id="gw-login-pw" name="password" type="password"
               autocomplete="current-password" required
               placeholder="Enter the team password">
      </div>
      <p class="gw-login__err" data-pw-err hidden role="alert"></p>
      <button class="gw-login__submit" type="submit">
        <span>Continue</span>
        <svg class="gw-login__arrow" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224.49,136.49l-72,72a12,12,0,0,1-17-17L187,140H40a12,12,0,0,1,0-24H187L135.51,64.49a12,12,0,0,1,17-17l72,72A12,12,0,0,1,224.49,136.49Z"/></svg>
      </button>
    </form>

    <p class="gw-login__note" data-login-note hidden></p>
  </div>
</div>

<script>
(function () {
  /* Carry the gated path the middleware bounced us off, so the callback can
     send you back to it. safeNext() on the server is what actually validates
     it — this only forwards what arrived. */
  var params = new URLSearchParams(location.search);
  var next = params.get('next');
  var go = document.querySelector('[data-google-href]');
  if (go && next) go.href = '/api/auth/login?next=' + encodeURIComponent(next);

  var note = document.querySelector('[data-login-note]');
  var or   = document.querySelector('[data-or]');
  var form = document.querySelector('[data-pw-form]');

  /* Draw only the doors authModes() reports. On a failed probe fall back to the
     Google button — it is the designed state, and it explains its own 503 —
     rather than leaving an empty card. */
  function render(modes) {
    /* With nothing configured the Google button still stands — it is the
       designed state, and the note below explains why it will not let you in.
       An empty card would say less and look broken. */
    var none = !modes.google && !modes.password;
    if (go)   go.hidden   = !(modes.google || none);
    if (form) form.hidden = !modes.password;
    if (or)   or.hidden   = !(modes.google && modes.password);
    if (!note) return;
    if (none) {
      note.textContent = 'No way in is configured yet. Set SITE_PASSWORD, or the Google ' +
        'OAuth client, on the Vercel project.';
      note.hidden = false;
    } else if (!modes.google) {
      note.textContent = 'Google sign-in is not switched on yet, so the team password is ' +
        'the way in for now.';
      note.hidden = false;
    }
  }

  fetch('/api/auth/me', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (me) {
      render((me && me.modes) || { google: true, password: false });
    })
    .catch(function () { render({ google: true, password: false }); });

  /* Same exchange shell.js's modal makes, against the same endpoint: the reply
     carries the validated `next`, so the server decides where you land. */
  if (form) form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var input = form.querySelector('input[name="password"]');
    var err   = form.querySelector('[data-pw-err]');
    var btn   = form.querySelector('button[type="submit"]');
    err.hidden = true;
    btn.disabled = true;

    fetch('/api/auth/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ password: input.value, next: next || '/' })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (res.ok && res.j.ok) { location.href = res.j.next || next || '/'; return; }
        err.textContent = (res.j && res.j.error) || 'That did not work.';
        err.hidden = false;
        input.select();
      })
      .catch(function () {
        btn.disabled = false;
        err.textContent = 'Could not reach the server.';
        err.hidden = false;
      });
  });
})();
</script>

</body></html>
