<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2080%2080%22%3E%3Crect%20width%3D%2280%22%20height%3D%2280%22%20rx%3D%2220%22%20fill%3D%22%230d0d0d%22%2F%3E%3Cg%20transform%3D%22translate%2819.2%2019.2%29%20scale%280.52%29%22%3E%3Cpath%20d%3D%22M76.6088%204.56344C77.5025%202.36058%2075.8495%200%2073.4723%200H9.14286C4.0934%200%200%204.0934%200%209.14286V66.7778C0%2072.018%205.17081%2075.6829%209.9603%2073.5568C40.8494%2059.8449%2064.3785%2034.7075%2076.6088%204.56344Z%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Cpath%20d%3D%22M32.5161%2080C31.4022%2080%2030.9357%2078.5531%2031.8259%2077.8835C54.9007%2060.5265%2071.4338%2035.8047%2078.7658%208.0522C78.9403%207.39154%2080%207.51618%2080%208.19951V70.8571C80%2075.9066%2075.9066%2080%2070.8571%2080H32.5161Z%22%20fill%3D%22%23FFFFFF%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">

<style>
/* /admin/usage-log — the session log, read back for the owner.

   SHELL. This is an admin page inside the design-system site, so it takes the site's own
   chrome (shell.css / shell.js, the same as /admin/access-control) rather than a
   `dashboard-build` rail: a rail whose only row is this page would be chrome with nothing to
   navigate. The CONTENT is dashboard: v2 stat-card, metric-card, card-shell, section-header,
   table-row, pagination, tab-group, input and empty-state, from exports/dashboard/v2.

   Width. 1120 is the measured v2 page-header / section-header width, not a value chosen here.
   Everything not measured is marked NOT MEASURED below. */
body[data-gw-page="visits"] .sg__main { grid-column: 1 / -1; max-width: 1120px; gap: var(--gw-space-24); }
body[data-gw-page="visits"] .sg__main > * { min-width: 0; }

/* ── theme aliases ─────────────────────────────────────────────────────────────────────
   Declared in BOTH themes on purpose: an alias set in one block silently keeps the other
   theme's value. Light is measured; dark is the measured light→dark map in v2/README.md,
   and where the dark screen draws nothing (tab hover, tooltip, filled-button hover) the
   value is DERIVED one step toward the element's own selected state and marked so. */
:root {
  --ul-label:      var(--gw-color-neutral-700);
  --ul-value:      var(--gw-color-black);
  --ul-sub:        var(--gw-color-neutral-500);
  --ul-cell:       var(--gw-color-neutral-600);
  --ul-icon:       var(--gw-color-neutral-600);
  --ul-track:      var(--gw-color-neutral-200);
  --ul-good:       var(--gw-color-green-400);
  --ul-grid:       var(--gw-color-neutral-100);
  --ul-hdr-bg:     var(--gw-color-neutral-25);
  --ul-hdr-line:   var(--gw-color-neutral-100);
  --ul-hdr-fg:     var(--gw-color-neutral-700);
  --ul-row-line:   var(--gw-color-neutral-25);
  --ul-row-bg:     transparent;
  --ul-row-hover:  var(--gw-color-neutral-25);
  --ul-ctl-line:   var(--gw-color-neutral-200);
  --ul-ctl-fg:     var(--gw-color-neutral-900);
  --ul-ctl-hover:  var(--gw-color-neutral-35);
  --ul-field-bg:   var(--gw-color-white);
  --ul-field-line: var(--gw-color-neutral-400);
  --ul-field-fg:   var(--gw-color-neutral-900);
  --ul-field-ph:   var(--gw-color-neutral-400);
  --ul-tabs-bg:    var(--gw-color-neutral-50);
  --ul-tabs-line:  var(--gw-color-neutral-100);
  --ul-tab-fg:     var(--gw-color-neutral-900);
  --ul-tab-hover:  var(--gw-color-neutral-100);
  --ul-tab-on-bg:  var(--gw-color-black);
  --ul-tab-on-fg:  var(--gw-color-white);
  --ul-prim-bg:    var(--gw-color-black);
  --ul-prim-fg:    var(--gw-color-white);
  --ul-prim-hover: var(--gw-color-neutral-850);
  --ul-tip-bg:     var(--gw-color-neutral-25);
  --ul-tip-line:   var(--gw-color-neutral-100);
  --ul-tip-head:   var(--gw-color-neutral-500);
  --ul-tip-main:   var(--gw-color-neutral-900);
  --ul-skel:       var(--gw-color-neutral-100);
  --ul-circle:     var(--gw-color-neutral-50);
  --ul-circle-fg:  var(--gw-color-neutral-400);
  --ul-b-ok-bg:    var(--gw-color-green-25);
  --ul-b-ok-fg:    var(--gw-color-green-500);
  --ul-b-no-bg:    var(--gw-color-neutral-50);
  --ul-b-no-fg:    var(--gw-color-neutral-700);
  --ul-disabled:   var(--gw-color-neutral-250);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ul-label:      var(--gw-color-neutral-400);
    --ul-value:      var(--gw-color-white);
    --ul-sub:        var(--gw-color-neutral-500);       /* unchanged in dark, measured */
    --ul-cell:       var(--gw-color-neutral-400);
    --ul-icon:       var(--gw-color-neutral-400);
    --ul-track:      var(--gw-color-neutral-600);
    --ul-good:       var(--gw-color-green-300);
    --ul-grid:       var(--gw-color-neutral-900);
    --ul-hdr-bg:     var(--gw-color-black);
    --ul-hdr-line:   var(--gw-color-neutral-900);
    --ul-hdr-fg:     var(--gw-color-neutral-100);
    --ul-row-line:   var(--gw-color-neutral-900);
    --ul-row-bg:     var(--gw-color-black);
    --ul-row-hover:  var(--gw-color-neutral-900);       /* RULED in v2/data-table.md, not drawn */
    --ul-ctl-line:   var(--gw-color-neutral-850);
    --ul-ctl-fg:     var(--gw-color-neutral-50);
    --ul-ctl-hover:  var(--gw-color-neutral-850);       /* DERIVED: one step toward the border */
    --ul-field-bg:   var(--gw-color-neutral-900);       /* DERIVED from the measured dark select */
    --ul-field-line: var(--gw-color-neutral-600);
    --ul-field-fg:   var(--gw-color-white);
    --ul-field-ph:   var(--gw-color-neutral-400);
    --ul-tabs-bg:    var(--gw-color-neutral-900);
    --ul-tabs-line:  var(--gw-color-neutral-900);
    --ul-tab-fg:     var(--gw-color-white);
    --ul-tab-hover:  var(--gw-color-neutral-850);       /* DERIVED: hover moves toward the active fill */
    --ul-tab-on-bg:  var(--gw-color-white);             /* the active tab inverts */
    --ul-tab-on-fg:  var(--gw-color-black);
    --ul-prim-bg:    var(--gw-color-white);             /* dark primary is a full inversion */
    --ul-prim-fg:    var(--gw-color-neutral-900);
    --ul-prim-hover: var(--gw-color-neutral-100);       /* DERIVED */
    --ul-tip-bg:     var(--gw-color-neutral-900);       /* DERIVED: the dark screen draws no tooltip */
    --ul-tip-line:   var(--gw-color-neutral-850);
    --ul-tip-head:   var(--gw-color-neutral-400);
    --ul-tip-main:   var(--gw-color-white);
    --ul-skel:       var(--gw-color-neutral-900);
    --ul-circle:     var(--gw-color-neutral-900);
    --ul-circle-fg:  var(--gw-color-neutral-400);
    --ul-b-ok-bg:    var(--gw-color-green-alpha-10);    /* dark tint: Alpha/10 fill + /300 label */
    --ul-b-ok-fg:    var(--gw-color-green-300);
    --ul-b-no-bg:    var(--gw-color-neutral-900);
    --ul-b-no-fg:    var(--gw-color-neutral-400);
    --ul-disabled:   var(--gw-color-neutral-600);
  }
}
:root[data-theme="dark"] {
    --ul-label:      var(--gw-color-neutral-400);
    --ul-value:      var(--gw-color-white);
    --ul-sub:        var(--gw-color-neutral-500);       /* unchanged in dark, measured */
    --ul-cell:       var(--gw-color-neutral-400);
    --ul-icon:       var(--gw-color-neutral-400);
    --ul-track:      var(--gw-color-neutral-600);
    --ul-good:       var(--gw-color-green-300);
    --ul-grid:       var(--gw-color-neutral-900);
    --ul-hdr-bg:     var(--gw-color-black);
    --ul-hdr-line:   var(--gw-color-neutral-900);
    --ul-hdr-fg:     var(--gw-color-neutral-100);
    --ul-row-line:   var(--gw-color-neutral-900);
    --ul-row-bg:     var(--gw-color-black);
    --ul-row-hover:  var(--gw-color-neutral-900);       /* RULED in v2/data-table.md, not drawn */
    --ul-ctl-line:   var(--gw-color-neutral-850);
    --ul-ctl-fg:     var(--gw-color-neutral-50);
    --ul-ctl-hover:  var(--gw-color-neutral-850);       /* DERIVED: one step toward the border */
    --ul-field-bg:   var(--gw-color-neutral-900);       /* DERIVED from the measured dark select */
    --ul-field-line: var(--gw-color-neutral-600);
    --ul-field-fg:   var(--gw-color-white);
    --ul-field-ph:   var(--gw-color-neutral-400);
    --ul-tabs-bg:    var(--gw-color-neutral-900);
    --ul-tabs-line:  var(--gw-color-neutral-900);
    --ul-tab-fg:     var(--gw-color-white);
    --ul-tab-hover:  var(--gw-color-neutral-850);       /* DERIVED: hover moves toward the active fill */
    --ul-tab-on-bg:  var(--gw-color-white);             /* the active tab inverts */
    --ul-tab-on-fg:  var(--gw-color-black);
    --ul-prim-bg:    var(--gw-color-white);             /* dark primary is a full inversion */
    --ul-prim-fg:    var(--gw-color-neutral-900);
    --ul-prim-hover: var(--gw-color-neutral-100);       /* DERIVED */
    --ul-tip-bg:     var(--gw-color-neutral-900);       /* DERIVED: the dark screen draws no tooltip */
    --ul-tip-line:   var(--gw-color-neutral-850);
    --ul-tip-head:   var(--gw-color-neutral-400);
    --ul-tip-main:   var(--gw-color-white);
    --ul-skel:       var(--gw-color-neutral-900);
    --ul-circle:     var(--gw-color-neutral-900);
    --ul-circle-fg:  var(--gw-color-neutral-400);
    --ul-b-ok-bg:    var(--gw-color-green-alpha-10);    /* dark tint: Alpha/10 fill + /300 label */
    --ul-b-ok-fg:    var(--gw-color-green-300);
    --ul-b-no-bg:    var(--gw-color-neutral-900);
    --ul-b-no-fg:    var(--gw-color-neutral-400);
    --ul-disabled:   var(--gw-color-neutral-600);
}

/* Focus. No v2 component defines one; --gw-focus-ring on :focus-visible is mandatory (states.md). */
.ul-scope :is(button, a, input, select, [tabindex]):focus-visible {
  outline: var(--gw-focus-ring);
  outline-offset: var(--gw-focus-offset);
}

/* ── controls row (page-header controls-row) ─────────────────────────────────────────── */
.ul-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--gw-space-16); flex-wrap: wrap; }
/* tab-group: 36h, radius/12, pad 4, gap 4. The 1px border is an inset shadow, not a CSS
   border, so the 28h tab-items still fit — a border under border-box would eat 2px of them. */
.ul-tabs { display: inline-flex; height: 36px; padding: var(--gw-space-4); gap: var(--gw-space-4);
  border-radius: var(--gw-radius-12); background: var(--ul-tabs-bg); box-shadow: inset 0 0 0 1px var(--ul-tabs-line); }
.ul-tab { height: 28px; padding: 0 var(--gw-space-12); border: 0; border-radius: var(--gw-radius-8);
  background: none; font: var(--gw-text-button-12); color: var(--ul-tab-fg); cursor: pointer;
  transition: background var(--gw-motion-fast); }
.ul-tab:hover { background: var(--ul-tab-hover); }
.ul-tab[aria-selected="true"] { background: var(--ul-tab-on-bg); color: var(--ul-tab-on-fg); }
.ul-refresh { display: flex; align-items: center; gap: var(--gw-space-8); }
.ul-refresh__t { font: var(--gw-text-button-10); color: var(--ul-label); }
/* icon-button Size=28: radius/8, 12px glyph, 1px neutral/200 (inset, same reason as above) */
.ul-ib { width: 28px; height: 28px; padding: 0; display: inline-grid; place-items: center; border: 0;
  border-radius: var(--gw-radius-8); background: none; color: var(--ul-icon); cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--ul-ctl-line); transition: background var(--gw-motion-fast); }
.ul-ib:hover:not(:disabled) { background: var(--ul-ctl-hover); }
.ul-ib:disabled { color: var(--ul-disabled); cursor: default; }
.ul-ib svg { width: 12px; height: 12px; display: block; }
.ul-ib[aria-busy="true"] svg { animation: ul-spin 1s linear infinite; }
@keyframes ul-spin { to { transform: rotate(360deg); } }

/* ── stat-card / metric-card ─────────────────────────────────────────────────────────── */
.ul-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gw-space-8); }
.ul-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gw-space-8); }
/* stat-card 218 x 132 is the intrinsic size; these fill their column (a floor, not a width). */
.ul-stat, .ul-metric { background: var(--s-card-bg); box-shadow: inset 0 0 0 1px var(--s-card-border);
  border-radius: var(--gw-radius-12); display: flex; flex-direction: column; gap: var(--gw-space-16); min-width: 0; }
.ul-stat { padding: var(--gw-space-12); min-height: 132px; }
.ul-metric { padding: var(--gw-space-16); min-height: 124px; }   /* metric-card pad 16, not 12: measured */
.ul-stat__lab { display: flex; align-items: center; gap: var(--gw-space-8); padding: 0 var(--gw-space-4); }
.ul-lab { flex: 1; font: var(--gw-text-body-12-med); color: var(--ul-label); }
.ul-dot { width: 8px; height: 8px; border-radius: var(--gw-radius-20); background: var(--gw-color-neutral-400); flex: none; }
.ul-stat__body { display: flex; flex-direction: column; gap: var(--gw-space-8); padding: 0 var(--gw-space-4); margin-top: auto; }
.ul-stat__row { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--gw-space-8); }
.ul-val { display: flex; flex-direction: column; gap: var(--gw-space-4); min-width: 0; }
/* Dashboard/display-28-med — HAS NO TOKEN (v2/README.md, R15). Literal spec: Vert Grotesk
   Display Medium 500, 28 / 120%. Deliberately not --gw-text-h6 (600 / 26). */
.ul-num { font: 500 28px/1.2 var(--gw-font-display); color: var(--ul-value); }
.ul-note { font: var(--gw-text-body-12-med); color: var(--ul-sub); }
.ul-pct { font: var(--gw-text-body-12-med); color: var(--ul-sub); }
.ul-metric__body { display: flex; flex-direction: column; gap: var(--gw-space-4); margin-top: auto; }
/* progress-bar Size=md: 4px, radius/40, track neutral/200, fill green/400 (dark: 600 / green/300) */
.ul-pb { height: 4px; border-radius: var(--gw-radius-40); background: var(--ul-track); overflow: hidden; }
.ul-pb > i { display: block; height: 100%; border-radius: var(--gw-radius-40); background: var(--ul-good); }
/* skeleton: one block per real element, never a 0 while data is in flight (states.md) */
.sk { display: block; background: var(--ul-skel); border-radius: var(--gw-radius-4);
  animation: ul-pulse 960ms ease-in-out infinite alternate; }   /* --gw-motion-fast x 8 */
@keyframes ul-pulse { from { opacity: 1; } to { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } .ul-ib[aria-busy="true"] svg { animation: none; } }

/* ── card-shell lg + section-header ──────────────────────────────────────────────────── */
.ul-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gw-space-24); margin-top: var(--gw-space-24); }
@media (max-width: 960px) { .ul-pair { grid-template-columns: minmax(0, 1fr); } }
.ul-sec { background: var(--s-card-bg); box-shadow: inset 0 0 0 1px var(--s-card-border);
  border-radius: var(--gw-radius-16); padding: var(--gw-space-12); display: flex; flex-direction: column; gap: var(--gw-space-16); }
.ul-sh { display: flex; align-items: center; justify-content: space-between; gap: var(--gw-space-8);
  padding: 0 var(--gw-space-8); min-height: 24px; flex-wrap: wrap; }
.ul-sh__t { display: flex; align-items: baseline; gap: var(--gw-space-8); min-width: 0; }
.ul-sh h2 { margin: 0; font: var(--gw-text-body-16-sem); color: var(--ul-value); }
.ul-sh__q { font: var(--gw-text-body-16-reg); color: var(--ul-sub); }
.ul-inner { border-radius: var(--gw-radius-8); padding: 0 var(--gw-space-8) var(--gw-space-8); }

/* ── Graph / Line: single series + gradient fill ────────────────────────────────────── */
/* Plot height 240 is NOT MEASURED. The measured Line is 400 tall in a 1028-wide chart; this
   sits inside a card beside two other sections, so it is shorter. Chosen, and said so. */
.ul-line { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--gw-space-12);
  /* room above the top label, below the dates, and right of the last date (centred on the plot edge) */
  padding: var(--gw-space-16) var(--gw-space-32) var(--gw-space-16) var(--gw-space-8); }
.ul-line__y { position: relative; height: 240px; width: 32px; }
.ul-line__y span, .ul-line__x span { font: 500 12px/1 var(--gw-font-body); letter-spacing: -.2px; color: var(--ul-cell); }
.ul-line__y span { position: absolute; right: 0; transform: translateY(-50%); }
.ul-plot { position: relative; height: 240px; cursor: crosshair; }
.ul-plot__g { position: absolute; left: 0; right: 0; height: 1px; background: var(--ul-grid); }
.ul-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ul-line__x { grid-column: 2; position: relative; height: 12px; margin-top: var(--gw-space-16); }
.ul-line__x span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ul-cross { position: absolute; top: 0; bottom: 0; width: 1px; pointer-events: none; display: none;
  /* crosshair is dashed 2 2 in the measured Line */
  background: repeating-linear-gradient(to bottom, var(--gw-color-primary-500) 0 2px, transparent 2px 4px); }
.ul-dotp { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: var(--gw-radius-full);
  background: var(--gw-color-primary-500); box-shadow: 0 0 0 2px var(--s-card-bg); pointer-events: none; display: none; }
/* Line tooltip: neutral/25, 1px neutral/100 (measured 0.5, rounded per R5), radius/4, p-8, gap-8, shadow S2 */
.ul-tip { position: absolute; z-index: 2; min-width: 148px; padding: var(--gw-space-8); display: none; pointer-events: none;
  flex-direction: column; gap: var(--gw-space-8); background: var(--ul-tip-bg); box-shadow: inset 0 0 0 1px var(--ul-tip-line), var(--gw-shadow-s2);
  border-radius: var(--gw-radius-4); }
.ul-tip__h { display: flex; align-items: center; gap: 2px; font: var(--gw-text-body-10-med); color: var(--ul-tip-head); }
/* .ul-plot svg (the chart) would otherwise pin this icon to the tooltip's corner */
.ul-tip__h svg { position: static; inset: auto; flex: none; width: 12px; height: 12px; }
.ul-tip__m { font: var(--gw-text-body-10-med); color: var(--ul-tip-main); }
.ul-tip__b { border-left: 1px dashed var(--gw-color-neutral-500); padding: var(--gw-space-4) 0 var(--gw-space-4) var(--gw-space-8);
  display: flex; flex-direction: column; gap: var(--gw-space-4); }
/* The measured breakdown rows are 8px, which is below legibility. Built at 10 and reported. */
.ul-tip__r { display: flex; justify-content: space-between; gap: var(--gw-space-12); font: var(--gw-text-body-10-med); }
.ul-tip__r span:first-child { color: var(--ul-cell); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ul-tip__r span:last-child { color: var(--ul-label); }

/* ── Graph / Bar: bars are primary/500, 10 tall, radius 2 on the trailing corners only ─── */
.ul-bars { display: flex; flex-direction: column; gap: var(--gw-space-20); padding: var(--gw-space-8) 0; }
.ul-bars__r { display: grid; grid-template-columns: var(--ul-lw, 96px) minmax(0, 1fr); align-items: center; gap: var(--gw-space-12); }
.ul-bars__l { font: 500 12px/1.2 var(--gw-font-body); letter-spacing: -.2px; color: var(--ul-cell); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ul-bars__t { padding-right: 52px; min-width: 0; }
.ul-bar-b { position: relative; height: 10px; min-width: 2px; background: var(--gw-color-primary-500); border-radius: 0 2px 2px 0; }
.ul-bar-b span { position: absolute; left: calc(100% + 4px); top: -2px; white-space: nowrap;
  font: 500 10px/1 var(--gw-font-body); letter-spacing: -.2px; color: var(--ul-tip-main); }

/* ── input Type=search, select, buttons ───────────────────────────────────────────────── */
.ul-tools { display: flex; align-items: center; gap: var(--gw-space-8); flex-wrap: wrap; }
.ul-input { position: relative; display: block; }
.ul-input svg { position: absolute; left: var(--gw-space-12); top: 10px; width: 16px; height: 16px; color: var(--ul-field-ph); pointer-events: none; }

  'use strict';
  var API = '/api/visits';
  var ICON = {"arrow-clockwise":"<path d=\"M240,56v48a8,8,0,0,1-8,8H184a8,8,0,0,1,0-16H211.4L184.81,71.64l-.25-.24a80,80,0,1,0-1.67,114.78,8,8,0,0,1,11,11.63A95.44,95.44,0,0,1,128,224h-1.32A96,96,0,1,1,195.75,60L224,85.8V56a8,8,0,1,1,16,0Z\"/>","lock":"<path d=\"M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-68-56a12,12,0,1,1-12-12A12,12,0,0,1,140,152Z\"/>","warning-circle":"<path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,172Z\"/>","magnifying-glass":"<path d=\"M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z\"/>"};
  function icon(n) { return '<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">' + (ICON[n] || '') + '</svg>'; }
  /* Rows come from our own endpoint but the path is a request path, so nothing goes into markup unescaped. */
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function $(id) { return document.getElementById(id); }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  var DAY = 86400000;
  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + 's ago';
    var m = Math.round(s / 60); if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60); if (h < 48) return h + ' h ago';
    return Math.round(h / 24) + ' days ago';
  }
  function fmtWhen(d) { return d.toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }

  /* Which part of the site a path belongs to. */
  var TOOLS = ['/internal/tools', '/internal/employee-id-card', '/internal/email-signature'];
  var AREAS = ['All', 'Tools', 'Staging', 'Templates', 'Library', 'Admin', 'Hub'];
  function areaOf(p) {
    if (TOOLS.indexOf(p) !== -1) return 'Tools';
    if (p.indexOf('/internal/staging') === 0) return 'Staging';
    if (p.indexOf('/internal/templates') === 0) return 'Templates';
    if (p.indexOf('/library') === 0) return 'Library';
    if (p.indexOf('/admin') === 0) return 'Admin';
    return 'Hub';
  }
  var TITLES = {};
  function pageName(p) {
    if (TITLES[p]) return TITLES[p];
    var last = p.split('/').filter(Boolean).pop() || 'Overview';
    return last.replace(/[-_]+/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); });
  }

  var S = { status: 'loading', rows: [], period: '30', area: 'All', shown: 25, busy: false, fetchedAt: 0 };

  function parse(raw) {
    var out = [];
    raw.forEach(function (r) {
      var d = new Date(r.at); if (isNaN(d.getTime())) return;
      out.push({ at: d, email: String(r.email || ''), path: String(r.path || '/'), kind: r.kind === 'signin' ? 'signin' : 'view', via: String(r.via || '') });
    });
    return out;
  }
  function scoped() {
    var cut = S.period === 'all' ? 0 : Date.now() - (+S.period) * DAY;
    return S.rows.filter(function (r) {
      if (r.at.getTime() < cut) return false;
      if (S.area !== 'All') return r.kind === 'view' && areaOf(r.path) === S.area;
      return true;
    });
  }

  function metric(label, value, note) {
    return '<div class="ul-metric"><span class="ul-lab">' + esc(label) + '</span><div class="ul-metric__body"><span class="ul-num">' + esc(value) +
      '</span><span class="ul-note">' + esc(note) + '</span></div></div>';
  }
  function th(t) { return '<div role="columnheader"><span class="ul-th"><span class="ul-th--plain">' + esc(t) + '</span></span></div>'; }
  function table(cols, heads, rows, empty) {
    var h = '<div class="ul-row ul-row--h" role="row">' + heads.map(th).join('') + '</div>';
    return '<div class="ul-tbl" role="table" style="--vs-cols:' + cols + '">' + h +
      (rows.length ? rows.join('') : '<div class="ul-empty"><div class="ul-empty__copy"><h2>' + esc(empty) + '</h2></div></div>') + '</div>';
  }
  function cell(t, cls, title) { return '<div class="ul-c ' + (cls || '') + '" role="cell" title="' + esc(title || t) + '">' + esc(t) + '</div>'; }
  function who(e) { return e === '(shared password)' ? 'Shared password' : e; }

  function renderAll() {
    var rows = scoped();
    var signins = rows.filter(function (r) { return r.kind === 'signin'; });
    var views = rows.filter(function (r) { return r.kind === 'view'; });
    var people = {}, pages = {};
    rows.forEach(function (r) {
      var p = people[r.email] || (people[r.email] = { email: r.email, views: 0, signins: 0, last: r.at, areas: {} });
      if (r.at > p.last) p.last = r.at;
      if (r.kind === 'signin') p.signins++; else { p.views++; var a = areaOf(r.path); p.areas[a] = (p.areas[a] || 0) + 1; }
    });
    views.forEach(function (r) {
      var g = pages[r.path] || (pages[r.path] = { path: r.path, views: 0, who: {}, last: r.at });
      g.views++; g.who[r.email] = 1; if (r.at > g.last) g.last = r.at;
    });
    var plist = Object.keys(people).map(function (k) { return people[k]; }).sort(function (a, b) { return b.last - a.last; });
    var glist = Object.keys(pages).map(function (k) { return pages[k]; }).sort(function (a, b) { return b.views - a.views || b.last - a.last; });

    var lastAt = rows.length ? rows.reduce(function (m, r) { return r.at > m ? r.at : m; }, rows[0].at) : null;
    $('vs-metrics').innerHTML =
      metric('Sign-ins', String(signins.length), (function (n) { return n + (n === 1 ? ' person' : ' people'); })(Object.keys(signins.reduce(function (o, r) { o[r.email] = 1; return o; }, {})).length) + ' signed in') +
      metric('Page views', String(views.length), plural(glist.length, 'page') + ' opened') +
      metric('Active people', String(plist.length), lastAt ? 'last visit ' + ago(Date.now() - lastAt.getTime()) : 'nothing logged yet');

    $('vs-q-people').textContent = (plist.length + (plist.length === 1 ? ' person' : ' people'));
    $('vs-people').innerHTML = table('minmax(200px,1.6fr) 100px 100px minmax(120px,1fr) minmax(120px,1fr)', ['Person', 'Sign-ins', 'Page views', 'Last seen', 'Opens most'],
      plist.map(function (p) {
        var top = Object.keys(p.areas).sort(function (a, b) { return p.areas[b] - p.areas[a]; })[0] || '';
        return '<div class="ul-row ul-row--d" role="row">' + cell(who(p.email), 'ul-c--who', p.email) + cell(String(p.signins)) + cell(String(p.views)) + cell(ago(Date.now() - p.last.getTime()), '', p.last.toISOString()) + cell(top) + '</div>';
      }), 'No visits in this view');

    $('vs-q-pages').textContent = 'most opened, ' + plural(glist.length, 'page');
    $('vs-pages').innerHTML = table('minmax(220px,2fr) 110px 90px 90px minmax(120px,1fr)', ['Page', 'Area', 'Views', 'People', 'Last opened'],
      glist.slice(0, 20).map(function (g) {
        return '<div class="ul-row ul-row--d" role="row">' + cell(pageName(g.path), 'ul-c--who', g.path) + cell(areaOf(g.path)) + cell(String(g.views)) + cell(String(Object.keys(g.who).length)) + cell(ago(Date.now() - g.last.getTime()), '', g.last.toISOString()) + '</div>';
      }), 'No pages opened in this view');

    var recent = rows.slice().sort(function (a, b) { return b.at - a.at; });
    $('vs-q-recent').textContent = 'newest first, ' + plural(recent.length, 'event');
    $('vs-recent').innerHTML = table('160px minmax(180px,1.4fr) minmax(200px,2fr) 110px', ['When', 'Person', 'Page', 'Event'],
      recent.slice(0, S.shown).map(function (r) {
        var evt = r.kind === 'signin' ? 'Signed in' + (r.via === 'password' ? ' (password)' : '') : 'Opened';
        return '<div class="ul-row ul-row--d" role="row">' + cell(fmtWhen(r.at), '', r.at.toISOString()) + cell(who(r.email), 'ul-c--who', r.email) +
          cell(r.kind === 'signin' ? '—' : pageName(r.path), '', r.path) + cell(evt) + '</div>';
      }), 'No visits in this view');
    $('vs-more').innerHTML = recent.length > S.shown ? '<button class="ul-btn" id="vs-more-btn" type="button">Show 25 more</button>' : '';
    var mb = $('vs-more-btn'); if (mb) mb.addEventListener('click', function () { S.shown += 25; renderAll(); });
  }

  var BLOCK = {
    forbidden:    { icon: 'lock', title: 'Owners only', body: 'The visit log is visible to the site owner and nobody else.' },
    signin:       { icon: 'lock', title: 'Sign in to see visits', body: 'Use your @gushwork.ai account. You will come back to this page afterwards.', action: 'Sign in' },
    unconfigured: { icon: 'warning-circle', title: 'The log store is not connected', body: 'Add the Upstash variables to the project and redeploy, then reload this page.' },
    empty:        { icon: 'magnifying-glass', title: 'No visits logged yet', body: 'Rows appear here when someone signs in or opens a page behind the sign-in.' },
    error:        { icon: 'warning-circle', title: 'Could not read the visit log', body: 'The log store did not answer. Try again in a moment.', action: 'Try again' }
  };
  function renderBlocked(kind) {
    var b = BLOCK[kind];
    $('ul-blocked').innerHTML = '<div class="ul-sec"><div class="ul-empty"><div class="ul-empty__c">' + icon(b.icon) + '</div>' +
      '<div class="ul-empty__copy"><h2>' + esc(b.title) + '</h2><p>' + esc(b.body) + '</p></div>' +
      (b.action ? '<button class="ul-btn" id="ul-act" type="button">' + esc(b.action) + '</button>' : '') + '</div></div>';
    var act = $('ul-act');
    if (act) act.addEventListener('click', function () {
      if (kind === 'signin') location.href = '/?signin=required&next=' + encodeURIComponent(location.pathname); else load();
    });
  }
  function render() {
    var blocked = ['forbidden', 'signin', 'unconfigured', 'empty', 'error'].indexOf(S.status) !== -1;
    $('ul-blocked').hidden = !blocked; $('ul-app').hidden = blocked; $('ul-bar').hidden = blocked;
    if (blocked) { renderBlocked(S.status); return; }
    if (S.status === 'loading') { $('vs-metrics').innerHTML = ''; return; }
    renderAll();
    document.querySelectorAll('.ul-tab[data-period]').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-period') === S.period)); });
    document.querySelectorAll('.ul-tab[data-area]').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-area') === S.area)); });
    updated();
  }
  function updated() { $('ul-updated').textContent = S.fetchedAt ? 'Updated ' + ago(Date.now() - S.fetchedAt) : ''; }

  function load() {
    if (S.busy) return; S.busy = true; $('ul-refresh').setAttribute('aria-busy', 'true');
    if (!S.rows.length) { S.status = 'loading'; render(); }
    var idx = fetch('/search-index.json', { cache: 'force-cache' }).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; });
    fetch(API, { credentials: 'same-origin', cache: 'no-store' }).then(function (r) {
      if (r.status === 401) { S.status = 'signin'; return null; }
      if (r.status === 403) { S.status = 'forbidden'; return null; }
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (j) {
      if (!j) return;
      if (!j.configured) { S.status = 'unconfigured'; return; }
      S.rows = parse(j.rows || []); S.fetchedAt = Date.now();
      S.status = S.rows.length ? 'ready' : 'empty';
      return idx.then(function (list) { list.forEach(function (e) { var u = (e.u || '').replace(/\/+$/, '') || '/'; if (!TITLES[u] && e.t) TITLES[u] = e.t; }); });
    }).catch(function () { S.status = 'error'; }).then(function () {
      S.busy = false; $('ul-refresh').removeAttribute('aria-busy'); render();
    });
  }

  $('ul-refresh').innerHTML = icon('arrow-clockwise');
  $('vs-area-tabs').innerHTML = AREAS.map(function (a) { return '<button class="ul-tab" role="tab" data-area="' + a + '" aria-selected="' + (a === 'All') + '">' + a + '</button>'; }).join('');
  document.querySelectorAll('.ul-tab').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.hasAttribute('data-period')) S.period = b.getAttribute('data-period'); else S.area = b.getAttribute('data-area');
      S.shown = 25; render();
    });
  });
  $('ul-refresh').addEventListener('click', load);
  setInterval(updated, 10000);
  render(); load();
})();
</script>
</body></html>
