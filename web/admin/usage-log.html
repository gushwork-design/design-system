<style>
/* /admin/usage-log — the session log, read back for the owner.

   SHELL. This is an admin page inside the design-system site, so it takes the site's own
   chrome (shell.css / shell.js, the same as /admin/access-control) rather than a
   `dashboard-build` rail: a rail whose only row is this page would be chrome with nothing to
   navigate. The CONTENT is dashboard: v2 stat-card, metric-card, card-shell, section-header,
   table-row, pagination, tab-group, input and empty-state, from exports/dashboard/v2.

   Width. 1120 is the measured v2 page-header / section-header width, not a value chosen here.
   Everything not measured is marked NOT MEASURED below. */
body[data-gw-page="usage-log"] .sg__main { grid-column: 1 / -1; max-width: 1120px; gap: var(--gw-space-24); }
body[data-gw-page="usage-log"] .sg__main > * { min-width: 0; }

/* ── theme aliases ─────────────────────────────────────────────────────────────────────
   Declared in BOTH themes on purpose: an alias set in one block silently keeps the other
   theme's value. Light is measured; dark is the measured light→dark map in v2/README.md,
   and where the dark screen draws nothing (tab hover, tooltip, filled-button hover) the
   value is DERIVED one step toward the element's own selected state and marked so. */
:root {
  --ul-label:      var(--gw-color-neutral-700);
  --ul-value:      var(--gw-color-black);
  --ul-sub:        var(--gw-color-neutral-500);
  --ul-cell:       var(--gw-color-neutral-600);
  --ul-icon:       var(--gw-color-neutral-600);
  --ul-track:      var(--gw-color-neutral-200);
  --ul-good:       var(--gw-color-green-400);
  --ul-grid:       var(--gw-color-neutral-100);
  --ul-hdr-bg:     var(--gw-color-neutral-25);
  --ul-hdr-line:   var(--gw-color-neutral-100);
  --ul-hdr-fg:     var(--gw-color-neutral-700);
  --ul-row-line:   var(--gw-color-neutral-25);
  --ul-row-bg:     transparent;
  --ul-row-hover:  var(--gw-color-neutral-25);
  --ul-ctl-line:   var(--gw-color-neutral-200);
  --ul-ctl-fg:     var(--gw-color-neutral-900);
  --ul-ctl-hover:  var(--gw-color-neutral-35);
  --ul-field-bg:   var(--gw-color-white);
  --ul-field-line: var(--gw-color-neutral-400);
  --ul-field-fg:   var(--gw-color-neutral-900);
  --ul-field-ph:   var(--gw-color-neutral-400);
  --ul-tabs-bg:    var(--gw-color-neutral-50);
  --ul-tabs-line:  var(--gw-color-neutral-100);
  --ul-tab-fg:     var(--gw-color-neutral-900);
  --ul-tab-hover:  var(--gw-color-neutral-100);
  --ul-tab-on-bg:  var(--gw-color-black);
  --ul-tab-on-fg:  var(--gw-color-white);
  --ul-prim-bg:    var(--gw-color-black);
  --ul-prim-fg:    var(--gw-color-white);
  --ul-prim-hover: var(--gw-color-neutral-850);
  --ul-tip-bg:     var(--gw-color-neutral-25);
  --ul-tip-line:   var(--gw-color-neutral-100);
  --ul-tip-head:   var(--gw-color-neutral-500);
  --ul-tip-main:   var(--gw-color-neutral-900);
  --ul-skel:       var(--gw-color-neutral-100);
  --ul-circle:     var(--gw-color-neutral-50);
  --ul-circle-fg:  var(--gw-color-neutral-400);
  --ul-b-ok-bg:    var(--gw-color-green-25);
  --ul-b-ok-fg:    var(--gw-color-green-500);
  --ul-b-no-bg:    var(--gw-color-neutral-50);
  --ul-b-no-fg:    var(--gw-color-neutral-700);
  --ul-disabled:   var(--gw-color-neutral-250);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ul-label:      var(--gw-color-neutral-400);
    --ul-value:      var(--gw-color-white);
    --ul-sub:        var(--gw-color-neutral-500);       /* unchanged in dark, measured */
    --ul-cell:       var(--gw-color-neutral-300);
    --ul-icon:       var(--gw-color-neutral-300);
    --ul-track:      var(--gw-color-neutral-600);
    --ul-good:       var(--gw-color-green-300);
    --ul-grid:       var(--gw-color-neutral-800);
    --ul-hdr-bg:     var(--gw-color-black);
    --ul-hdr-line:   var(--gw-color-neutral-800);
    --ul-hdr-fg:     var(--gw-color-neutral-100);
    --ul-row-line:   var(--gw-color-neutral-800);
    --ul-row-bg:     var(--gw-color-black);
    --ul-row-hover:  var(--gw-color-neutral-900);       /* RULED in v2/data-table.md, not drawn */
    --ul-ctl-line:   var(--gw-color-neutral-700);
    --ul-ctl-fg:     var(--gw-color-neutral-50);
    --ul-ctl-hover:  var(--gw-color-neutral-800);       /* DERIVED: one step toward the border */
    --ul-field-bg:   var(--gw-color-neutral-800);       /* DERIVED from the measured dark select */
    --ul-field-line: var(--gw-color-neutral-600);
    --ul-field-fg:   var(--gw-color-white);
    --ul-field-ph:   var(--gw-color-neutral-400);
    --ul-tabs-bg:    var(--gw-color-neutral-900);
    --ul-tabs-line:  var(--gw-color-neutral-800);
    --ul-tab-fg:     var(--gw-color-white);
    --ul-tab-hover:  var(--gw-color-neutral-800);       /* DERIVED: hover moves toward the active fill */
    --ul-tab-on-bg:  var(--gw-color-white);             /* the active tab inverts */
    --ul-tab-on-fg:  var(--gw-color-black);
    --ul-prim-bg:    var(--gw-color-white);             /* dark primary is a full inversion */
    --ul-prim-fg:    var(--gw-color-neutral-900);
    --ul-prim-hover: var(--gw-color-neutral-100);       /* DERIVED */
    --ul-tip-bg:     var(--gw-color-neutral-800);       /* DERIVED: the dark screen draws no tooltip */
    --ul-tip-line:   var(--gw-color-neutral-700);
    --ul-tip-head:   var(--gw-color-neutral-400);
    --ul-tip-main:   var(--gw-color-white);
    --ul-skel:       var(--gw-color-neutral-800);
    --ul-circle:     var(--gw-color-neutral-800);
    --ul-circle-fg:  var(--gw-color-neutral-400);
    --ul-b-ok-bg:    var(--gw-color-green-alpha-10);    /* dark tint: Alpha/10 fill + /300 label */
    --ul-b-ok-fg:    var(--gw-color-green-300);
    --ul-b-no-bg:    var(--gw-color-neutral-800);
    --ul-b-no-fg:    var(--gw-color-neutral-300);
    --ul-disabled:   var(--gw-color-neutral-600);
  }
}
:root[data-theme="dark"] {
    --ul-label:      var(--gw-color-neutral-400);
    --ul-value:      var(--gw-color-white);
    --ul-sub:        var(--gw-color-neutral-500);       /* unchanged in dark, measured */
    --ul-cell:       var(--gw-color-neutral-300);
    --ul-icon:       var(--gw-color-neutral-300);
    --ul-track:      var(--gw-color-neutral-600);
    --ul-good:       var(--gw-color-green-300);
    --ul-grid:       var(--gw-color-neutral-800);
    --ul-hdr-bg:     var(--gw-color-black);
    --ul-hdr-line:   var(--gw-color-neutral-800);
    --ul-hdr-fg:     var(--gw-color-neutral-100);
    --ul-row-line:   var(--gw-color-neutral-800);
    --ul-row-bg:     var(--gw-color-black);
    --ul-row-hover:  var(--gw-color-neutral-900);       /* RULED in v2/data-table.md, not drawn */
    --ul-ctl-line:   var(--gw-color-neutral-700);
    --ul-ctl-fg:     var(--gw-color-neutral-50);
    --ul-ctl-hover:  var(--gw-color-neutral-800);       /* DERIVED: one step toward the border */
    --ul-field-bg:   var(--gw-color-neutral-800);       /* DERIVED from the measured dark select */
    --ul-field-line: var(--gw-color-neutral-600);
    --ul-field-fg:   var(--gw-color-white);
    --ul-field-ph:   var(--gw-color-neutral-400);
    --ul-tabs-bg:    var(--gw-color-neutral-900);
    --ul-tabs-line:  var(--gw-color-neutral-800);
    --ul-tab-fg:     var(--gw-color-white);
    --ul-tab-hover:  var(--gw-color-neutral-800);       /* DERIVED: hover moves toward the active fill */
    --ul-tab-on-bg:  var(--gw-color-white);             /* the active tab inverts */
    --ul-tab-on-fg:  var(--gw-color-black);
    --ul-prim-bg:    var(--gw-color-white);             /* dark primary is a full inversion */
    --ul-prim-fg:    var(--gw-color-neutral-900);
    --ul-prim-hover: var(--gw-color-neutral-100);       /* DERIVED */
    --ul-tip-bg:     var(--gw-color-neutral-800);       /* DERIVED: the dark screen draws no tooltip */
    --ul-tip-line:   var(--gw-color-neutral-700);
    --ul-tip-head:   var(--gw-color-neutral-400);
    --ul-tip-main:   var(--gw-color-white);
    --ul-skel:       var(--gw-color-neutral-800);
    --ul-circle:     var(--gw-color-neutral-800);
    --ul-circle-fg:  var(--gw-color-neutral-400);
    --ul-b-ok-bg:    var(--gw-color-green-alpha-10);    /* dark tint: Alpha/10 fill + /300 label */
    --ul-b-ok-fg:    var(--gw-color-green-300);
    --ul-b-no-bg:    var(--gw-color-neutral-800);
    --ul-b-no-fg:    var(--gw-color-neutral-300);
    --ul-disabled:   var(--gw-color-neutral-600);
}

/* Focus. No v2 component defines one; --gw-focus-ring on :focus-visible is mandatory (states.md). */
.ul-scope :is(button, a, input, select, [tabindex]):focus-visible {
  outline: var(--gw-focus-ring);
  outline-offset: var(--gw-focus-offset);
}

/* ── controls row (page-header controls-row) ─────────────────────────────────────────── */
.ul-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--gw-space-16); flex-wrap: wrap; }
/* tab-group: 36h, radius/12, pad 4, gap 4. The 1px border is an inset shadow, not a CSS
   border, so the 28h tab-items still fit — a border under border-box would eat 2px of them. */
.ul-tabs { display: inline-flex; height: 36px; padding: var(--gw-space-4); gap: var(--gw-space-4);
  border-radius: var(--gw-radius-12); background: var(--ul-tabs-bg); box-shadow: inset 0 0 0 1px var(--ul-tabs-line); }
.ul-tab { height: 28px; padding: 0 var(--gw-space-12); border: 0; border-radius: var(--gw-radius-8);
  background: none; font: var(--gw-text-button-12); color: var(--ul-tab-fg); cursor: pointer;
  transition: background var(--gw-motion-fast); }
.ul-tab:hover { background: var(--ul-tab-hover); }
.ul-tab[aria-selected="true"] { background: var(--ul-tab-on-bg); color: var(--ul-tab-on-fg); }
.ul-refresh { display: flex; align-items: center; gap: var(--gw-space-8); }
.ul-refresh__t { font: var(--gw-text-button-10); color: var(--ul-label); }
/* icon-button Size=28: radius/8, 12px glyph, 1px neutral/200 (inset, same reason as above) */
.ul-ib { width: 28px; height: 28px; padding: 0; display: inline-grid; place-items: center; border: 0;
  border-radius: var(--gw-radius-8); background: none; color: var(--ul-icon); cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--ul-ctl-line); transition: background var(--gw-motion-fast); }
.ul-ib:hover:not(:disabled) { background: var(--ul-ctl-hover); }
.ul-ib:disabled { color: var(--ul-disabled); cursor: default; }
.ul-ib svg { width: 12px; height: 12px; display: block; }
.ul-ib[aria-busy="true"] svg { animation: ul-spin 1s linear infinite; }
@keyframes ul-spin { to { transform: rotate(360deg); } }

/* ── stat-card / metric-card ─────────────────────────────────────────────────────────── */
.ul-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gw-space-8); }
.ul-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gw-space-8); }
/* stat-card 218 x 132 is the intrinsic size; these fill their column (a floor, not a width). */
.ul-stat, .ul-metric { background: var(--s-card-bg); box-shadow: inset 0 0 0 1px var(--s-card-border);
  border-radius: var(--gw-radius-12); display: flex; flex-direction: column; gap: var(--gw-space-16); min-width: 0; }
.ul-stat { padding: var(--gw-space-12); min-height: 132px; }
.ul-metric { padding: var(--gw-space-16); min-height: 124px; }   /* metric-card pad 16, not 12: measured */
.ul-stat__lab { display: flex; align-items: center; gap: var(--gw-space-8); padding: 0 var(--gw-space-4); }
.ul-lab { flex: 1; font: var(--gw-text-body-12-med); color: var(--ul-label); }
.ul-dot { width: 8px; height: 8px; border-radius: var(--gw-radius-20); background: var(--gw-color-neutral-400); flex: none; }
.ul-stat__body { display: flex; flex-direction: column; gap: var(--gw-space-8); padding: 0 var(--gw-space-4); margin-top: auto; }
.ul-stat__row { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--gw-space-8); }
.ul-val { display: flex; flex-direction: column; gap: var(--gw-space-4); min-width: 0; }
/* Dashboard/display-28-med — HAS NO TOKEN (v2/README.md, R15). Literal spec: Vert Grotesk
   Display Medium 500, 28 / 120%. Deliberately not --gw-text-h6 (600 / 26). */
.ul-num { font: 500 28px/1.2 var(--gw-font-display); color: var(--ul-value); }
.ul-note { font: var(--gw-text-body-12-med); color: var(--ul-sub); }
.ul-pct { font: var(--gw-text-body-12-med); color: var(--ul-sub); }
.ul-metric__body { display: flex; flex-direction: column; gap: var(--gw-space-4); margin-top: auto; }
/* progress-bar Size=md: 4px, radius/40, track neutral/200, fill green/400 (dark: 600 / green/300) */
.ul-pb { height: 4px; border-radius: var(--gw-radius-40); background: var(--ul-track); overflow: hidden; }
.ul-pb > i { display: block; height: 100%; border-radius: var(--gw-radius-40); background: var(--ul-good); }
/* skeleton: one block per real element, never a 0 while data is in flight (states.md) */
.sk { display: block; background: var(--ul-skel); border-radius: var(--gw-radius-4);
  animation: ul-pulse 960ms ease-in-out infinite alternate; }   /* --gw-motion-fast x 8 */
@keyframes ul-pulse { from { opacity: 1; } to { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } .ul-ib[aria-busy="true"] svg { animation: none; } }

/* ── card-shell lg + section-header ──────────────────────────────────────────────────── */
.ul-sec { background: var(--s-card-bg); box-shadow: inset 0 0 0 1px var(--s-card-border);
  border-radius: var(--gw-radius-16); padding: var(--gw-space-12); display: flex; flex-direction: column; gap: var(--gw-space-16); }
.ul-sh { display: flex; align-items: center; justify-content: space-between; gap: var(--gw-space-8);
  padding: 0 var(--gw-space-8); min-height: 24px; flex-wrap: wrap; }
.ul-sh__t { display: flex; align-items: baseline; gap: var(--gw-space-8); min-width: 0; }
.ul-sh h2 { margin: 0; font: var(--gw-text-body-16-sem); color: var(--ul-value); }
.ul-sh__q { font: var(--gw-text-body-16-reg); color: var(--ul-sub); }
.ul-inner { border-radius: var(--gw-radius-8); padding: 0 var(--gw-space-8) var(--gw-space-8); }

/* ── Graph / Line: single series + gradient fill ────────────────────────────────────── */
/* Plot height 240 is NOT MEASURED. The measured Line is 400 tall in a 1028-wide chart; this
   sits inside a card beside two other sections, so it is shorter. Chosen, and said so. */
.ul-line { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--gw-space-12); }
.ul-line__y { position: relative; height: 240px; width: 32px; }
.ul-line__y span, .ul-line__x span { font: 500 12px/1 var(--gw-font-body); letter-spacing: -.2px; color: var(--ul-cell); }
.ul-line__y span { position: absolute; right: 0; transform: translateY(-50%); }
.ul-plot { position: relative; height: 240px; cursor: crosshair; }
.ul-plot__g { position: absolute; left: 0; right: 0; height: 1px; background: var(--ul-grid); }
.ul-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ul-line__x { grid-column: 2; position: relative; height: 12px; margin-top: var(--gw-space-12); }
.ul-line__x span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ul-cross { position: absolute; top: 0; bottom: 0; width: 1px; pointer-events: none; display: none;
  /* crosshair is dashed 2 2 in the measured Line */
  background: repeating-linear-gradient(to bottom, var(--gw-color-primary-500) 0 2px, transparent 2px 4px); }
.ul-dotp { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: var(--gw-radius-full);
  background: var(--gw-color-primary-500); box-shadow: 0 0 0 2px var(--s-card-bg); pointer-events: none; display: none; }
/* Line tooltip: neutral/25, 1px neutral/100 (measured 0.5, rounded per R5), radius/4, p-8, gap-8, shadow S2 */
.ul-tip { position: absolute; z-index: 2; min-width: 148px; padding: var(--gw-space-8); display: none; pointer-events: none;
  flex-direction: column; gap: var(--gw-space-8); background: var(--ul-tip-bg); box-shadow: inset 0 0 0 1px var(--ul-tip-line), var(--gw-shadow-s2);
  border-radius: var(--gw-radius-4); }
.ul-tip__h { display: flex; align-items: center; gap: 2px; font: var(--gw-text-body-10-med); color: var(--ul-tip-head); }
.ul-tip__h svg { width: 12px; height: 12px; }
.ul-tip__m { font: var(--gw-text-body-10-med); color: var(--ul-tip-main); }
.ul-tip__b { border-left: 1px dashed var(--gw-color-neutral-500); padding: var(--gw-space-4) 0 var(--gw-space-4) var(--gw-space-8);
  display: flex; flex-direction: column; gap: var(--gw-space-4); }
/* The measured breakdown rows are 8px, which is below legibility. Built at 10 and reported. */
.ul-tip__r { display: flex; justify-content: space-between; gap: var(--gw-space-12); font: var(--gw-text-body-10-med); }
.ul-tip__r span:first-child { color: var(--ul-cell); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ul-tip__r span:last-child { color: var(--ul-label); }

/* ── Graph / Bar: bars are primary/500, 10 tall, radius 2 on the trailing corners only ─── */
.ul-bars { display: flex; flex-direction: column; gap: var(--gw-space-20); padding: var(--gw-space-8) 0; }
.ul-bars__r { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: var(--gw-space-12); }
.ul-bars__l { font: 500 12px/1.2 var(--gw-font-body); letter-spacing: -.2px; color: var(--ul-cell); white-space: nowrap; }
.ul-bars__t { padding-right: 52px; min-width: 0; }
.ul-bar-b { position: relative; height: 10px; min-width: 2px; background: var(--gw-color-primary-500); border-radius: 0 2px 2px 0; }
.ul-bar-b span { position: absolute; left: calc(100% + 4px); top: -2px; white-space: nowrap;
  font: 500 10px/1 var(--gw-font-body); letter-spacing: -.2px; color: var(--ul-tip-main); }

/* ── input Type=search, select, buttons ───────────────────────────────────────────────── */
.ul-tools { display: flex; align-items: center; gap: var(--gw-space-8); flex-wrap: wrap; }
.ul-input { position: relative; display: block; }
.ul-input svg { position: absolute; left: var(--gw-space-12); top: 10px; width: 16px; height: 16px; color: var(--ul-field-ph); pointer-events: none; }
.ul-input input { width: 240px; max-width: 100%; height: 36px; padding: 0 var(--gw-space-12) 0 calc(var(--gw-space-12) + 24px);
  border: 0; border-radius: var(--gw-radius-8); background: var(--ul-field-bg); color: var(--ul-field-fg);
  box-shadow: inset 0 0 0 1px var(--ul-field-line); font: var(--gw-text-button-14); }
.ul-input input::placeholder { color: var(--ul-field-ph); }
.ul-input input:focus { box-shadow: inset 0 0 0 1px var(--gw-color-black); }

  border: 0; border-radius: var(--gw-radius-8); background: var(--ul-field-bg); color: var(--ul-field-fg);
  box-shadow: inset 0 0 0 1px var(--ul-field-line); font: var(--gw-text-button-14); cursor: pointer; }
.ul-select--sm select { height: 28px; font: var(--gw-text-button-12); }
.ul-select svg { position: absolute; right: var(--gw-space-12); top: 50%; width: 12px; height: 12px; margin-top: -6px; color: var(--ul-icon); pointer-events: none; }
.ul-btn { height: 36px; padding: 0 var(--gw-space-12); border: 0; border-radius: var(--gw-radius-12); cursor: pointer;
  font: var(--gw-text-button-14); background: var(--ul-prim-bg); color: var(--ul-prim-fg); transition: background var(--gw-motion-fast); }

:root[data-theme="dark"] .ul-tbl { background: var(--gw-color-black); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ul-tbl { background: var(--gw-color-black); } }
/* Every row is its own grid, so a content-sized track would resolve per row. The first track
   is fixed and the rest are minmax(floor, 1fr): floors resolve identically for every row. */
.ul-row { display: grid; grid-template-columns: 200px minmax(160px, 1.6fr) minmax(96px, 1fr) minmax(130px, 1fr) minmax(130px, 1.1fr);
  column-gap: var(--gw-space-32); align-items: center; padding: 0 var(--gw-space-24); min-width: 820px; }

.ul-th span.ul-th--plain { cursor: default; }

.ul-c--who { color: var(--ul-value); }

/* badge Size=sm: radius/4, py-4 px-8, 20h, /25 tint. NOTE v2/primitives.md reports the light

.ul-badge--ok { background: var(--ul-b-ok-bg); color: var(--ul-b-ok-fg); }

.ul-row--o { grid-template-columns: 110px minmax(120px, 1fr) minmax(130px, 1.1fr) minmax(120px, .9fr) minmax(190px, 1.4fr) 140px; column-gap: var(--gw-space-16); min-width: 940px; }

<body data-gw-page="usage-log">

<div class="sg ul-scope">

  <header class="sg__hd">
    <h1>Usage Logs</h1>
    <p>Who starts a Claude session, which skills they run, what they make and whether it is on-brand. Never the prompts or file contents</p>
  </header>

  <main class="sg__main">

    <div class="ul-bar" id="ul-bar">
      <div class="ul-tabs" role="tablist" aria-label="Period">
        <button class="ul-tab" role="tab" data-period="7"  aria-selected="false">7 days</button>
        <button class="ul-tab" role="tab" data-period="30" aria-selected="true">30 days</button>
        <button class="ul-tab" role="tab" data-period="all" aria-selected="false">All time</button>
      </div>
      <div class="ul-refresh">
        <span class="ul-refresh__t" id="ul-updated" aria-live="polite"></span>
        <button class="ul-ib" id="ul-refresh" type="button" aria-label="Refresh the log"></button>
      </div>
    </div>

    <div id="ul-blocked" hidden></div>

    <div id="ul-app">
      <div class="ul-kpis" id="ul-kpis"></div>
      <div class="ul-metrics" id="ul-metrics" style="margin-top: var(--gw-space-8)"></div>

      <section class="ul-sec" style="margin-top: var(--gw-space-24)" aria-labelledby="ul-h-chart">
        <div class="ul-sh"><div class="ul-sh__t"><h2 id="ul-h-chart">Sessions</h2><span class="ul-sh__q" id="ul-q-chart"></span></div></div>
        <div class="ul-inner" id="ul-chart"></div>
      </section>

      <section class="ul-sec" style="margin-top: var(--gw-space-24)" aria-labelledby="ul-h-ver">
        <div class="ul-sh"><div class="ul-sh__t"><h2 id="ul-h-ver">Versions</h2><span class="ul-sh__q" id="ul-q-ver"></span></div></div>
        <div class="ul-inner" id="ul-versions"></div>
      </section>

      <section class="ul-sec" style="margin-top: var(--gw-space-24)" aria-labelledby="ul-h-skills">
        <div class="ul-sh"><div class="ul-sh__t"><h2 id="ul-h-skills">Skills</h2><span class="ul-sh__q" id="ul-q-skills"></span></div></div>
        <div class="ul-inner" id="ul-skills"></div>
      </section>

      <section class="ul-sec" style="margin-top: var(--gw-space-24)" aria-labelledby="ul-h-out">
        <div class="ul-sh"><div class="ul-sh__t"><h2 id="ul-h-out">Outputs</h2><span class="ul-sh__q" id="ul-q-out"></span></div></div>
        <div class="ul-inner"><div class="ul-metrics" id="ul-out-metrics" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr))"></div></div>
        <div class="ul-scroll"><div class="ul-tbl" id="ul-out" role="table" aria-label="Outputs made with the skills"></div></div>
      </section>

      <section class="ul-sec" style="margin-top: var(--gw-space-24)" aria-labelledby="ul-h-log">
        <div class="ul-sh">
          <div class="ul-sh__t"><h2 id="ul-h-log">Log</h2><span class="ul-sh__q" id="ul-q-log"></span></div>
          <div class="ul-tools">
            <label class="ul-input"><span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search the log</span>
              <span id="ul-i-search"></span>
              <input id="ul-search" type="search" placeholder="Search person or version" autocomplete="off"></label>
            <label class="ul-select"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Filter by version</span>
              <select id="ul-ver"></select><span class="ul-i-caret"></span></label>
            <label class="ul-select"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">View</span>
              <select id="ul-view"><option value="chat">By chat</option><option value="flat">All events</option></select><span class="ul-i-caret"></span></label>
            <label class="ul-select"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Filter by event</span>
              <select id="ul-evt"><option value="">All events</option><option value="session">Sessions</option><option value="skill">Skills</option><option value="file">Files</option><option value="artifact">Artifacts</option></select><span class="ul-i-caret"></span></label>
          </div>
        </div>
        <div class="ul-scroll"><div class="ul-tbl" id="ul-table" role="table" aria-label="Activity log"></div></div>
        <div class="ul-pg" id="ul-pg"></div>
      </section>
    </div>

  </main>
</div>

<script>

            evt: '', view: 'chat', open: {}, outcomes: {}, page: 1, per: 25, fetchedAt: 0, busy: false, skipped: 0, capped: false };

  /* ── data ───────────────────────────────────────────────────────────────────────── */
  function parse(raw) {
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var r = raw[i], d = new Date(r.at);
      if (isNaN(d.getTime())) continue;
      out.push({ at: d, email: String(r.email || '').trim().toLowerCase(), version: String(r.version || '').trim(),
                 event: String(r.event || ''), skill: String(r.skill || ''), file: String(r.file || ''),
                 key: String(r.at), sess: String(r.sess || ''), url: String(r.url || ''),

  }

  function vparts(v) { var m = /^(\d+)\.(\d+)\.(\d+)/.exec(v); return m ? [+m[1], +m[2], +m[3]] : null; }

  function statCard(label, value, note, pct) {
    return '<div class="ul-stat"><div class="ul-stat__lab"><span class="ul-lab">' + esc(label) + '</span><span class="ul-dot"></span></div>' +

  }
  var PERIOD_NAME = { '7': 'last 7 days', '30': 'last 30 days', 'all': 'all time' };

  function renderCards(m) {
    var loading = S.status === 'loading';
    if (loading) {
      $('ul-kpis').innerHTML = skelStat('Sessions') + skelStat('Active people');
      $('ul-metrics').innerHTML = ['Today', 'On the newest version', 'Not identified', 'Versions in use', 'Busiest day', 'Last session'].map(skelMetric).join('');

  }

  /* ── outputs ─────────────────────────────────────────────────────────────
     What the skills MADE: a file written or a page published in a session where a Gushwork skill
     had run. The plugin measured each one locally and sent four flags (stamp, tokens, fonts, logo)
     instead of the text, so "on-brand" here is a measurement, not a review. On-brand means it uses
     the tokens and names no typeface outside the system. Whether it was GOOD is the verdict, which
     is the owner's and is kept apart from the log so a usage row is never rewritten. */
  function isOut(r) { return r.event === 'file' || r.event === 'artifact'; }
  function onBrand(f) { return !!f && f.tokens === true && f.fonts !== 'foreign'; }
  function whyOff(f) {
    var w = [];
    if (!f.tokens) w.push('no tokens');
    if (f.fonts === 'foreign') w.push('other typeface');
    return w.join(', ');
  }
  /* Which skill a row belongs to. A skill row is its own answer. Newer rows carry `sess`, a hash of
     the session, so an output joins to the skill that ran in the same session exactly. Older rows do
     not, so they are INFERRED: the same person's latest skill run, stopping at their next session
     start, since a new session is a new conversation. That can be wrong when someone runs two
     sessions at once, so an inferred answer is marked. A session start has no skill. */
  function skillInfo(r, m) {
    if (r.event === 'skill') return { n: (r.skill || '').replace(/^.*:/, ''), inferred: false };
    if (isSess(r)) return { n: '', inferred: false };
    if (r.sess) {
      var best = null;
      m.all.forEach(function (x) {
        if (x.event === 'skill' && x.sess === r.sess && x.at <= r.at && (!best || x.at > best.at)) best = x;
      });
      if (best) return { n: best.skill.replace(/^.*:/, ''), inferred: false };
    }
    if (!r.email) return { n: '', inferred: false };
    var mine = m.all.filter(function (x) { return x.email === r.email && x.at <= r.at && x !== r; })
      .sort(function (a, b) { return b.at - a.at; });
    for (var i = 0; i < mine.length; i++) {
      if (mine[i].event === 'skill') return { n: mine[i].skill.replace(/^.*:/, ''), inferred: true };
      if (isSess(mine[i])) break;
    }
    return { n: '', inferred: false };
  }
  function skillFor(r, m) {
    var s = skillInfo(r, m);
    return s.n;
  }
  function renderOutputs(m) {
    var mt = $('ul-out-metrics'), tbl = $('ul-out'), q = $('ul-q-out');
    if (S.status === 'loading') { mt.innerHTML = ['Outputs', 'On-brand', 'Approved', 'Needs changes'].map(skelMetric).join(''); tbl.innerHTML = ''; q.textContent = ''; return; }
    var outs = m.curAll.filter(isOut).sort(function (a, b) { return b.at - a.at; });
    var measured = outs.filter(function (r) { return r.flags; });
    var on = measured.filter(function (r) { return onBrand(r.flags); }).length;
    var appr = outs.filter(function (r) { return S.outcomes[r.key] === 'approved'; }).length;
    var chg = outs.filter(function (r) { return S.outcomes[r.key] === 'changes'; }).length;
    q.textContent = plural(outs.length, 'output') + ', ' + PERIOD_NAME[S.period];
    mt.innerHTML =
      metricCard('Outputs', String(outs.length), plural(outs.filter(function (r) { return r.event === 'artifact'; }).length, 'artifact') + ' published') +
      metricCard('On-brand', measured.length ? Math.round(on / measured.length * 100) + '%' : 'None', measured.length ? on + ' of ' + measured.length + ' measured' : 'Nothing measured yet') +
      metricCard('Approved', String(appr), 'marked by an owner') +
      metricCard('Needs changes', String(chg), 'marked by an owner');
    if (!outs.length) {
      tbl.innerHTML = '<div class="ul-empty"><div class="ul-empty__copy"><h2>No outputs yet</h2><p>Outputs appear when a Gushwork skill has run and the session then writes an HTML or SVG file, a PDF, a deck, an image, or publishes an artifact. They start arriving on plugin 1.54.0.</p></div></div>';
      return;
    }
    var head = '<div class="ul-row ul-row--o ul-row--h" role="row"><div role="columnheader"><span class="ul-th"><span class="ul-th--plain">When</span></span></div>' +
      '<div role="columnheader"><span class="ul-th"><span class="ul-th--plain">Person</span></span></div>' +
      '<div role="columnheader"><span class="ul-th"><span class="ul-th--plain">Output</span></span></div>' +
      '<div role="columnheader"><span class="ul-th"><span class="ul-th--plain">Skill</span></span></div>' +
      '<div role="columnheader"><span class="ul-th"><span class="ul-th--plain">Checks</span></span></div>' +
      '<div role="columnheader"><span class="ul-th"><span class="ul-th--plain">Outcome</span></span></div></div>';
    var body = outs.slice(0, 25).map(function (r) {
      var who = r.email ? '<div class="ul-c ul-c--who" role="cell" title="' + esc(r.email) + '">' + esc(r.email) + '</div>' : '<div class="ul-c ul-c--none" role="cell">Not identified</div>';
      var what = r.event === 'artifact'
        ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">Artifact ' + esc(r.url.replace(/^.*\//, '').slice(0, 8)) + '…</a>'
        : esc(r.file);
      var f = r.flags, chk;
      if (!f) chk = '<span class="ul-c--none">Not measured</span>';
      else {
        var ok = onBrand(f);
        chk = '<span class="ul-badge ' + (ok ? 'ul-badge--ok' : 'ul-badge--bad') + '">' + (ok ? 'On-brand' : 'Off-brand') + '</span>' +
          '<span class="ul-c--none" title="tokens ' + (f.tokens ? 'yes' : 'no') + ', fonts ' + esc(f.fonts) + ', logo ' + (f.logo ? 'yes' : 'no') + ', stamp ' + (f.stamp ? 'yes' : 'no') + '">' +
          esc(ok ? (f.stamp ? 'built by a skill' : 'tokens and fonts ok') : whyOff(f)) + '</span>';
      }
      var v = S.outcomes[r.key] || '';
      var sel = '<label class="ul-select ul-select--sm"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Outcome</span>' +
        '<select data-outcome="' + esc(r.key) + '"><option value=""' + (v === '' ? ' selected' : '') + '>Not reviewed</option><option value="approved"' + (v === 'approved' ? ' selected' : '') +
        '>Approved</option><option value="changes"' + (v === 'changes' ? ' selected' : '') + '>Needs changes</option></select>' + icon('caret-down') + '</label>';
      return '<div class="ul-row ul-row--o ul-row--d" role="row"><div class="ul-c" role="cell" title="' + esc(r.at.toISOString()) + '">' + esc(fmtWhen(r.at)) + '</div>' + who +
        '<div class="ul-c ul-c--out" role="cell" title="' + esc(r.event === 'artifact' ? r.url : r.file) + '">' + what + '</div>' +
        '<div class="ul-c" role="cell">' + esc(skillFor(r, m) || 'Unknown') + '</div>' +
        '<div class="ul-c ul-c--chk" role="cell">' + chk + '</div><div class="ul-c" role="cell">' + sel + '</div></div>';
    }).join('');
    tbl.innerHTML = head + body + (outs.length > 25 ? '<p class="ul-note-line" style="padding:var(--gw-space-12) var(--gw-space-24)">Showing the newest 25 of ' + outs.length + '.</p>' : '');
  }
  $('ul-out').addEventListener('change', function (e) {
    var sel = e.target.closest('select[data-outcome]'); if (!sel) return;
    var key = sel.getAttribute('data-outcome'), want = sel.value, before = S.outcomes[key] || '';
    if (want) S.outcomes[key] = want; else delete S.outcomes[key];
    render();
    fetch(API, { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ at: key, status: want }) })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); })
      .catch(function () {
        /* The verdict did not save, so put the control back rather than show one that is not true. */
        if (before) S.outcomes[key] = before; else delete S.outcomes[key];
        render();
      });
  });

  /* ── page-level states. The whole page reads one source, so when it cannot be read there
        is nothing to keep the shape of: one empty-state, not five zeroed cards. ───────── */
  var BLOCK = {
    forbidden:    { icon: 'lock', title: 'Only owners can open the usage log', body: 'This list shows who starts a session, so it is limited to owners. Ask an owner if you need to see it.' },
    signin:       { icon: 'lock', title: 'Sign in to see the usage log', body: 'Use your @gushwork.ai account. You will come back to this page afterwards.', action: 'Sign in' },
    unconfigured: { icon: 'warning-circle', title: 'The log store is not connected', body: 'Add the Upstash variables to the project and redeploy, then reload this page.' },
    empty:        { icon: 'magnifying-glass', title: 'No sessions logged yet', body: 'Rows appear here when someone starts a Claude session with the plugin.' },
    error:        { icon: 'warning-circle', title: 'Could not read the usage log', body: 'The log store did not answer. Try again in a moment.', action: 'Try again' }
  };
  function renderBlocked(kind) {
    var b = BLOCK[kind];
    $('ul-blocked').innerHTML = '<div class="ul-sec"><div class="ul-empty"><div class="ul-empty__c">' + icon(b.icon) + '</div>' +
      '<div class="ul-empty__copy"><h2>' + esc(b.title) + '</h2><p>' + esc(b.body) + '</p></div>' +
      (b.action ? '<button class="ul-btn" id="ul-act" type="button">' + esc(b.action) + '</button>' : '') + '</div></div>';
    var act = $('ul-act');
    if (act) act.addEventListener('click', function () {
      if (kind === 'signin') location.href = '/?signin=required&next=' + encodeURIComponent(location.pathname);
      else load();
    });
  }

  function render() {
    var blocked = ['forbidden', 'signin', 'unconfigured', 'empty', 'error'].indexOf(S.status) !== -1;
    $('ul-blocked').hidden = !blocked; $('ul-app').hidden = blocked;
    /* A period and a refresh have nothing to act on when the log cannot be read, and the
       last "Updated Ns ago" would be a stale claim. The state's own action is the retry. */
    $('ul-bar').hidden = blocked;
    if (blocked) { renderBlocked(S.status); updated(); return; }
    var m = compute();
    renderCards(m); renderChart(m); renderVersions(m); renderSkills(m); renderOutputs(m);
    if (S.status === 'ready') renderVerFilter(m);
    renderLog(m); updated();
    document.querySelectorAll('.ul-tab').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-period') === S.period)); });
  }
  function updated() {
    $('ul-updated').textContent = S.fetchedAt ? 'Updated ' + ago(Date.now() - S.fetchedAt) : '';
  }

  function load() {
    if (S.busy) return;
    S.busy = true; $('ul-refresh').setAttribute('aria-busy', 'true');
    var first = S.status === 'loading' || !S.rows.length;
    if (first) { S.status = 'loading'; render(); }
    fetch(API, { credentials: 'same-origin', cache: 'no-store' }).then(function (r) {
      if (r.status === 401) { S.status = 'signin'; return null; }
      if (r.status === 403) { S.status = 'forbidden'; return null; }
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (j) {
      if (!j) return;
      if (!j.configured) { S.status = 'unconfigured'; return; }
      S.outcomes = j.outcomes || {}; S.rows = parse(j.rows || []); S.skipped = j.skipped || 0; S.capped = !!j.capped; S.fetchedAt = Date.now();
      S.status = S.rows.length ? 'ready' : 'empty';
    }).catch(function () { S.status = 'error'; }).then(function () {
      S.busy = false; $('ul-refresh').removeAttribute('aria-busy'); render();
    });
  }

  /* ── wiring: bound once. Everything that is re-rendered is delegated from a stable parent,
        so no handler is attached to an element that a render later replaces. ─────────── */
  $('ul-refresh').innerHTML = icon('arrow-clockwise');
  $('ul-i-search').innerHTML = icon('magnifying-glass');
  document.querySelectorAll('.ul-i-caret').forEach(function (c) { c.outerHTML = icon('caret-down'); });
  document.querySelectorAll('.ul-tab').forEach(function (b) {
    b.addEventListener('click', function () { S.period = b.getAttribute('data-period'); S.page = 1; render(); });
  });
  $('ul-refresh').addEventListener('click', load);
  $('ul-search').addEventListener('input', function (e) { S.q = e.target.value; S.page = 1; render(); $('ul-search').focus(); });
  $('ul-view').addEventListener('change', function (e) { S.view = e.target.value; S.page = 1; render(); });
  function toggleChat(row) { var k = row.getAttribute('data-chat'); S.open[k] = !S.open[k]; render(); }
  $('ul-table').addEventListener('click', function (e) { var row = e.target.closest('[data-chat]'); if (row) toggleChat(row); });
  $('ul-table').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var row = e.target.closest('[data-chat]'); if (row) { e.preventDefault(); toggleChat(row); }
  });
  $('ul-evt').addEventListener('change', function (e) { S.evt = e.target.value; S.page = 1; render(); });
  $('ul-ver').addEventListener('change', function (e) { S.ver = e.target.value; S.page = 1; render(); });
  $('ul-table').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sort]'); if (!b) return;
    var k = b.getAttribute('data-sort');
    if (S.sortKey === k) S.sortDir = -S.sortDir; else { S.sortKey = k; S.sortDir = k === 'at' ? -1 : 1; }
    S.page = 1; render();
  });
  setInterval(updated, 10000);
  render(); load();
})();
</script>
</body></html>
