<script>try{var c=localStorage.getItem('gw-theme-choice'),t=c==='dark'||c==='light'?c:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2080%2080%22%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2278%22%20height%3D%2278%22%20rx%3D%2219%22%20fill%3D%22%230070ff%22%20stroke%3D%22%230061e0%22%20stroke-width%3D%222%22%2F%3E%3Cg%20transform%3D%22translate%2819.2%2019.2%29%20scale%280.52%29%22%3E%3Cpath%20d%3D%22M76.6088%204.56344C77.5025%202.36058%2075.8495%200%2073.4723%200H9.14286C4.0934%200%200%204.0934%200%209.14286V66.7778C0%2072.018%205.17081%2075.6829%209.9603%2073.5568C40.8494%2059.8449%2064.3785%2034.7075%2076.6088%204.56344Z%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Cpath%20d%3D%22M32.5161%2080C31.4022%2080%2030.9357%2078.5531%2031.8259%2077.8835C54.9007%2060.5265%2071.4338%2035.8047%2078.7658%208.0522C78.9403%207.39154%2080%207.51618%2080%208.19951V70.8571C80%2075.9066%2075.9066%2080%2070.8571%2080H32.5161Z%22%20fill%3D%22%23FFFFFF%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="/foundation/tokens.css">
<link rel="stylesheet" href="/shell.css?v=ghost9">
<script src="/shell.js?v=ghost9" defer></script>
<style>
body[data-gw-page="system-health"] .sg__main { grid-column: 1 / -1; max-width: 1000px; gap: var(--gw-space-32); }
body[data-gw-page="system-health"] .sg__hd { border-bottom: 0; padding-bottom: var(--gw-space-8); }
.sh-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--gw-space-16); flex-wrap: wrap; }
.sh-when { font: var(--gw-text-body-14-reg); color: var(--s-body); }
.sh-btn { height: 36px; padding: 0 var(--gw-space-16); border-radius: var(--gw-radius-12); border: 0; cursor: pointer; font: var(--gw-text-button-14);
  background: none; color: var(--s-heading); box-shadow: inset 0 0 0 1px var(--s-card-border); transition: background var(--gw-motion-fast); }
.sh-btn:hover:not(:disabled) { background: var(--s-nav-hover); }
.sh-btn:disabled { opacity: .5; cursor: default; }
.sh-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gw-space-16); }
.sh-m { padding: var(--gw-space-16) var(--gw-space-20); border-radius: var(--gw-radius-16); background: var(--s-card-bg); box-shadow: inset 0 0 0 1px var(--s-card-border); display: grid; gap: 2px; }
.sh-m__l { font: var(--gw-text-body-12-reg); color: var(--s-body); }
.sh-m__v { font: 600 28px/1.2 var(--gw-font-display); color: var(--s-heading); font-variant-numeric: tabular-nums; }
.sh-m--fail .sh-m__v { color: var(--gw-color-red-600); } .sh-m--warn .sh-m__v { color: var(--gw-color-yellow-600); }
:root[data-theme="dark"] .sh-m--fail .sh-m__v { color: var(--gw-color-red-300); } :root[data-theme="dark"] .sh-m--warn .sh-m__v { color: var(--gw-color-yellow-300); }
.sh-sec { display: block; }
#sh-body { display: grid; gap: var(--gw-space-32); }
.sh-sec h2 { margin: 0 0 var(--gw-space-4); font: 600 18px/1.3 var(--gw-font-display); color: var(--s-heading); }
.sh-sec > p { margin: 0 0 var(--gw-space-16); font: var(--gw-text-body-14-reg); color: var(--s-body); }
.sh-list { border-radius: var(--gw-radius-16); background: var(--s-card-bg); box-shadow: inset 0 0 0 1px var(--s-card-border); overflow: hidden; }
.sh-row { display: grid; grid-template-columns: 220px 150px 1fr; gap: var(--gw-space-16); align-items: start; padding: var(--gw-space-12) var(--gw-space-20); }
.sh-row + .sh-row { box-shadow: inset 0 1px 0 var(--s-card-border); }
.sh-n { font: var(--gw-text-body-14-med); color: var(--s-heading); }
.sh-d { font: var(--gw-text-body-14-reg); color: var(--s-body); overflow-wrap: anywhere; }
.sh-fix { display: block; margin-top: var(--gw-space-4); color: var(--s-heading); }
.sh-fix::before { content: 'To do: '; font-weight: 500; }
.sh-tag { margin-left: var(--gw-space-8); font: var(--gw-text-body-12-reg); color: var(--s-body); }
.sh-b { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--gw-radius-8); font: var(--gw-text-body-12-med); white-space: nowrap; }
.sh-b::before { content: ''; width: 6px; height: 6px; border-radius: 2px; background: currentColor; }
.sh-b--ok { background: var(--gw-color-green-alpha-10, rgba(16,185,129,.12)); color: var(--gw-color-green-700, #047857); }
.sh-b--warn { background: var(--gw-color-yellow-alpha-10); color: var(--gw-color-yellow-600); }
.sh-b--fail { background: var(--gw-color-red-alpha-10); color: var(--gw-color-red-600); }
.sh-b--unknown { background: var(--s-nav-sel); color: var(--s-body); }
:root[data-theme="dark"] .sh-b--ok { color: var(--gw-color-green-300, #6ee7b7); } :root[data-theme="dark"] .sh-b--warn { color: var(--gw-color-yellow-300); } :root[data-theme="dark"] .sh-b--fail { color: var(--gw-color-red-300); }
.sh-all { display: flex; align-items: center; gap: var(--gw-space-12); padding: var(--gw-space-20); border-radius: var(--gw-radius-16); background: var(--s-card-bg); box-shadow: inset 0 0 0 1px var(--s-card-border); font: var(--gw-text-body-14-med); color: var(--s-heading); }
.sh-all__i { width: 36px; height: 36px; border-radius: var(--gw-radius-10); display: grid; place-items: center; background: var(--s-nav-sel); }
.sh-foot { font: var(--gw-text-body-12-reg); color: var(--s-body); }
.sh-sk { display: block; height: 14px; border-radius: 4px; background: var(--s-nav-sel); animation: sh-pulse 1.4s ease-in-out infinite; }
@keyframes sh-pulse { 50% { opacity: .45; } } @media (prefers-reduced-motion: reduce) { .sh-sk { animation: none; } }
#sh-state:empty { display: none; }
#sh-app { display: grid; gap: var(--gw-space-32); }
#sh-app[hidden] { display: none; }
@media (max-width: 760px) { .sh-metrics { grid-template-columns: repeat(2, 1fr); } .sh-row { grid-template-columns: 1fr; gap: var(--gw-space-4); } }
</style>
</head>
<body data-gw-page="system-health">

<div class="sg">

  <header class="sg__hd">
    <h1>System health</h1>
    <p>Whether everything that keeps the hub alive is working. Doc, the hub's health agent, checks it live when you open this page and again every Monday and Thursday. <a href="/admin/agents#doc" style="color:inherit;text-decoration:underline;text-underline-offset:2px">About Doc</a></p>
  </header>

  <main class="sg__main">
    <div id="sh-state"></div>
    <div id="sh-app">
      <div class="sh-bar"><span class="sh-when" id="sh-when">Checking</span><button type="button" class="sh-btn" id="sh-again" disabled>Check again</button></div>
      <div class="sh-metrics" id="sh-metrics"></div>
      <div id="sh-body"></div>
      <p class="sh-foot" id="sh-foot"></p>
    </div>
  </main>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var LABEL = { ok: 'Working', warn: 'Needs improvement', fail: 'Failing', unknown: "Couldn't check" };
  var RANK = { fail: 0, warn: 1, unknown: 2, ok: 3 };
  var AREA_NOTE = {
    'Storage and data': 'Where decisions, logs and the access rules are kept',
    'Hosting': 'Vercel, the live site, the domain and its certificate',
    'Integrations': 'Sign-in, GitHub, Slack, Anthropic and the routines',
    'Upkeep': 'What needs looking after: pull requests, configuration, and the twice-weekly repo checks'
  };

  function badge(s) { return '<span class="sh-b sh-b--' + s + '">' + LABEL[s] + '</span>'; }
  function row(x, withArea) {
    return '<div class="sh-row"><div class="sh-n">' + esc(x.name) + (withArea ? '<span class="sh-tag">' + esc(x.area) + '</span>' : '') + '</div><div>' + badge(x.status) + '</div>' +
      '<div class="sh-d">' + esc(x.detail) + (x.fix && x.status !== 'ok' ? '<span class="sh-fix">' + esc(x.fix) + '</span>' : '') + '</div></div>';
  }
  function ghost() {
    var r = ''; for (var i = 0; i < 4; i++) r += '<div class="sh-row"><span class="sh-sk" style="width:70%"></span><span class="sh-sk" style="width:90px"></span><span class="sh-sk" style="width:' + (50 + i * 10) + '%"></span></div>';
    $('sh-metrics').innerHTML = [0, 1, 2, 3].map(function () { return '<div class="sh-m"><span class="sh-sk" style="width:60%"></span><span class="sh-sk" style="width:30%;height:24px"></span></div>'; }).join('');
    $('sh-body').innerHTML = '<div class="sh-list">' + r + '</div>';
  }
  function when(iso) { var d = new Date(iso); return 'Checked ' + d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); }

  function render(d) {
    var c = d.counts;
    $('sh-when').textContent = when(d.at);
    $('sh-metrics').innerHTML = [['ok', 'Working'], ['warn', 'Needs improvement'], ['fail', 'Failing'], ['unknown', "Couldn't check"]].map(function (m) {
      return '<div class="sh-m sh-m--' + m[0] + '"><span class="sh-m__l">' + m[1] + '</span><span class="sh-m__v">' + c[m[0]] + '</span></div>';
    }).join('');
    var bad = d.checks.filter(function (x) { return x.status !== 'ok'; }).sort(function (a, b) { return RANK[a.status] - RANK[b.status]; });
    var html = '<section class="sh-sec"><h2>Needs attention</h2><p>' + (bad.length ? 'Failing first, then what can be improved, then what could not be checked' : 'Nothing right now') + '</p>' +
      (bad.length ? '<div class="sh-list">' + bad.map(function (x) { return row(x, true); }).join('') + '</div>'
        : '<div class="sh-all"><span class="sh-all__i"><svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/></svg></span>Everything that was checked is working</div>') + '</section>';
    d.areas.forEach(function (a) {
      var rows = d.checks.filter(function (x) { return x.area === a; });
      if (!rows.length) return;
      html += '<section class="sh-sec"><h2>' + esc(a) + '</h2><p>' + esc(AREA_NOTE[a] || '') + '</p><div class="sh-list">' + rows.map(function (x) { return row(x, false); }).join('') + '</div></section>';
    });
    $('sh-body').innerHTML = html;
    $('sh-foot').textContent = 'A daily check runs at 9:00 am IST and sends you a Slack message only when something is failing. The repo checks come from a routine that runs on Monday and Thursday' + (d.snapshotAt ? ' (last reported ' + new Date(d.snapshotAt).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ')' : '') + '. Only whether a secret is set is shown, never its value';
  }

  function fail(msg) {
    $('sh-app').hidden = true;
    $('sh-state').innerHTML = '<div class="sh-all">' + esc(msg) + '</div>';
  }

  function load() {
    $('sh-again').disabled = true; $('sh-when').textContent = 'Checking'; ghost();
    fetch('/api/health', { credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401 || r.status === 403) { fail('This page is for the owner only'); return null; }
      if (!r.ok) throw new Error('status ' + r.status);
      return r.json();
    }).then(function (d) { if (d) { $('sh-app').hidden = false; $('sh-state').innerHTML = ''; render(d); } })
      .catch(function () { fail('Could not run the checks. The site itself may be down; check the latest deployment in Vercel'); })
      .then(function () { $('sh-again').disabled = false; });
  }
  $('sh-again').addEventListener('click', load);
  load();
})();
</script>
</body></html>
