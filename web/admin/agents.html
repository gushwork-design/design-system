<style>
/* /admin/agents: the design team's agents. Built from the dashboard library (exports/dashboard): underline tabs, the period control, the toggle,
   status banner, cards, data tables, stat cards, badges, tags, avatars, key-value lists and the drawer. The only CSS here is the page's own layout:
   the sticky tab row (as on Analytics) and the spacing between sections. Definitions are agents/ in git, built into agents-data.json; the activity
   is what the hub can already see: Bruce's log, the health checks and Alfred's GitHub threads. Token figures are ESTIMATES. Nothing here is a secret. */
body[data-gw-page="agents"] .sg__main { grid-column: 1 / -1; max-width: 1120px; gap: var(--gw-space-24); }
body[data-gw-page="agents"] .sg__hd { border-bottom: 0; padding-bottom: var(--gw-space-8); }
#ag-app[hidden], #ag-state:empty { display: none; }
#ag-panel { display: grid; gap: var(--gw-space-24); }
#ag-panel > * { min-width: 0; }
.ag-bar { position: sticky; top: 0; z-index: 6; background: var(--s-panel-bg); margin-top: calc(var(--gw-space-8) * -1); padding-top: var(--gw-space-8); align-self: stretch;
  display: flex; align-items: center; justify-content: space-between; gap: var(--gw-space-16); }
.ag-bar > .gd-tabs { flex: 1 1 auto; min-width: 0; }
.ag-bar > .gd-tabs--underline { box-shadow: none; }   /* the hairline belongs to the bar (as Analytics' bar), so it runs under the toggle too and closes the bar's bottom edge while content scrolls under it */
.ag-bar { box-shadow: inset 0 -1px 0 var(--gd-border); }
.ag-bar > .gd-toggle { flex: none; }
/* tables: nothing is cut off. A cell wraps, a row grows past the library's row height, tags wrap under each other, and avatar initials stay at 11px */
#ag-panel .gd-table__row { height: auto; min-height: var(--gd-row-h); }
#ag-panel .gd-table__body > .gd-table__row { padding-block: var(--gw-space-8); }
#ag-panel .gd-table__cell { overflow: visible; white-space: normal; text-overflow: clip; overflow-wrap: break-word; }
#ag-panel .gd-table__cell--flex { flex-wrap: wrap; row-gap: var(--gw-space-4); }
#ag-panel .gd-table__avatar { font-size: 11px; border-radius: 20%; }   /* the same rounded square as the team cards' avatar (.gd-avatar), never a circle */
/* a row that opens a conversation shows the hand, like the links and cards that open something */
#ag-panel .gd-table__row:is([data-u], [data-go]), #ag-panel .gd-table__row:is([data-u], [data-go]) * { cursor: pointer; }   /* the hand over the whole row, children included */
#ag-panel:focus, #ag-panel:focus-visible { outline: none; }   /* the panel is a container, not a control: no ring around everything when a drawer hands focus back to it */
/* an agent's picture: the mascot, framed on its face (the framing is in the agent's record) */
.ag-face { position: relative; overflow: hidden; }
.ag-face img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; transform: scale(var(--ag-z, 1)); transform-origin: var(--ag-x, 50%) var(--ag-y, 50%); }
.gd-agent-status .gd-avatar.ag-face { --gd-avatar-size: 48px; }
/* tokens on a team card: the estimate and the agent's share of the team's, over a thin bar */
/* the account's weekly limit on All agents: one number, one bar */
.ag-limit { display: flex; flex-direction: column; gap: var(--gw-space-12); }
.ag-limit__row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--gw-space-12); }
.ag-limit__row b { font: 500 28px/1.2 var(--gw-font-display); color: var(--gd-text); font-feature-settings: "tnum" 1; }
.ag-limit__row span { font: var(--gw-text-body-14-reg); color: var(--gd-text-muted); }
.ag-limit__bar { height: 8px; border-radius: 4px; background: var(--gd-border); overflow: hidden; }
.ag-limit__bar > i { display: block; height: 100%; border-radius: 4px; background: var(--gd-ink); }
.ag-limit__note { margin: 0; font: var(--gw-text-body-12-reg); color: var(--gd-text-muted); }
.ag-use { display: flex; flex-direction: column; gap: var(--gw-space-8); }
.ag-use__row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--gw-space-12); font: var(--gw-text-body-12-med); color: var(--gd-text-muted); }
.ag-use__row b { font: var(--gw-text-body-14-sem); color: var(--gd-text); font-feature-settings: "tnum" 1; }
.ag-use__bar { height: 4px; border-radius: 2px; background: var(--gd-border); overflow: hidden; }
.ag-use__bar > i { display: block; height: 100%; border-radius: 2px; background: var(--gd-ink); }

/* the table's last row must not sit on the card's bottom edge, or its background covers the border between the rounded corners */
#ag-panel .gd-card--flush > .gd-card__body--bleed { padding-bottom: var(--gw-space-8); }
/* a collapsed card shows a chevron at its right edge: down while closed, up while open */
#ag-panel .gd-card__titles:has(> .gd-card__toggle) { flex: 1 1 auto; }
/* a heading is the title and its subtitle on one line, as on Analytics (.ul-sh): 16px semibold, 16px regular muted, 8px apart on the baseline. The library's card head stacks a 14px subtitle under the title; on a narrow card the subtitle wraps under it */
#ag-panel .gd-card__titles { flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: var(--gw-space-8); row-gap: var(--gw-space-2); }
#ag-panel .gd-card__titles > .gd-card__desc { font: var(--gw-text-body-16-reg); letter-spacing: var(--gw-text-body-16-reg-tracking); }
#ag-panel .gd-card__toggle { width: 100%; justify-content: space-between; }
#ag-panel .gd-card__toggle > svg { width: 16px; height: 16px; }
#ag-panel .gd-card__toggle[aria-expanded="false"] > svg { transform: none; }
#ag-panel .gd-card__toggle[aria-expanded="true"] > svg { transform: rotate(180deg); }
/* the header rule ends where the row dividers end (the library draws it edge to edge of the inset row, the dividers a cell's padding in) */
#ag-panel .gd-table--inset .gd-table__row--head { box-shadow: none; }
#ag-panel .gd-table--inset .gd-table__row--head::after { content: ""; position: absolute; left: var(--gd-cell-px); right: var(--gd-cell-px); bottom: 0; height: 1px; background: var(--gd-border-strong); }

  .ag-bar > .gd-tabs { flex: 1 1 100%; }
  .ag-bar > .gd-toggle { padding-block: var(--gw-space-8); }
  /* the library collapses its grid at 767 only inside its app shell; this page is not in one, so the same rule is here */
  #ag-panel .gd-grid > [class*="gd-span-"] { grid-column: span 12 !important; }
  #ag-panel .gd-table__body > .gd-table__row { padding-block: var(--gw-space-12); }
  #ag-panel .gd-table__row--head { display: none; }   /* these tables do not sort, so no Sort chip row */
  #ag-panel .gd-table__row:not(.gd-table__row--head) > .ag-wide { grid-column: 1 / -1; }   /* long text takes the whole card row, not half of it */
}
.ag-ctrl { display: flex; align-items: center; justify-content: space-between; gap: var(--gw-space-16); flex-wrap: wrap; }
.ag-ctrl[hidden] { display: none; }

    return '<div class="gd-tview gd-tview--flush"><div class="gd-table-wrap"><div class="gd-table gd-table--inset" role="table" aria-label="' + esc(label) + '" style="--gd-cols:' + tpl + ';--gd-table-min:640px">' + head + '<div class="gd-table__body" role="rowgroup">' + body + '</div></div></div></div>';
  }
  /* an agent's mascot picture, framed by its record's avatar {src, x, y, zoom}; '' when it has none */
  function pic(a) { var v = a && a.avatar; return v ? '<img src="' + esc(v.src) + '" alt="" width="96" height="96" decoding="async" style="--ag-x:' + v.x + '%;--ag-y:' + v.y + '%;--ag-z:' + v.zoom + '">' : ''; }
  function who(name, sub, a) { return '<span class="gd-table__avatar' + (pic(a) ? ' ag-face' : '') + '" aria-hidden="true">' + (pic(a) || initial(name)) + '</span><span class="gd-table__who"><b class="gd-table__trunc">' + esc(name) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>'; }
  function stat(name, value, compare) {

      (compare ? '<div class="gd-stat-card__meta"><span class="gd-stat-card__compare">' + esc(compare) + '</span></div>' : '') + '</div></div>';
  }
  function stats(list) { return '<div class="gd-grid">' + list.map(function (s) { return '<div class="gd-span-4">' + stat(s.n, s.v, s.c) + '</div>'; }).join('') + '</div>'; }

  /* ---------- the period, and who is hidden ---------- */
  function since() { if (S.period === 'today') { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); } return Date.now() - (+S.period) * DAY; }
  function periodText() { return S.period === 'today' ? 'today' : 'in ' + S.period + ' days'; }
  function hideOn() { try { return localStorage.getItem('gw-analytics-hide-me') === '1'; } catch (e) { return false; } }
  function mine(r) { return hideOn() && S.owner && r.user === S.owner; }
  function inWindow(at) { return at.getTime() >= since(); }

  function agent(id) { return S.data.agents.filter(function (a) { return a.id === id; })[0]; }

  /* ---------- when Doc and Alfred next run ---------- */
  function docNext() { var t = new Date(); t.setUTCHours(4, 0, 0, 0); for (var i = 0; i < 9; i++) { var w = t.getUTCDay(); if ((w === 1 || w === 4) && t.getTime() > Date.now()) return t.getTime(); t = new Date(t.getTime() + DAY); } return 0; }
  function docRunCount(from) { var c = 0, d = new Date(from); d.setUTCHours(4, 0, 0, 0); for (var t = d.getTime(); t <= Date.now(); t += DAY) { var w = new Date(t).getUTCDay(); if ((w === 1 || w === 4) && t >= from) c++; } return c; }
  function alfredRunsIn(from) { if (!S.alfred) return 0; var t = 0; Object.keys(S.alfred.byDay || {}).forEach(function (k) { if (Date.parse(k + 'T12:00:00Z') >= from) t += S.alfred.byDay[k]; }); return t; }

  /* ---------- health: the checks that matter to each agent ---------- */
  var HEALTH_IDS = { bruce: ['bruce', 'slack', 'anthropic'], alfred: ['trigger', 'github', 'bypass'], doc: null };
  function healthOf(id) {
    var checks = S.health && S.health.checks; if (!checks) return { status: 'unknown', rows: [] };
    var ids = HEALTH_IDS[id], rows = ids ? checks.filter(function (c) { return ids.indexOf(c.id) !== -1; }) : checks;
    var rank = { ok: 0, unknown: 1, warn: 2, fail: 3 }, worst = 'ok';

    return { status: rows.length ? worst : 'unknown', rows: rows };
  }
  function healthNeeds(h) {
    return h.rows.filter(function (c) { return c.status === 'fail' || c.status === 'warn'; }).map(function (c) {
      return { key: 'check:' + c.id, health: true, text: c.name + (c.fix ? ': ' + c.fix : c.detail ? ': ' + c.detail : ''), cta: 'See in Doc', href: '#doc' };
    });
  }

  /* ---------- Bruce's log ---------- */
  function bruceAll() { return (S.bruce || []).filter(function (r) { return r.kind !== 'sent' && !mine(r); }); }
  function bruceRows() { return bruceAll().filter(function (r) { return inWindow(r.at); }); }
  function isGap(r) { return r.topic === 'other' || r.kind === 'failed' || r.kind === 'capped'; }
  function bruceTokens(r, a) { var c = a.cost; return r.kind === 'run' ? c.start + c.run : r.kind === 'chat' ? c.start + c.chat : 0; }

  /* one summary per agent: state, one sentence on what it is doing, and what it wants from Utsav */
  function summary(id) {
    var a = agent(id), h = healthOf(id), out = { a: a, id: id, known: true, state: h.status, doing: '', stats: [], needs: healthNeeds(h), tokens: 0, sessions: 0, last: 0 };
    var worse = function (s) { var rank = { ok: 0, unknown: 1, warn: 2, fail: 3 }; if ((rank[s] || 0) > (rank[out.state] || 0)) out.state = s; };
    if (id === 'bruce') {
      if (!S.bruce) { out.known = false; out.state = 'unknown'; out.doing = S.bruceErr || 'Reading his log'; return out; }
      var rows = bruceRows(), all = bruceAll(), gaps = rows.filter(isGap);
      out.sessions = rows.filter(function (r) { return r.kind === 'run' || r.kind === 'chat'; }).length; out.tokens = rows.reduce(function (n, r) { return n + bruceTokens(r, a); }, 0);
      var latest = all.slice().sort(function (x, y) { return y.at - x.at; })[0]; out.last = latest ? latest.at.getTime() : 0;
      out.doing = latest ? 'Last asked ' + ago(Date.now() - out.last) + ' by ' + latest.name + ': “' + clip(latest.text, 80) + '”' : 'Nobody has asked him anything yet';
      if (gaps.length) {
        var broken = gaps.filter(function (r) { return r.kind === 'failed' || r.kind === 'capped'; }).length, unsorted = gaps.length - broken;
        worse('warn');
        out.needs.unshift({ key: 'bruce:gaps', text: plural(gaps.length, 'ask') + ' to read: ' + [broken ? broken + ' failed or hit the daily cap' : '', unsorted ? unsorted + ' that matched none of his topics' : ''].filter(Boolean).join(', ') + '.', cta: 'Read them', href: '#bruce-look' });
      }
    } else if (id === 'alfred') {

      out.doing = (total ? 'Working through the items you sent back. ' : 'Nothing on his plate right now. ') + (out.last ? 'Last worked ' + ago(Date.now() - out.last) + '.' : 'No run seen yet.') + ' Sweeps every night at 9pm IST.';

  function stateLabel(s) {

  /* ---------- the tab row ---------- */

  /* ---------- needs, as a table ---------- */

  /* an agent's estimated tokens in the chosen period and its share of the team's total; an estimate, as everywhere on this page */
  function use(s, total) {

      '<span class="ag-use__bar" role="img" aria-label="' + pct + ' of the team\u2019s estimated tokens"><i style="width:' + Math.round(share * 100) + '%"></i></span></span>';
  }

  /* how much of the account's weekly limit is used: the plan reports one account-wide percentage (a dated snapshot), so this is the total, not a split by agent */
  function limitCard() {

      '<p class="ag-limit__note">As of ' + esc(fmtWhen(new Date(u.at))) + (age > 2 * DAY ? ' (' + Math.round(age / DAY) + ' days old)' : '') + '. A dated snapshot: the hub cannot read the live number.</p></div>');
  }

  /* ---------- All agents ---------- */

      list.map(function (s) {

  }

  /* ---------- one agent ---------- */
  function healthCard(s, only) {

    if (!h.rows.length) return card('Health', '', empty('first-use', 'No checks cover this agent yet', 'Doc checks the hub; nothing checks this agent so far.'));

    });

      table('Health checks', [{ h: 'Check', w: '220px', strong: true }, { h: 'Status', w: '170px', flex: true }, { h: 'Detail', w: 'minmax(0,1fr)', title: true, muted: true }], tr), { flush: true });
  }
  function ul(items) { return '<ul style="margin:0;padding-left:16px">' + items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'; }
  function aboutCard(a) {
    var d = S.data, route = (d.routing || []).filter(function (r) { return r.agent === a.id; })[0];
    var mem = String(a.memoryText || '').split('\n').filter(function (l) { return /^- /.test(l); }).map(function (l) { return l.slice(2).replace(/\*\*/g, '').replace(/`/g, ''); });

  }
  /* usage and tokens: the same three tiles at the top of every agent's tab. The first two are this agent's estimate; the third is the account's weekly limit (one number, from a dated snapshot) */
  function usageTiles(s) {
    var a = s.a, u = S.usage, resetAt = u && u.weekly && Date.parse(u.weekly.resetsAt) ? Date.parse(u.weekly.resetsAt) : 0, weekFrom = resetAt ? resetAt - 7 * DAY : Date.now() - 7 * DAY;
    var snapAge = u && Date.parse(u.at) ? Date.now() - Date.parse(u.at) : 0, unit = s.id === 'bruce' ? 'session' : 'run';

      { n: 'Tokens ' + (S.period === 'today' ? 'today' : 'in ' + S.period + ' days'), v: s.sessions ? '≈ ' + tok(s.tokens) : '—', c: s.sessions ? 'about ' + tok(s.tokens / s.sessions) + ' for each of ' + plural(s.sessions, unit) : 'no ' + unit + 's yet' },

      { n: 'Your weekly limit', v: u && u.weekly ? u.weekly.percentUsed + '% used' : '—', c: u && u.weekly ? 'everything on your account, as of ' + fmtWhen(new Date(u.at)) + (snapAge > 2 * DAY ? ' (' + Math.round(snapAge / DAY) + ' days old)' : '') : 'no snapshot found' }]) + '</section>';
  }
  function statsCard(s) {
    if (!s.known) return '';

  }
  function renderAlfred() {

  setInterval(function () { if (S.at) $('ag-refresh').setAttribute('data-tip', 'Updated ' + ago(Date.now() - S.at) + ' · click to refresh'); }, 15000);

  fetch('/admin/agents-data.json', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }).then(function (data) {
    S.data = data; var want = location.hash.slice(1); S.tab = want && (want === 'all' || agent(want)) ? want : 'all';
    $('ag-app').hidden = false; render(); loadAll();
  }).catch(function () { $('ag-state').innerHTML = empty('error', 'Could not load the agents', 'Try again in a moment.'); });
})();
</script>
</body></html>
