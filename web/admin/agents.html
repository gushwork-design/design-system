  function ago(ms) { var s = Math.max(0, Math.round(ms / 1000)); if (s < 60) return s + 's ago'; var m = Math.round(s / 60); if (m < 60) return m + ' min ago'; var h = Math.round(m / 60); if (h < 48) return h + ' h ago'; return Math.round(h / 24) + ' days ago'; }

  var TOPIC = { 'pass-on': 'Pass on to Utsav', status: 'Status check', access: 'Access', brand: 'Brand files', build: 'Build a page', template: 'Templates and tools', hub: 'Hub and system', about: 'About Bruce', other: 'No clear lane' };
  var S = { data: null, health: null, healthErr: '', bruce: null, bruceErr: '', alfred: null, alfredErr: '', period: '7', tab: 'all', at: 0, busy: false };

  /* ---------- health: the checks that matter to each agent ---------- */

    html += healthBox('alfred');
    html += box('Tasks', plural(al.threads.length, 'item') + ' in the last ' + (al.days || 30) + ' days', al.threads.length ? '<div class="ag-r ag-r--h r-thread"><span>Item</span><span>State</span><span>Last note</span><span>Last activity</span><span class="ag-c--num">Runs</span></div>' + al.threads.map(function (t) {
      return '<a class="ag-r r-thread" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer"><span class="ag-c"><strong>' + esc(t.scope + '/' + t.key) + '</strong></span><span>' + badge(t.state === 'ready' ? 'ok' : t.state === 'stuck' ? 'fail' : 'unknown', { ready: 'Ready to look at', stuck: 'Stuck', queued: 'Queued' }[t.state]) + '</span><span class="ag-c">' + esc(t.note || '—') + '</span><span class="ag-c">' + (t.lastAt ? esc(ago(Date.now() - Date.parse(t.lastAt))) : '—') + '</span><span class="ag-c ag-c--num">' + t.runs + '</span></a>';
    }).join('') : '<p class="ag-empty">No rework threads in this period.</p>', '<a href="/internal/design-system#review">Open Design System review</a>');
    return html + about(a);
  }

  function renderDoc() {
    var a = agent('doc'), s = summary('doc'), html = head(a, s), snap = S.health && S.health.snapshotAt ? Date.parse(S.health.snapshotAt) : 0, c = (S.health && S.health.counts) || null;
    var runs = docRuns(Date.now() - days() * DAY, Date.now()).reverse(), next = docNext();
    html += '<div class="ag-ms">' + metric('Checks', c ? (c.ok || 0) + ' ok' : '—', c ? (c.warn || 0) + ' warn, ' + (c.fail || 0) + ' fail' : (S.healthErr || 'reading')) + metric('Last report', snap ? ago(Date.now() - snap) : 'none yet', snap ? when(new Date(snap)) : 'the routine has not reported') +
      metric('Next run', next ? new Date(next).toLocaleDateString(undefined, { weekday: 'short' }) + ' ' + new Date(next).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '—', 'Monday and Thursday, 09:30 IST') + metric('Tokens, ' + S.period + ' days', '≈ ' + tok(s.tokens), plural(runs.length, 'scheduled run') + ', estimated') + '</div>';
    html += box('Usage', plural(runs.length, 'scheduled run') + ' in ' + S.period + ' days · ≈ ' + tok(s.tokens) + ' tokens (estimated)',
      (runs.length ? runs.map(function (t) { var past = t <= Date.now(); return '<div class="ag-r r-run"><span class="ag-c"><strong>' + esc(new Date(t).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })) + '</strong> 09:30 IST</span><span class="ag-c">Scheduled run</span><span class="ag-c ag-c--num">≈ ' + tok(a.cost.run) + '</span></div>'; }).join('') : '<p class="ag-empty">No scheduled runs in this period.</p>') +
      '<p class="ag-foot">These are the scheduled times, not confirmed runs: the hub only sees his latest report. ' + esc(a.cost.basis) + '</p>');
    html += healthBox('doc');
    var todo = s.needs;
    html += box('Tasks', todo.length ? plural(todo.length, 'finding') + ' to do' : 'nothing to do', todo.length ? todo.map(function (n) { return '<a class="ag-r r-need" href="' + esc(n.href) + '"><span class="ag-tag ag-tag--gap">' + esc(n.icon === 'fail' ? 'Fail' : 'Warn') + '</span><span class="ag-c ag-c--wrap">' + esc(n.text) + '</span><span></span></a>'; }).join('') : '<p class="ag-empty">' + (S.health ? 'Every check is healthy. He reads and reports; he never fixes what he finds.' : esc(S.healthErr || 'Reading the checks')) + '</p>', '<a href="/admin/system-health">Open system health</a>');
    return html + about(a);
  }

  function render() {
    tabs();
    var html = S.tab === 'bruce' ? renderBruce() : S.tab === 'alfred' ? renderAlfred() : S.tab === 'doc' ? renderDoc() : renderAll();
    $('ag-panel').innerHTML = html;
    document.querySelectorAll('.ag-pill').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-p') === S.period)); });
    tip();
  }
  /* "Updated 2 min ago" lives in the refresh button's tooltip, as on the other pages. */
  function tip() { $('ag-refresh').setAttribute('data-tip', S.at ? 'Updated ' + ago(Date.now() - S.at) + ' \u00b7 click to refresh' : 'Refresh'); }
  function setTab(id, push) {
    if (id !== 'all' && !agent(id)) id = 'all';
    S.tab = id; render();
    if (push) { try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; } }
  }

  /* ---------- loading: each source on its own, so one failing leaves the rest ---------- */
  function loadBruce() {
    return fetch('/api/bruce-memory?log=1', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) {
      if (r.status === 401 || r.status === 403) { S.bruceErr = 'Owners only'; return null; } if (!r.ok) throw new Error('http'); return r.json();
    }).then(function (j) {
      if (!j) return; if (!j.configured) { S.bruceErr = 'No store connected, so nothing is logged'; return; }
      S.bruce = (j.rows || []).map(function (r) { var d = new Date(r.at); return isNaN(d.getTime()) ? null : { at: d, user: String(r.user || ''), name: String(r.name || r.user || ''), kind: String(r.kind || 'run'), thread: !!r.thread, text: String(r.text || ''), topic: r.topic || (r.kind === 'sent' ? '' : 'other') }; }).filter(Boolean);
    }).catch(function () { S.bruceErr = 'Could not read his log'; });
  }
  function loadHealth() {
    return fetch('/api/health', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); }).then(function (j) { S.health = j && j.checks ? j : null; if (!S.health) S.healthErr = 'The checks returned nothing'; }).catch(function () { S.healthErr = 'Could not run the checks'; });
  }
  function loadAlfred() {
    return fetch('/api/agents?days=30', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }).then(function (j) {
      if (!j || !j.configured) { S.alfredErr = 'The site has no GitHub token, so his threads cannot be read'; return; }
      S.alfred = j.alfred; S.alfred.days = j.days;
    }).catch(function () { S.alfredErr = 'Could not read his threads'; });
  }
  function loadAll() {
    if (S.busy) return; S.busy = true; $('ag-refresh').setAttribute('aria-busy', 'true');
    var done = function () { S.at = Date.now(); S.busy = false; $('ag-refresh').removeAttribute('aria-busy'); render(); };
    return Promise.all([loadBruce().then(render), loadHealth().then(render), loadAlfred().then(render)]).then(done, done);
  }

  /* Alfred's byDay always covers 30 days; the period only decides how many of them are drawn and counted. */
  function alfredRunsIn(n) { if (!S.alfred) return 0; var from = Date.now() - n * DAY, t = 0; Object.keys(S.alfred.byDay || {}).forEach(function (k) { if (Date.parse(k + 'T12:00:00Z') >= from) t += S.alfred.byDay[k]; }); return t; }

  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('[data-tab]'); if (t) { setTab(t.getAttribute('data-tab'), true); window.scrollTo({ top: 0 }); return; }
    var p = e.target.closest && e.target.closest('.ag-pill'); if (p) { S.period = p.getAttribute('data-p'); render(); }
  });
  $('ag-tabs').addEventListener('keydown', function (ev) {
    var ids = [].slice.call(document.querySelectorAll('.ag-tab')).map(function (b) { return b.getAttribute('data-tab'); }), i = ids.indexOf(S.tab);
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { ev.preventDefault(); var n = ids[(i + (ev.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length]; setTab(n, true); var b = document.querySelector('.ag-tab[data-tab="' + n + '"]'); if (b) b.focus(); }
  });
  $('ag-refresh').addEventListener('click', loadAll);
  window.addEventListener('hashchange', function () { if (S.data) setTab(location.hash.slice(1) || 'all', false); });
  setInterval(tip, 15000);

  fetch('/admin/agents-data.json', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }).then(function (data) {
    S.data = data; var want = location.hash.slice(1); S.tab = want && (want === 'all' || agent(want)) ? want : 'all';
    $('ag-app').hidden = false; render(); loadAll();
  }).catch(function () { $('ag-state').innerHTML = '<div class="ag-note"><b>Could not load the agents</b>Try again in a moment.</div>'; });
})();
</script>
</body></html>
