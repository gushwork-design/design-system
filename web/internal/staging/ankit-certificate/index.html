<!doctype html>

<title>Best employee certificate — Ankit</title>
<!-- gushwork-build:{"pluginVersion":"1.57.0","surface":"brand","createdBy":"utsav.singh@gushwork.ai","createdAt":"2026-10-05"} -->
<link rel="stylesheet" href="/foundation/tokens.css">
<style>
@font-face{font-family:"Vert Grotesk Display";src:url("/fonts/Vert_Grotesk_Display_VF.ttf")format("truetype-variations");font-weight:100 900;font-style:normal;font-display:block}
@font-face{font-family:"Inter";src:url("/fonts/Inter-VariableFont_opsz_wght.ttf")format("truetype-variations");font-weight:100 900;font-style:normal;font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:var(--gw-space-40) var(--gw-space-16);
  background:var(--gw-color-neutral-25);font:var(--gw-text-body-16-reg);color:var(--gw-color-black);-webkit-font-smoothing:antialiased}
.cert{width:100%;max-width:1100px;padding:var(--gw-space-12);background:var(--gw-color-white);
  border:2px solid var(--gw-color-primary-500);border-radius:var(--gw-radius-20);box-shadow:var(--gw-shadow-s3)}
.inner{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--gw-space-32);
  padding:var(--gw-space-80) var(--gw-space-60);border:1px solid var(--gw-color-primary-100);border-radius:var(--gw-radius-12)}
.logo{height:40px;width:auto;display:block}
.eyebrow{font:var(--gw-text-body-14-sem);letter-spacing:.08em;text-transform:uppercase;color:var(--gw-color-primary-500)}
h1{font:var(--gw-text-h4);color:var(--gw-color-black)}
.to{font:var(--gw-text-body-16-med);color:var(--gw-color-neutral-600)}
.name{font:var(--gw-text-h1);color:var(--gw-color-primary-500)}
.line{max-width:560px;font:var(--gw-text-body-16-reg);color:var(--gw-color-neutral-700)}
.head{display:flex;flex-direction:column;align-items:center;gap:var(--gw-space-12)}
.sign{width:100%;max-width:640px;display:flex;justify-content:space-between;gap:var(--gw-space-32);margin-top:var(--gw-space-24)}
.sign div{flex:1;padding-top:var(--gw-space-12);border-top:1px solid var(--gw-color-neutral-200);display:flex;flex-direction:column;gap:var(--gw-space-4)}
.sign b{font:var(--gw-text-body-16-sem)}
.sign span{font:var(--gw-text-body-14-reg);color:var(--gw-color-neutral-600)}
@media (max-width:640px){
  .inner{padding:var(--gw-space-48) var(--gw-space-20);gap:var(--gw-space-24)}
  h1{font:var(--gw-text-h6-bold)}
  .name{font:var(--gw-text-h3)}
  .sign{flex-direction:column;gap:var(--gw-space-24)}
}
</style>
</head>
<body>
<main class="cert">
  <div class="inner">
    <img class="logo" src="assets/gushwork-logo-original.svg" alt="Gushwork" height="40" width="210">
    <div class="head">
      <p class="eyebrow">Certificate of recognition</p>
      <h1>Best employee, 2026</h1>
    </div>
    <p class="to">Presented to</p>
    <p class="name">Ankit</p>
    <p class="line">For the work that moved the team forward this year, and for the standard you set for everyone around you. Thank you.</p>
    <div class="sign">
      <div><b>Utsav Singh</b><span>Gushwork</span></div>
      <div><b>5 October 2026</b><span>Date</span></div>
    </div>
  </div>
</main>
</body>
