<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage Neo — Staging — Gushwork Design</title>
<meta name="robots" content="noindex">
<script>try{var t=localStorage.getItem('gw-theme')||'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="/foundation/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--gw-color-neutral-25); }
  .stg-bar {
    display: flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 16px;
    border-bottom: 1px solid var(--gw-color-neutral-100);
    font: 500 13px/1 'Inter', system-ui, sans-serif;
    color: var(--gw-color-neutral-600);
  }
  .stg-bar a { color: var(--gw-color-neutral-900); text-decoration: none; }
  .stg-bar a:hover { text-decoration: underline; }
  .stg-bar .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 100px;
    background: var(--gw-color-primary-alpha-10, rgba(0,112,255,0.08));
    color: var(--gw-color-primary-500); font-weight: 600;
  }
  .stg-bar .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gw-color-primary-500); }
  .stg-frame-wrap { height: calc(100% - 44px); }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body data-gw-page="staging-homepage-neo">

<div class="stg-bar">
  <span class="pill"><span class="dot"></span>Staging</span>
  <span>Homepage Neo — served from this site, framed to keep the staging chrome</span>
  <a href="/internal/staging" style="margin-left:auto">&larr; All staging</a>
  <a href="/design-staging/homepage-neo" target="_blank" rel="noopener noreferrer">Open directly &#8599;</a>
</div>
<div class="stg-frame-wrap">
  <!-- same-origin now that the page is committed to this repo: no cross-site
       storage partitioning, so the chat widget's history persists -->
  <iframe src="/design-staging/homepage-neo"
          title="Homepage Neo — staged preview" loading="eager"></iframe>
</div>

</body></html>
