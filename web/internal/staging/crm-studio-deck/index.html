<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gushwork CRM Studio — discovery deck</title>
<script>
/* This deck lives in a folder and uses relative asset paths. Some hosts serve a
   directory without a trailing slash (Vercel's trailingSlash:false does exactly
   that), and then "assets/..." resolves one level too high and everything 404s.
   Setting <base> here — before any <link> or <img> is parsed — fixes it for
   every relative URL at once, including the ones CSS and JS build later. */
(function () {
  var p = location.pathname;
  if (!(p.slice(-1) === '/' || /\.[a-z0-9]+$/i.test(p))) {
    var b = document.createElement('base');
    b.href = p + '/';
    document.head.appendChild(b);
  }
})();
</script>
<style>
/* ───────────────────────────────────────────────────────────────
   Gushwork CRM Studio — AE discovery deck
   Tokens from the Gushwork design system (_fig/GW-Slides/tokens.css)
   Slides are 1920×1080, scaled to fit the viewport.
   ─────────────────────────────────────────────────────────────── */

@font-face {
  font-family: "Vert Grotesk Display";
  src: url("fonts/Vert_Grotesk_Display_VF.ttf") format("truetype-variations");
  font-weight: 100 900; font-display: swap;
}
@font-face {
  font-family: "InterVar";
  src: url("fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype-variations");
  font-weight: 100 900; font-display: swap;
}

:root {
  /* colors */
  --primary-500: rgb(0,112,255);
  --primary-600: rgb(0,97,224);
  --primary-700: rgb(0,78,191);
  --primary-400: rgb(51,140,255);
  --primary-300: rgb(102,169,255);
  --primary-100: rgb(204,226,255);
  --primary-25:  rgb(242,248,255);
  --primary-a10: rgba(0,112,255,0.1);
  --neutral-25:  rgb(247,248,249);
  --neutral-50:  rgb(241,242,243);
  --neutral-100: rgb(225,227,232);
  --neutral-200: rgb(207,209,212);
  --neutral-300: rgb(187,190,196);
  --neutral-400: rgb(149,155,164);
  --neutral-600: rgb(106,112,119);
  --neutral-700: rgb(83,90,97);
  --neutral-800: rgb(77,84,92);
  --neutral-900: rgb(38,42,46);
  --black:       rgb(13,13,13);
  --white:       #fff;
  --green-200:   rgb(31,193,107);
  --yellow-200:  rgb(223,180,0);
  --red-100:     rgb(251,55,72);

  /* type */
  --font-display: "Vert Grotesk Display", "Plus Jakarta Sans", system-ui, sans-serif;
  --font-body: "InterVar", Inter, system-ui, -apple-system, sans-serif;

  /* radii */
  --r8: 8px; --r10: 10px; --r12: 12px; --r16: 16px; --r24: 24px; --r32: 32px;
}

* { box-sizing: border-box; }

/* Icons are inlined SVG rather than an icon font — drops ~920KB of webfont, keeps the
   deck working with no network, and leaves no vendor CSS in the repo. The <i> wrapper
   means every existing font-size / color rule still drives them. */
.ic-svg { display: inline-flex; width: 1em; height: 1em; flex: none; vertical-align: -.125em; }
.ic-svg svg { width: 100%; height: 100%; fill: currentColor; display: block; }
html, body { margin: 0; padding: 0; height: 100%; background: #0B0B0C; overflow: hidden;
  font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

/* ── stage ─────────────────────────────────────────────────────── */
/* The deck is always wider than the window, and grid/flex `center` clamps to
   `start` for an overflowing item — so centring is done in px by fit(), not CSS. */
#stage { position: fixed; inset: 0; overflow: hidden; }
#deck  { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
         transform-origin: 0 0; }
.slide {
  position: absolute; inset: 0; width: 1920px; height: 1080px;
  overflow: hidden; display: none; color: var(--black);
}
.slide.is-current { display: block; }

.surface-dark  { background: var(--black); color: #fff; }
/* 1199:8202 — the grid is a vector at (60, -14), 3879 x 1108, not a bitmap */
.cover-grid { position: absolute; left: 60px; top: -14px; width: 3879px; height: 1108px;
  pointer-events: none; }
.surface-blue  { background: var(--primary-500) url("assets/bg-blue.png") center/cover no-repeat; color: #fff; }
.surface-light { background: var(--neutral-50); }
/* 1242:9909 — grid vector, 1953.995 x 1357.562, centred, top -15.28 */
.q-grid { position: absolute; left: 50%; top: -15.28px; width: 1953.995px; height: 1357.562px;
  transform: translateX(-50%); pointer-events: none; }

/* ── type scale ────────────────────────────────────────────────── */
.h-cover { font-family: var(--font-display); font-weight: 700; font-size: 84px; line-height: 1.2;
  letter-spacing: -1px; margin: 0; }
.h-band  { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: 1.2;
  letter-spacing: -1px; margin: 0; color: #fff; white-space: nowrap; }
.h-q     { font-family: var(--font-display); font-weight: 700; font-size: 48px; line-height: 1.15;
  letter-spacing: -.02em; margin: 0; }
.t-lead  { font-family: var(--font-body); font-weight: 400; font-size: 27px; line-height: 1.5;
  letter-spacing: -.006em; color: var(--neutral-700); margin: 0; }

/* ── cover ─────────────────────────────────────────────────────── */
.cover-block {
  position: absolute; left: 100px; top: 423.5px; transform: translateY(-50%); width: 820px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 40px;
}
.cover-mark { width: 104px; height: 104px; display: block; }
.cover-head { width: 100%; color: #fff; }
/* 1199:8208 — Inter Medium 24, neutral-600, tracking -1px, centred on y 865.5 */
.cover-url {
  position: absolute; left: 120px; top: 865.5px; transform: translateY(-50%);
  font-size: 24px; font-weight: 500; line-height: 1.2; letter-spacing: -1px;
  color: var(--neutral-600); text-decoration: none;
}
.cover-url:hover { color: var(--primary-400); }
/* 1199:9240 — the bezel. 1432 wide at left 1020 runs 532px past the slide edge, which is
   what clips the 1485-wide window inside it. No scaling: the window is at 1:1. */
/* Figma draws this 12px stroke OUTSIDE the frame, so the 1432 x 880 is the CONTENT
   box at (1020, 100.5) and the stroke grows outward from there — hence content-box. */
.cover-slot {
  position: absolute; left: 1008px; top: 88.5px; width: 1432px; height: 880px;
  box-sizing: content-box;
  background: var(--neutral-50); border: 12px solid var(--neutral-600); border-radius: 48px;
  overflow: hidden; cursor: pointer;
}
.cover-slot .cover-art { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }
.cover-slot .slot-hint {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 26px 18px; text-align: right;
  font-size: 17px; font-weight: 500; color: rgba(255,255,255,.92);
  background: linear-gradient(to top, rgba(0,0,0,.55), transparent);
  opacity: 0; transition: opacity .15s; pointer-events: none;
}
.cover-slot:hover .slot-hint { opacity: 1; }

/* ═══════════════════════════════════════════════════════════════════════════
   Cover artwork — CRM window, rebuilt in CSS from Figma node 1199:9241
   ("display", 1485 × 880). Every number below is a node property read out of
   the Figma file, not measured off a render, so it stays sharp at any zoom.
   Figma's spacing unit here is 5.5 — hence 11 / 13.75 / 16.5 / 22 / 24.75.
   ═══════════════════════════════════════════════════════════════════════════ */

.crm {
  --line: #e7e7e7;             /* window hairlines            (design context)   */
  --ph-lo: #f4f4f4;            /* lighter placeholder bar                        */
  --ph-hi: #e7e7e7;            /* heavier placeholder bar                        */
  --ink: #0d0d0d;              /* Colors/Neutral/black                           */
  --muted: #727272;
  position: absolute; left: 0; top: 0;
  width: 1485px; height: 880px;
  background: var(--neutral-50);
  border: 2.75px solid var(--neutral-100); border-radius: 27.5px;
  padding: 16.5px; display: flex; flex-direction: column; gap: 16.5px;
  filter: drop-shadow(0 22px 22px rgba(88,92,95,.1));
  font-family: var(--font-body);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
.crm * { box-sizing: border-box; }
.crm svg { display: block; }

/* ── window chrome: frame 1199:9242 at 16.5,16.5 — dots d=16.5 at x 13.3/35.3/57.3 ── */
.crm-chrome { position: relative; flex: 0 0 auto; width: 87.137px; height: 29.818px; }
.crm-chrome i {
  position: absolute; top: 6.66px; width: 16.5px; height: 16.5px; border-radius: 50%;
}
.crm-chrome i:nth-child(1) { left: 13.32px; background: #f43f5e; } /* Colors/Red/400    */
.crm-chrome i:nth-child(2) { left: 35.32px; background: #f59e0b; } /* Colors/Yellow/400 */
.crm-chrome i:nth-child(3) { left: 57.32px; background: #22c55e; } /* Colors/Green/400  */

/* 1199:9246 — dashboard-container: flex-1, neutral-25, 2.75px neutral-100, r22 */
.crm-body {
  flex: 1 0 0; min-height: 0; width: 100%; display: flex; align-items: stretch;
  background: var(--neutral-25); border: 2.75px solid var(--neutral-100);
  border-radius: 22px; overflow: hidden;
}

/* ── sidebar 1199:9247 — 247.5 wide, px 22 / py 27.5, justify-between ── */
.crm-side {
  width: 247.5px; flex: 0 0 247.5px; background: #fff;
  border-right: 1.375px solid var(--line);
  padding: 27.5px 22px;
  display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
}
.crm-side-top { display: flex; flex-direction: column; gap: 27.5px; width: 100%; }

/* logo card 1199:9249 — h 64, r 8, border Colors/Neutral/100, Shadows S2-ish */
.crm-logo-card {
  position: relative; width: 100%; height: 64px;
  background: #fff; border: 1px solid #e7e8e9; border-radius: 8px;
  filter: drop-shadow(0 2px 2px rgba(27,28,29,.04));
}
/* the drop zone itself: 1199:9250, 132 × 36, centred, dashed Colors/Neutral/200 */
.crm-logo-slot {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 132px; height: 36px; padding: 0; border: 1px dashed #cfd1d4; background: transparent;
  display: grid; place-items: center; overflow: hidden; cursor: pointer;
  font: inherit; border-radius: 3px; transition: box-shadow .12s, background .12s, border-color .12s;
}
.crm-logo-slot .crm-ph {                   /* 1199:9253 — Inter Medium 12, #4d545c */
  background: #fff; padding: 2px;
  font-size: 12px; font-weight: 500; color: #4d545c; white-space: nowrap; letter-spacing: 0;
}
.crm-logo-slot:hover { box-shadow: 0 0 0 3px var(--primary-500); border-color: transparent; }
.crm-logo-slot.is-set { border-color: transparent; background: #fff; }
.crm-logo-slot img { max-width: 92%; max-height: 82%; object-fit: contain; display: block; }

/* nav 1199:9254 — gap 22, opacity .85 */
.crm-nav { display: flex; flex-direction: column; gap: 22px; width: 100%; opacity: .85; }
.crm-nav-group { display: flex; flex-direction: column; gap: 8.25px; width: 100%; }
.crm-nav-label {                            /* Inter SemiBold 12, Colors/Neutral/300 */
  font-size: 12px; font-weight: 600; color: #bbbec4; text-transform: uppercase; letter-spacing: 0;
}
.crm-nav-item {
  display: flex; align-items: center; gap: 13.75px; width: 100%;
  padding: 13.75px 16.5px; border-radius: 13.75px; background: transparent;
  font-size: 16.5px; font-weight: 500; color: var(--ink); white-space: nowrap;
}
.crm-nav-item.is-active { background: #f0f0f0; font-weight: 600; }
.crm-nav-item .ic { flex: 0 0 22px; width: 22px; height: 22px; }
.crm-nav-item .ic svg { width: 22px; height: 22px; }

/* sidebar-footer 1199:9291 — p 13.75, r 11; "Log out" Inter SemiBold 15.125 #727272 */
.crm-side-foot {
  display: flex; align-items: flex-start; width: 100%;
  padding: 13.75px; border-radius: 11px;
}
.crm-side-foot span.txt { flex: 1 0 0; font-size: 15.125px; font-weight: 600; color: var(--muted); }
.crm-side-foot .ic { flex: 0 0 22px; width: 22px; height: 22px; }
.crm-side-foot .ic svg { width: 22px; height: 22px; }

/* ── main-container 1199:9296 — 1204.5 wide ── */
.crm-main { flex: 1 0 0; min-width: 0; background: #f4f4f4;
  padding: 33px 33px 0; display: flex; flex-direction: column; gap: 33px; }

/* top-navbar 1199:9297 — 1138.5 × 41.25 at 33, 33 */
.crm-topnav { width: 100%; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between; }
.crm-tabs { display: flex; align-items: center; gap: 11px; }
.crm-tab {
  display: flex; align-items: center; gap: 8.25px;
  padding: 8.25px 16.5px; border-radius: 137.5px;
  background: #fff; border: 1.375px solid var(--line);
  font-size: 16.5px; font-weight: 500; color: var(--muted); white-space: nowrap;
}
.crm-tab .ic, .crm-tab .ic svg { width: 16.5px; height: 16.5px; }
.crm-tab.is-active {                        /* bg Colors/Neutral/600, 90% white type */
  background: #6a7077; border-color: transparent; color: #fff; font-weight: 600;
}
.crm-tab.is-active .ic, .crm-tab.is-active span { opacity: .9; }
.crm-topnav-right { display: flex; align-items: center; gap: 16.5px; }
.crm-iconbtn {
  display: flex; padding: 11px; border-radius: 137.5px;
  background: #fff; border: 1.375px solid var(--line);
}
.crm-iconbtn .ic, .crm-iconbtn .ic svg { width: 19.25px; height: 19.25px; }
.crm-user { display: flex; align-items: center; gap: 11px; }
.crm-avatar {
  width: 38.5px; height: 38.5px; border-radius: 137.5px; background: #f0f0f0;
  display: grid; place-items: center; font-size: 15.125px; font-weight: 700; color: #bfbfbf;
}
.crm-user .nm { font-size: 16.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.crm-user .ic, .crm-user .ic svg { width: 16.5px; height: 16.5px; }

/* 1199:9335 — content stack, gap 31.625 */
.crm-content { width: 100%; display: flex; flex-direction: column; gap: 31.625px; }

/* title-header 1199:9336 — Inter SemiBold 28 / Regular 14, both at 60% */
.crm-title { width: 100%; }
.crm-title h1 { margin: 0; font-size: 28px; font-weight: 600; color: var(--ink); opacity: .6;
  line-height: normal; letter-spacing: 0; }
.crm-title p  { margin: 2.75px 0 0; font-size: 14px; font-weight: 400; color: #737373; opacity: .6;
  line-height: normal; letter-spacing: 0; }

/* shared placeholder bar */
.crm .b { display: block; background: var(--ph-lo); border-radius: 5.5px; flex: none; }
.crm .b.hi { background: var(--ph-hi); }

/* revenue-overview-card 1199:9339 — 332.5 tall at y 85.375, r 24.75 */
.crm-card { width: 100%; background: #fff; border-radius: 24.75px;
  display: flex; flex-direction: column; align-items: flex-start;
  filter: drop-shadow(0 22px 27.5px rgba(88,92,95,.16)); }
.crm-card-revenue { gap: 8.25px; padding: 16.5px 22px 13.75px; }
.crm-card-title { font-size: 16px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.crm-split { display: flex; align-items: center; gap: 11px; width: 100%; }

.crm-metrics { width: 220px; flex: 0 0 220px; display: flex; flex-direction: column; gap: 5.5px; }
.crm-metric {
  background: #fff; border: 1.375px solid var(--ph-lo); border-radius: 16.5px;
  padding: 11px 13.75px; display: flex; flex-direction: column; align-items: flex-start; gap: 2.75px;
}
.crm-metric .status { display: flex; align-items: center; gap: 8.25px; }
.crm-metric .status .sq { display: block; width: 16.5px; height: 16.5px; border-radius: 5.5px;
  background: var(--ph-hi); flex: none; }

.crm-chart { flex: 1 0 0; min-width: 0; height: 275px; display: flex; flex-direction: column; gap: 13.75px; }
.crm-plot { position: relative; height: 233.75px; overflow: hidden; }
.crm-yaxis {
  position: absolute; left: 0; top: 0; width: 55px; height: 220px;
  display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between;
}
.crm-grid { position: absolute; left: 71.5px; right: 18.75px; top: 8.25px; height: 203.5px; }
.crm-grid svg { width: 100%; height: 100%; }
.crm-target {
  position: absolute; left: 71.5px; right: 18.75px; top: 165px;
  display: flex; align-items: center; gap: 11px;
}
/* 1199:9378 is a 605px dashed rule — drawn in CSS so it stays crisp at any scale */
.crm-target .rule { width: 605px; flex: 0 0 605px; border-top: 1.375px dashed #d2d2d2; }
.crm-target .lbl { width: 110px; display: flex; flex-direction: column; gap: 2.75px; }
.crm-bars {
  position: absolute; left: 110px; right: -19.75px; top: 27.5px; height: 220px;
  display: flex; align-items: flex-end; justify-content: center; gap: 82.5px;
}
.crm-bargroup { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8.25px; }
.crm-bargroup .bar { width: 82.5px; border-radius: 8.25px 8.25px 0 0; flex: none; }
.crm-bargroup .labels { display: flex; flex-direction: column; align-items: center; gap: 2.75px; }
.crm-legend { display: flex; align-items: flex-start; justify-content: center; gap: 22px; }
.crm-legend > div { display: flex; align-items: center; gap: 8.25px; }
.crm-legend .sw { display: block; width: 13.75px; height: 13.75px; border-radius: 5.5px; flex: none; }

/* recent-activity-card 1199:9402 — 244.75 tall at y 449.5 */
.crm-card-activity { gap: 5.5px; padding: 11px 22px; }
.crm-thead { display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 5.5px; width: 100%; }
.crm-thead .ttl { font-size: 16px; font-weight: 600; color: var(--ink); opacity: .6; }
.crm-viewall {
  display: flex; align-items: center; gap: 8.25px;
  padding: 5.5px 13.75px; border: 1.375px solid var(--line); border-radius: 137.5px;
}
.crm-viewall .ic, .crm-viewall .ic svg { width: 13.75px; height: 13.75px; }
.crm-table { display: flex; flex-direction: column; width: 100%; }
.crm-tr { display: flex; align-items: center; padding: 8.25px 16.5px; }
.crm-tr.head { background: var(--ph-lo); border-radius: 11px; align-items: flex-start; }
.crm-tr.body { border-bottom: 1.375px solid var(--ph-lo); }
.crm-tr.body:last-child { border-bottom: none; }
.crm-tr .grow { flex: 1 0 0; min-width: 0; }
.crm-tr .badge { width: 151.25px; flex: 0 0 151.25px; }
.crm-tr .badge > i { display: block; width: 104.5px; height: 22px; border-radius: 137.5px; background: var(--ph-lo); }
.crm-tr .acts { width: 82.5px; flex: 0 0 82.5px; display: flex; justify-content: center; }
.crm-tr .acts > i { display: block; width: 16.5px; height: 16.5px; border-radius: 5.5px; background: var(--ph-lo); }


/* ── question slide — node 1242:9908 ──────────────────────────────────────
   Split layout: the question on the left, and a flow panel on the right that
   fills in as the AE ticks — so the answers finally have somewhere to land. */

/* 1242:9910 — 1060 wide, pl 100 / pr 120, centred on (530, 477.5) */
.q-wrap { position: absolute; left: 0; top: 477.5px; transform: translateY(-50%);
  width: 1060px; padding: 0 120px 0 100px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 40px; }
.q-head-block { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; width: 100%; }

/* 1242:9913 — eyebrow */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 6px 10px; border-radius: 133.333px;
  background: var(--neutral-25); border: .667px solid var(--neutral-100);
  font-size: 16px; font-weight: 500; line-height: 1; color: var(--black); white-space: nowrap; }
.pill i { font-size: 18.667px; }
.pill .sep { color: var(--neutral-200); }
.pill .count { color: var(--neutral-600); }

/* 1242:9924 — options, gap 20, min-height 320 */
.q-options { display: flex; flex-direction: column; gap: 20px; width: 100%; min-height: 320px; }
/* 1242:9925 — row: neutral-50, 2px neutral-100, r20, p16, gap 10 */
.opt {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 16px;
  border-radius: 20px; background: var(--neutral-50); border: 2px solid var(--neutral-100);
  font-size: 20px; font-weight: 500; line-height: 1; color: var(--neutral-800);
  cursor: pointer; user-select: none; text-align: left;
  transition: border-color .12s, background .12s, color .12s;
}
.opt:hover { border-color: var(--neutral-200); }
/* 1242:9926 — 28px circle; selected fills black (1242:9932) */
.opt .box { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 40px;
  background: var(--neutral-100); border: 1px solid var(--neutral-200);
  display: grid; place-items: center; color: transparent; font-size: 16px; transition: all .12s; }
.opt .key { margin-left: auto; flex: 0 0 auto; font-size: 13px; font-weight: 600;
  color: var(--neutral-300); border: 1px solid var(--neutral-100); border-radius: 6px;
  padding: 2px 7px; font-variant-numeric: tabular-nums; }
.opt.is-on { background: #fff; border-color: var(--neutral-200); color: var(--neutral-900); }
.opt.is-on .box { background: var(--black); border-color: var(--black); color: #fff; }
.opt.is-on .key { color: var(--neutral-400); }

.opt-other { display: flex; align-items: center; gap: 10px; width: 100%; padding: 16px;
  border-radius: 20px; background: var(--neutral-50); border: 2px dashed var(--neutral-100); }
.opt-other .box { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 40px;
  background: var(--neutral-100); border: 1px dashed var(--neutral-200);
  display: grid; place-items: center; color: var(--neutral-400); font-size: 14px; }
.opt-other.is-on { border-style: solid; background: #fff; border-color: var(--neutral-200); }
.opt-other.is-on .box { background: var(--black); border-color: var(--black); color: #fff; }

/* table columns: 'grow' | 'badge' | 'acts' | fixed width, with each cell's tone */
const CRM_COLS = [
  { w: 'grow' }, { w: 110, tone: 'lo' }, { w: 123.75, tone: 'hi' },
  { w: 'badge' }, { w: 151.25, tone: 'lo' }, { w: 151.25, tone: 'hi' }, { w: 'acts' }
];

function crmRow(h, headTone) {
  return CRM_COLS.map(c => {
    if (c.w === 'badge') return `<span class="badge"><i></i></span>`;
    if (c.w === 'acts')  return `<span class="acts"><i></i></span>`;
    if (c.w === 'grow')  return `<span class="b hi grow" style="height:${h}px"></span>`;
    return bar(c.w, h, headTone !== undefined ? headTone : c.tone === 'hi');
  }).join('');
}

function crmWindow(logoDataUrl) {
  const logo = logoDataUrl
    ? `<img src="${logoDataUrl}" alt="Client logo">`
    : `<span class="crm-ph">CLIENT LOGO</span>`;

  const nav = CRM_NAV.map(g => `
    <div class="crm-nav-group">
      <div class="crm-nav-label">${g.label}</div>
      ${g.items.map(([icon, name, active]) => `
        <div class="crm-nav-item${active ? ' is-active' : ''}">
          <span class="ic">${ico(icon)}</span>${name}
        </div>`).join('')}
    </div>`).join('');

  const tabs = CRM_TABS.map(([icon, name, active]) => `
    <div class="crm-tab${active ? ' is-active' : ''}">
      <span class="ic">${ico(icon)}</span><span>${name}</span>
    </div>`).join('');

  const metrics = CRM_METRICS.map(m => `
    <div class="crm-metric">
      ${bar(m.w, 13.75)}${bar(151.25, 24.75, true)}
      <div class="status">${m.status}</div>
    </div>`).join('');

  const bars = CRM_BARS.map(b => `
    <div class="crm-bargroup">
      ${bar(b.cap, 19.25, true)}
      <div class="bar" style="height:${b.h}px;background:${b.fill}"></div>
      <div class="labels">${bar(b.l1, 16.5)}${bar(b.l2, 13.75)}</div>
    </div>`).join('');

  return `<div class="crm">
    <img class="crm-chrome" src="assets/cover/chrome.svg" alt="">
    <div class="crm-body">
      <aside class="crm-side">
        <div class="crm-side-top">
          <div class="crm-logo-card">
            <button class="crm-logo-slot${logoDataUrl ? ' is-set' : ''}" id="logo-slot"
                    title="Add this client's logo">${logo}</button>
          </div>
          <div class="crm-nav">${nav}</div>
        </div>
        <div class="crm-side-foot">
          <span class="txt">Log out</span><span class="ic">${ico('log-out')}</span>
        </div>
      </aside>

      <div class="crm-main">
        <div class="crm-topnav">
          <div class="crm-tabs">${tabs}</div>
          <div class="crm-topnav-right">
            <div class="crm-iconbtn"><span class="ic">${ico('mail')}</span></div>
            <div class="crm-iconbtn"><span class="ic">${ico('bell')}</span></div>
            <div class="crm-user">
              <span class="crm-avatar">JD</span>
              <span class="nm">John Doe</span>
              <span class="ic">${ico('chevron-down')}</span>
            </div>
          </div>
        </div>

        <div class="crm-content">
          <div class="crm-title">
            <h1>Performance</h1>
            <p>Performance for Aug 2026</p>
          </div>

          <div class="crm-card crm-card-revenue">
            <div class="crm-card-title">Overview and money coming</div>
            <div class="crm-split">
              <div class="crm-metrics">${metrics}</div>
              <div class="crm-chart">
                <div class="crm-plot">
                  <div class="crm-yaxis">${Array(6).fill(bar(60.5, 13.75)).join('')}</div>
                  <div class="crm-grid">${ico('grid-lines')}</div>
                  <div class="crm-target">
                    <span class="rule"></span>
                    <span class="lbl">${bar(60.5, 13.75)}${bar(88, 16.5, true)}</span>
                  </div>
                  <div class="crm-bars">${bars}</div>
                </div>
                <div class="crm-legend">
                  <div><span class="sw" style="background:#bfbfbf"></span>${bar(77, 13.75)}</div>
                  <div><span class="sw" style="background:#d2d2d2"></span>${bar(99, 13.75)}</div>
                </div>
              </div>
            </div>
          </div>

          <div class="crm-card crm-card-activity">
            <div class="crm-thead">
              <span class="ttl">Recent Activity</span>
              <span class="crm-viewall">${bar(60.5, 16.5)}<span class="ic">${ico('arrow-right')}</span></span>
            </div>
            <div class="crm-table">
              <div class="crm-tr head">${crmRow(13.75, true)}</div>
              ${Array(4).fill(`<div class="crm-tr body">${crmRow(16.5)}</div>`).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>

  if (raw) Object.assign(state, JSON.parse(raw));
} catch (e) { /* private window, carry on with defaults */ }
STAGES.forEach(s => { if (!Array.isArray(state.answers[s.key])) state.answers[s.key] = []; });
if (!state.other || typeof state.other !== 'object') state.other = {};
if (typeof state.logo !== 'string') state.logo = '';
STAGES.forEach(s => { if (typeof state.other[s.key] !== 'string') state.other[s.key] = ''; });

function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ answers: state.answers, other: state.other, cover: state.cover, logo: state.logo })); }
  catch (e) { /* storage unavailable — the deck still works, it just won't remember */ }
}

/* ═══════════════════════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════════════════════ */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/** Light brand colours need dark ink on the tint, or the glyph disappears. */
function isLight(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => v / 255)
    .map(v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.55;
}

function appLogo(slug) {
  const a = LOGOS[slug];
  if (!a) return '';
  const ink = isLight(a.hex) ? '#1A1A1A' : a.hex;
  const bg = a.hex + '1F';
  const inner = a.d
    ? `<svg viewBox="0 0 24 24" fill="${ink}"><path d="${a.d}"></path></svg>`
    : esc(a.name[0]);
  return `<span class="applogo" style="background:${bg};color:${ink}">${inner}</span>`;
}
const appName = slug => LOGOS[slug] ? esc(LOGOS[slug].name) : esc(slug);

const gmark = 'assets/gushwork-icon-white.svg';

/* ═══════════════════════════════════════════════════════════════
   Slide builders
   ═══════════════════════════════════════════════════════════════ */

function coverSlide() {
  // A dropped-in screenshot replaces the whole window; otherwise it is drawn from Figma values.
  const art = state.cover
    ? `<img class="cover-art" src="${state.cover}" alt="Client dashboard">`
    : crmWindow(state.logo);
  return `<section class="slide surface-dark" data-kind="cover">
    <img class="cover-grid" src="assets/cover/grid.svg" alt="">
    <div class="cover-block">
      <img class="cover-mark" src="assets/cover/mark.svg" alt="Gushwork">
      <h1 class="h-cover cover-head">We build the software around how you already work</h1>
    </div>
    <a class="cover-url" href="https://www.gushwork.ai" target="_blank"
       rel="noopener noreferrer">www.gushwork.ai</a>
    <div class="cover-slot" id="cover-slot">
      ${art}
      <div class="slot-hint">Click the logo box to add their logo · click the screen to swap it</div>
    </div>
  </section>`;
}

/* What the AE has ticked for a stage, in the client's own words. */
const picksFor = key => {
  const list = (state.answers[key] || []).slice();
  if (state.other[key]) list.push(state.other[key]);
  return list;
};

/* 1242:9996 — the panel fills in as the call goes: answered stages show their chips,
   the stage being asked is highlighted, stages still ahead sit dimmed. */
function flowPanel(currentIdx) {
  const stages = STAGES.map((st, i) => {
    const picks = picksFor(st.key);
    const mode = i === currentIdx ? 'is-now' : (picks.length ? 'is-done' : 'is-todo');
    const chips = picks.length
      ? picks.map(o => `<span class="chip">${esc(o)}</span>`).join('')
      : `<span class="chip is-empty">—</span>`;
    return `<div class="flow-stage ${mode}">
      <div class="flow-head">
        <span class="flow-ico" style="background:${st.tint};border-color:${st.edge}">
          <img src="assets/stack/${st.art}" alt=""></span>
        <span class="flow-name">${esc(st.name)}</span>
      </div>
      <div class="flow-chips">${chips}</div>
    </div>`;
  }).join('');
  return `<div class="flow">
    <h2>${esc(FLOW_TITLE)}</h2>
    <div class="flow-stages">${stages}</div>
  </div>`;
}

function questionSlide(stage, idx) {
  const picked = state.answers[stage.key];
  const opts = stage.options.map((o, n) => `
    <button class="opt${picked.includes(o) ? ' is-on' : ''}" data-stage="${stage.key}" data-opt="${esc(o)}">
      <span class="box">${ph('check','bold')}</span>
      <span>${esc(o)}</span>
      <span class="key">${n + 1}</span>
    </button>`).join('') + `
    <label class="opt-other${state.other[stage.key] ? ' is-on' : ''}">
      <span class="box">${ph('pencil-simple','bold')}</span>
      <input type="text" data-other="${stage.key}" value="${esc(state.other[stage.key])}"
             placeholder="Something else — type what they said"
             data-1p-ignore="true" data-lpignore="true" data-form-type="other">
    </label>`;
  const steps = STAGES.map((s, n) =>
    `<b class="${n === idx ? 'here' : (n < idx ? 'done' : '')}"></b>`).join('');
  return `<section class="slide surface-light" data-kind="question" data-stage="${stage.key}">
    <img class="q-grid" src="assets/flow/grid.svg" alt="">
    <div class="q-wrap">
      <div class="q-head-block">
        <span class="pill">
          ${ph(stage.icon)}${esc(stage.name)}
          <span class="sep">|</span><span class="count">${idx + 1}/5</span>
        </span>
        <h1 class="h-q">${esc(stage.question)}</h1>
      </div>
      <div class="q-options">${opts}</div>
      <div class="q-nav">
        <span class="hint" data-role="tally"></span>
        <button class="btn btn-ghost btn-icon" data-nav="prev">${ph('arrow-left','bold')}</button>
        <button class="btn btn-blue" data-nav="next">Next${ph('arrow-right','bold')}</button>
      </div>
    </div>
    ${flowPanel(idx)}
    <div class="q-foot">
      <img class="mark" src="assets/flow/mark.svg" alt="">
      ${esc(WORKFLOW_TITLE)}
      <span class="steps">${steps}</span>
    </div>
  </section>`;
}

function band(title) {
  return `<div class="band surface-blue"><h1 class="h-band">${esc(title)}</h1>
    <img class="gmark" src="${gmark}" alt=""></div>`;
}

/* 1199:8380 — the agent glyph, a 3.2px white dot matrix on primary-300 */
const AGENT_DOTS = [[8.4,4.8],[12,4.8],[8.4,8.4],[12,8.4],[15.6,8.4],
                    [4.8,12],[8.4,12],[12,12],[4.8,15.6]];
const agentGlyph = `<span class="ai">${AGENT_DOTS
  .map(([x, y]) => `<i style="left:${x}px;top:${y}px"></i>`).join('')}</span>`;

const appTile = slug => {
  const a = APPS[slug];
  if (!a) return '';
  const src = `assets/stack/${a.file}`;
  // `full` assets already carry their own rounded tile and border
  return a.full
    ? `<img class="applogo-full" src="${src}" alt="">`
    : `<span class="applogo" style="background:${a.bg}">
         <img src="${src}" alt="" style="width:${a.inner}px;height:${a.inner}px"></span>`;
};

function stackSlide() {
  const cards = STAGES.map(s => {
    const groups = s.apps.map(g => `
      <div class="app-group">
        <div class="glabel">${esc(g.label)}</div>
        ${g.items.map(slug => `
          <div class="app-row">${appTile(slug)}${esc(APPS[slug].name)}</div>`).join('')}
      </div>`).join('');
    const agents = s.agents.length ? `
      <div class="stage-agents">
        <div class="micro">AGENTS</div>
        ${s.agents.map(a => `<div class="agent-row">${agentGlyph}${esc(a)}</div>`).join('')}
      </div>` : '';
    return `<div class="stage-card">
      <div class="stage-head">
        <span class="stage-ico" style="background:${s.tint};border-color:${s.edge}">
          <img src="assets/stack/${s.art}" alt=""></span>
        <span class="stage-meta">
          <span class="stage-name">${esc(s.name)}</span>
          <span class="stage-sub">${esc(s.sub)}</span>
        </span>
      </div>
      <div class="stage-body">
        <div class="micro">APPS</div>
        ${groups}
      </div>
      ${agents}
    </div>`;
  }).join('');
  return `<section class="slide surface-blue" data-kind="stack">
    ${band('What businesses like yours run today')}
    <div class="panel panel-stack">
      <p class="t-lead stack-lead">Most of these tools don't talk to each other.
        You end up being the integration.</p>
      <div class="rail-link"><img src="assets/stack/connector.svg" alt=""></div>
      <div class="rail">${cards}</div>
    </div>
  </section>`;
}

function daySlide() {
  const cards = BENEFITS.map((b, n) => `
    <div class="ben">
      <div class="ben-top"><span class="ben-num">${n + 1}</span>${ph(b.icon)}</div>
      <div class="ben-mid"><h3>${esc(b.title)}</h3>
      <p>${esc(b.body)}</p></div>
      <div class="kick"><b>${esc(b.kick)}</b><span>${esc(b.kickBody)}</span></div>
    </div>`).join('');
  return `<section class="slide surface-blue" data-kind="day">
    ${band('A day in the life, with Gushwork')}
    <div class="panel panel-day">
      <div class="benefits">${cards}</div>
      <div class="cta-bar">
        <h2>Let's see the system in action</h2>
        <button class="btn btn-blue">See your dashboard${ph('arrow-up-right','bold')}</button>
      </div>
    </div>
  </section>`;
}

/* ═══════════════════════════════════════════════════════════════
   Render + navigation
   ═══════════════════════════════════════════════════════════════ */

const deck = document.getElementById('deck');

function render() {
  deck.innerHTML = [
    coverSlide(),
    ...STAGES.map(questionSlide),
    stackSlide(),
    daySlide()
  ].join('');
  show(state.i);
  wire();
}

function slides() { return [...deck.querySelectorAll('.slide')]; }

function show(n) {
  const all = slides();
  state.i = Math.max(0, Math.min(n, all.length - 1));
  all.forEach((s, k) => s.classList.toggle('is-current', k === state.i));
  document.getElementById('counter').textContent = `${state.i + 1} / ${all.length}`;
  updateTally();
}

function updateTally() {
  const s = slides()[state.i];
  if (!s || s.dataset.kind !== 'question') return;
  const n = state.answers[s.dataset.stage].length + (state.other[s.dataset.stage] ? 1 : 0);
  const el = s.querySelector('[data-role="tally"]');
  if (el) el.textContent = n === 0 ? 'Nothing picked yet' : `${n} picked`;
}

function toggle(stageKey, opt) {
  const list = state.answers[stageKey];
  const at = list.indexOf(opt);
  if (at === -1) list.push(opt); else list.splice(at, 1);
  save();
  const keep = state.i;
  render();
  show(keep);
}

function wire() {
  deck.querySelectorAll('.opt').forEach(b =>
    b.addEventListener('click', () => toggle(b.dataset.stage, b.dataset.opt)));
  deck.querySelectorAll('[data-nav="next"]').forEach(b =>
    b.addEventListener('click', () => show(state.i + 1)));
  deck.querySelectorAll('[data-nav="prev"]').forEach(b =>
    b.addEventListener('click', () => show(state.i - 1)));
  deck.querySelectorAll('[data-other]').forEach(inp => {
    inp.addEventListener('input', () => {
      state.other[inp.dataset.other] = inp.value;
      inp.closest('.opt-other').classList.toggle('is-on', !!inp.value.trim());
      save(); updateTally();
    });
    // keys 1-5 are answer shortcuts everywhere except inside this field
    inp.addEventListener('keydown', e => e.stopPropagation());
  });
  const slot = document.getElementById('cover-slot');
  if (slot) slot.addEventListener('click', () => document.getElementById('file').click());
  const logo = document.getElementById('logo-slot');
  if (logo) logo.addEventListener('click', e => {
    e.stopPropagation();                       // don't also open the dashboard picker
    document.getElementById('logo-file').click();
  });
}

function readImageInto(input, key) {
  input.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { state[key] = r.result; save(); const k = state.i; render(); show(k); };
    r.readAsDataURL(f);
    input.value = '';                          // so picking the same file twice still fires
  });
}
readImageInto(document.getElementById('file'), 'cover');
readImageInto(document.getElementById('logo-file'), 'logo');

// the presenter bar is static markup, so its icons are filled in here
document.getElementById('btn-prev').innerHTML = ph('arrow-left', 'bold');
document.getElementById('btn-next').innerHTML = ph('arrow-right', 'bold');
document.getElementById('btn-next').addEventListener('click', () => show(state.i + 1));
document.getElementById('btn-prev').addEventListener('click', () => show(state.i - 1));
document.getElementById('btn-reset').addEventListener('click', () => {
  STAGES.forEach(s => { state.answers[s.key] = []; state.other[s.key] = ''; });
  state.cover = ''; state.logo = '';
  save(); const k = state.i; render(); show(k);
});

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const cur = slides()[state.i];
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { show(state.i + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(state.i - 1); e.preventDefault(); }
  else if (e.key === 'f' || e.key === 'F') {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  }
  else if (e.key === 'h' || e.key === 'H') { document.body.classList.toggle('hide-chrome'); }
  else if (/^[1-5]$/.test(e.key) && cur && cur.dataset.kind === 'question') {
    const st = STAGES.find(s => s.key === cur.dataset.stage);
    const opt = st.options[+e.key - 1];
    if (opt) { toggle(st.key, opt); e.preventDefault(); }
  }
});

/* ── fit 1920×1080 to the viewport ─────────────────────────────── */
function fit() {
  const stage = document.getElementById('stage');
  const w = stage.clientWidth, h = stage.clientHeight;
  const s = Math.min(w / 1920, h / 1080);
  // scale about the top-left, then centre in px — percentage translates and
  // CSS centring both misbehave once the element overflows its container
  deck.style.transform = `translate(${(w - 1920 * s) / 2}px, ${(h - 1080 * s) / 2}px) scale(${s})`;
}
window.addEventListener('resize', fit);
new ResizeObserver(fit).observe(document.getElementById('stage'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

render();
fit();
</script>
</body>
