<!-- Built from the dashboard library (search field, buttons, icon buttons, pill tabs, badges, toast, theme menu) plus three page-local pieces: the picture-first agent card (NEW, pending review), the bundle rail (follows agent-filter-rail's category rows) and the quick view (follows agent-listing-panel). Layout is Version C of the Drop Studio wireframes, chosen by Utsav. Phase 2 adds the create / request / question / review dialog, built from the library's modal, fields, select, segmented control and timeline, and talks to /api/drop-studio. -->
<style>
*{box-sizing:border-box}
body.gd{
  --s-bg:light-dark(var(--gw-color-neutral-50),var(--gw-color-black));
  --s-bar:light-dark(var(--gw-color-white),var(--gw-color-black));
  --s-card:light-dark(var(--gw-color-white),var(--gw-color-neutral-900));
  --s-line:light-dark(var(--gw-color-neutral-100),var(--gw-color-neutral-850));
  --s-text:light-dark(var(--gw-color-black),var(--gw-color-white));
  --s-body:light-dark(var(--gw-color-neutral-700),var(--gw-color-neutral-400));
  --s-muted:var(--gw-color-neutral-500);
  --s-pic:light-dark(var(--gw-color-neutral-50),var(--gw-color-neutral-850));
  --s-hover:light-dark(var(--gw-color-neutral-50),var(--gw-color-neutral-850));
  --s-scrim:light-dark(rgba(13,13,13,.5),rgba(0,0,0,.65));
  margin:0;background:var(--s-bg);color:var(--s-text);min-height:100vh;
}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{display:block;width:1em;height:1em;flex:none}

/* top bar */
.bar{position:sticky;top:0;z-index:20;height:60px;background:var(--s-bar);border-bottom:1px solid var(--s-line);display:grid;grid-template-columns:1fr minmax(0,560px) 1fr;align-items:center;gap:var(--gw-space-16);padding:0 var(--gw-space-48)}
.brand{display:flex;align-items:center;gap:var(--gw-space-12);min-width:0}
.tile{width:32px;height:32px;border-radius:var(--gw-radius-8);background:var(--gw-color-primary-500);color:var(--gw-color-white);display:grid;place-items:center;flex:none}
.tile svg{width:16px;height:16px}
.brand b{font:var(--gw-text-h7-bold);white-space:nowrap}
.bar .gd-input--search{--gd-input-w:100%;width:100%}
.gd-input--search:has(input:not(:placeholder-shown)) .gd-search__key,.gd-input--search:focus-within .gd-search__key{display:none}
@media (hover:none){.gd-search__key{display:none}}
.acts{display:flex;align-items:center;gap:var(--gw-space-12);justify-self:end}
.gd-menu a.gd-menu__item{text-decoration:none}

/* page */
.page{max-width:1536px;margin:0 auto;padding:var(--gw-space-32) var(--gw-space-48) var(--gw-space-80)}
h1{font:var(--gw-text-h3);letter-spacing:var(--gw-text-h3-tracking);margin:var(--gw-space-24) 0 var(--gw-space-40)}
.cols{display:grid;grid-template-columns:240px minmax(0,1fr);gap:var(--gw-space-32);align-items:start}
.main{display:flex;flex-direction:column;gap:var(--gw-space-24);min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gw-space-24)}

/* bundle rail: the category rows of agent-filter-rail. 240 sticky column, 36px rows, count in neutral-500,
   the selected row white with a 1px stroke and --gw-shadow-s2, the others bare on the ground */
.rail{position:sticky;top:92px;display:flex;flex-direction:column;gap:var(--gw-space-8)}
.rail button{height:36px;padding:0 var(--gw-space-12);display:flex;align-items:center;justify-content:space-between;gap:var(--gw-space-8);border-radius:var(--gw-radius-8);border:1px solid transparent;background:none;cursor:pointer;font:var(--gw-text-body-14-med);color:var(--s-body);text-align:left}
.rail button:hover{color:var(--s-text)}
.rail button[aria-selected="true"]{background:var(--s-card);border-color:var(--s-line);box-shadow:var(--gw-shadow-s2);color:var(--s-text)}
.rail em{font:var(--gw-text-body-12-med);font-style:normal;color:var(--s-muted)}
.gd .gd-tabs.strip{display:none;overflow-x:auto;scrollbar-width:none;align-self:stretch}
.strip::-webkit-scrollbar{display:none}
.gd #status{align-self:flex-start}

/* picture-first agent card (NEW). Outer 16 = inner 8 + padding 8 */
.card{position:relative;background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--gw-radius-16);padding:var(--gw-space-8);display:flex;flex-direction:column;gap:var(--gw-space-12);min-width:0;cursor:pointer}
.card .pic{position:relative;aspect-ratio:1/1;border-radius:var(--gw-radius-8);overflow:hidden;background:var(--s-pic);display:block;width:100%;padding:0;border:0;cursor:pointer}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .meta{padding:0 var(--gw-space-8) var(--gw-space-8);display:flex;flex-direction:column;gap:2px;min-width:0}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:var(--gw-space-8)}
.card h2{font:var(--gw-text-body-16-sem);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font:var(--gw-text-body-12-reg);color:var(--s-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hov{position:absolute;right:var(--gw-space-16);top:var(--gw-space-16);display:flex;gap:var(--gw-space-8);opacity:0;transform:translateY(-2px);transition:opacity .12s,transform .12s}
.card:hover .hov,.card:focus-within .hov{opacity:1;transform:none}
.hov .gd-iconbtn{background:var(--s-card);box-shadow:var(--gw-shadow-s2)}
@media (hover:none){.hov{opacity:1;transform:none}}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:var(--gw-space-12);text-align:center;padding:var(--gw-space-60) var(--gw-space-24);background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--gw-radius-20)}
.empty h2{font:var(--gw-text-h7-bold);margin:0}
.empty p{margin:0;font:var(--gw-text-body-14-reg);color:var(--s-body)}

/* quick view: the shell of agent-listing-panel (centered, 820 at most, previous and next outside the edges,
   a bottom sheet on a phone) holding a large picture and the two actions this page has */
#qv{border:0;background:transparent;color:inherit;max-width:none;max-height:none;width:100%;height:100%;padding:var(--gw-space-24);margin:0;overflow:hidden}
#qv:not([open]){display:none}
#qv::backdrop{background:var(--s-scrim)}
.qwrap{position:relative;width:100%;height:100%;display:grid;place-items:center}
.adwrap{position:relative;width:min(820px,100%)}
.qv{position:relative;width:100%;max-height:calc(100vh - 48px);overflow:auto;background:var(--s-card);color:var(--s-text);border-radius:var(--gw-radius-24);box-shadow:var(--gw-shadow-s4);padding:var(--gw-space-16);display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:var(--gw-space-24)}
.qv .big{aspect-ratio:1/1;border-radius:var(--gw-radius-12);overflow:hidden;background:var(--s-pic)}
.qv .big img{width:100%;height:100%;object-fit:cover}
.qv .r{display:flex;flex-direction:column;gap:var(--gw-space-16);padding:var(--gw-space-4) var(--gw-space-8) var(--gw-space-8) 0;min-width:0}
.qv .top{display:flex;align-items:center;justify-content:space-between;gap:var(--gw-space-12);min-height:28px}
.qv .top .l{display:flex;align-items:center;gap:var(--gw-space-12);font:var(--gw-text-body-12-med);color:var(--s-muted)}
.qv h2{font:var(--gw-text-h5);letter-spacing:var(--gw-text-h5-tracking);margin:0}
.qv .state{margin-top:var(--gw-space-8)}
.qv p.bl{margin:0;font:var(--gw-text-body-16-reg);color:var(--s-body)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:var(--gw-space-8) var(--gw-space-12);font:var(--gw-text-body-14-reg);margin:0}
.kv dt{color:var(--s-muted)}.kv dd{margin:0;color:var(--s-text);font:var(--gw-text-body-14-med);overflow-wrap:anywhere}
.qv .btns{margin-top:auto;display:flex;flex-direction:column;gap:var(--gw-space-8)}
.qv .btns .two{display:grid;grid-template-columns:1fr 1fr;gap:var(--gw-space-8)}
.qv .btns .gd-btn{width:100%}
/* the marketplace's arrows: 44px round, white, 60px outside the modal's edges; in the header below 1000px */
.edge{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:var(--s-card);box-shadow:var(--gw-shadow-s3);display:grid;place-items:center;font-size:18px;color:var(--s-text);border:0;cursor:pointer;z-index:2}
.edge:hover{background:var(--s-hover)}
.edge.l{left:-60px}.edge.r{right:-60px}
.qv .top .nv{display:flex;align-items:center;gap:var(--gw-space-4)}
.qv .gd-iconbtn.step{display:none}
.prem{display:inline-flex;align-items:center;justify-content:center;height:24px;padding:4px var(--gw-space-8);border-radius:var(--gw-radius-full);background:light-dark(var(--gw-color-primary-25),color-mix(in srgb,var(--gw-color-primary-500) 18%,transparent));border:.5px solid light-dark(var(--gw-color-primary-100),color-mix(in srgb,var(--gw-color-primary-500) 45%,transparent));font:var(--gw-text-body-12-med);letter-spacing:var(--gw-text-body-12-med-tracking);color:light-dark(var(--gw-color-primary-500),var(--gw-color-primary-300));white-space:nowrap}
.card .prem{position:absolute;left:var(--gw-space-16);top:var(--gw-space-16);z-index:1}

/* phase 2: a picture that does not exist yet, the small ChatGPT reference text, and the create / review dialog (the library modal) */
.noimg{width:100%;height:100%;border:1px dashed var(--s-line);border-radius:var(--gw-radius-8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--gw-space-8);padding:var(--gw-space-16);text-align:center;font:var(--gw-text-body-12-med);color:var(--s-muted)}
.noimg .i{font-size:20px}
.gref{font:var(--gw-text-body-10-reg);color:var(--s-muted)}
.qv .btns .two.one{grid-template-columns:1fr}
/* the library modal's scale makes it the containing block of a fixed menu, which clips the Bundle select and scrolls the dialog; with no scale and no clip the menu opens over the page */
.gd #cr.gd-modal{scale:none;overflow:visible}
#cr .gd-modal__head{align-items:flex-start}
#cr .steps{display:flex;gap:var(--gw-space-8);margin-top:var(--gw-space-8);font:var(--gw-text-body-12-med);color:var(--s-muted)}
#cr .steps b{font-weight:inherit;color:var(--s-text)}
#cr section{display:flex;flex-direction:column;gap:var(--gw-space-16)}
#cr #fld-notes{order:-1}
#cr .gd-modal__foot{align-items:center;justify-content:space-between;gap:var(--gw-space-16)}
#cr .gd-modal__foot .gref{flex:1;min-width:0}
#cr .gd-modal__foot .acts2{display:flex;gap:var(--gw-space-8);margin-left:auto}
#cr .gd-seg{align-self:flex-start}
#cr .rvw{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:var(--gw-space-16)}
#cr .rvw figure{margin:0;display:flex;flex-direction:column;gap:var(--gw-space-8)}
#cr .rvw .pic2{aspect-ratio:1/1;border-radius:var(--gw-radius-12);overflow:hidden;background:var(--s-pic)}
#cr .rvw .pic2 img{width:100%;height:100%;object-fit:cover}
#cr .rvw figcaption{font:var(--gw-text-body-12-med);color:var(--s-muted)}
.q{padding:var(--gw-space-12) var(--gw-space-16);border-radius:var(--gw-radius-12);background:var(--s-pic);border:1px solid var(--s-line);font:var(--gw-text-body-14-reg);color:var(--s-text);white-space:pre-wrap;overflow-wrap:anywhere}
.q small{display:block;font:var(--gw-text-body-12-reg);color:var(--s-muted);margin-bottom:var(--gw-space-4)}
@media (max-width:700px){#cr .rvw{gap:var(--gw-space-8)}#cr .gd-modal__foot{flex-direction:column;align-items:stretch;gap:var(--gw-space-12)}#cr .gd-modal__foot .acts2{margin-left:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}#cr .gd-modal__foot>.gd-btn{width:100%}#cr .gd-modal__foot .gd-btn{justify-content:center}}

@media (max-width:1280px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){
  .bar{grid-template-columns:1fr auto;height:auto;padding:var(--gw-space-12) var(--gw-space-16);row-gap:var(--gw-space-12)}
  .bar .gd-input--search{grid-column:1/-1;grid-row:2}
  .page{padding:var(--gw-space-20) var(--gw-space-16) var(--gw-space-60)}
  h1{font:var(--gw-text-h5);letter-spacing:var(--gw-text-h5-tracking);margin:var(--gw-space-8) 0 var(--gw-space-20)}
  .cols{grid-template-columns:minmax(0,1fr);gap:var(--gw-space-16)}
  .rail{display:none}
  .gd .gd-tabs.strip{display:inline-flex}
  .edge{display:none}
  .qv .gd-iconbtn.step{display:inline-flex}
  .bar .lbl{display:none}
}
@media (max-width:700px){
  #qv{padding:0}
  .qwrap{place-items:end center}
  .adwrap{width:100%}
  .qv{width:100%;max-height:94vh;border-radius:var(--gw-radius-24) var(--gw-radius-24) 0 0;grid-template-columns:minmax(0,1fr);gap:var(--gw-space-16)}
  .qv .r{padding:0 var(--gw-space-8) var(--gw-space-8)}
}
@media (max-width:560px){.grid{gap:var(--gw-space-12)}.card .meta{padding:0 4px 4px}.card h2{font:var(--gw-text-body-14-sem)}.hov{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
  var D=window.DROP_STUDIO, seed=D.agents, bundles=D.bundles;
  var ALL='All bundles', API='/api/drop-studio';
  var BADGE={approved:['gd-badge--good','Approved'],review:['gd-badge--solid','To review'],requested:['gd-badge--warn','Requested']};
  var state={q:'',bundle:ALL,status:'all'};
  var remote={configured:false,owner:false,work:{},approved:{},created:[]}, agents=[];
  var $=function(id){return document.getElementById(id)};
  var ic=function(n){return '<svg class="i" aria-hidden="true"><use href="#i-'+n+'"/></svg>'};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var toast=function(m,type){if(window.GD&&GD.toast) GD.toast(m,{type:type||'info'})};
  var slug=function(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40).replace(/-+$/g,'')};
  var roleOf=function(id){return String(id).replace(/-agent$/,'')};
  var pic=function(path){return API+'?op=image&path='+encodeURIComponent(path)};
  function byId(id){for(var i=0;i<agents.length;i++) if(agents[i].id===id) return agents[i]}

  /* ── the agents: the 33 seeded ones, plus what drop-reference says (created agents, requests, candidates) ── */
  function decorate(a){
    var w=remote.work[a.id], ap=remote.approved[roleOf(a.id)];
    a.work=w||null; a.label='';
    if(!a.seed) a.src=ap?pic(ap.path):'';
    if(!a.seed&&ap) a.file=ap.path.split('/').pop();
    if(w){
      a.kind=w.status; a.status=w.status==='requested'?'requested':'review';
      if(w.status==='needs-input') a.label='Needs answer';
      if(w.status==='review'&&w.candidate){a.current=a.src; a.src=pic(w.candidate.path); a.file=w.candidate.path.split('/').pop()}
    }else{a.kind='approved'; a.status='approved'}
    a.quiet=a.seed&&a.kind==='approved';
    return a;
  }
  function build(){
    var out=[], ids={};
    seed.forEach(function(s){ids[s.id]=1; out.push(decorate(Object.assign({seed:true,src:'img/'+s.id+'.jpg',file:s.id+'.jpg'},s)))});
    remote.created.forEach(function(c){
      if(ids[c.id]) return;
      var a=decorate({id:c.id,name:c.name,bundle:c.bundle,line:c.does.slice(0,80),blurb:c.does,seed:false});
      if(a.kind==='approved'&&!a.src) return;        // discarded with nothing approved: nothing to show
      out.push(a);
    });
    agents=out;
  }
  var badge=function(a){
    if(a.quiet) return '';
    var b=BADGE[a.status]; return b?'<span class="gd-badge '+b[0]+'">'+esc(a.label||b[1])+'</span>':'';
  };

  function matches(a,skipBundle,skipStatus){
    if(!skipBundle&&state.bundle!==ALL&&a.bundle!==state.bundle) return false;
    if(!skipStatus&&state.status!=='all'&&a.status!==state.status) return false;
    if(state.q){var h=(a.name+' '+a.bundle+' '+a.line+' '+a.blurb+(a.premium?' premium':'')).toLowerCase(); if(h.indexOf(state.q)<0) return false}
    return true;
  }
  function visible(){return agents.filter(function(a){return matches(a)})}

  /* the tab groups are drawn once; only counts and the disabled state change, so the library's selection stays intact */
  var railItems=[ALL].concat(bundles);
  $('rail').innerHTML=railItems.map(function(b,i){return '<button type="button" role="tab" aria-selected="'+(i===0)+'" tabindex="'+(i===0?0:-1)+'" data-value="'+esc(b)+'">'+esc(b)+'<em></em></button>'}).join('');
  $('strip').innerHTML=railItems.map(function(b,i){return '<button type="button" role="tab" class="gd-tabs__tab" aria-selected="'+(i===0)+'" tabindex="'+(i===0?0:-1)+'" data-value="'+esc(b)+'">'+esc(b)+'<span class="gd-tabs__count"></span></button>'}).join('');

  function counts(){
    var inBundle=agents.filter(function(a){return matches(a,true,false)});
    [].forEach.call(document.querySelectorAll('#rail [role=tab], #strip [role=tab]'),function(t){
      var v=t.getAttribute('data-value'), n=v===ALL?inBundle.length:inBundle.filter(function(a){return a.bundle===v}).length;
      t.querySelector('em,.gd-tabs__count').textContent=n;
    });
    var inStatus=agents.filter(function(a){return matches(a,false,true)});
    [].forEach.call(document.querySelectorAll('#status [role=tab]'),function(t){
      var v=t.getAttribute('data-value'), n=v==='all'?inStatus.length:inStatus.filter(function(a){return a.status===v}).length;
      t.querySelector('.gd-tabs__count').textContent=n;
      if(v!=='all'&&n===0) t.setAttribute('aria-disabled','true'); else t.removeAttribute('aria-disabled');
    });
  }
  var waiting=function(a){return '<span class="noimg">'+ic('clock')+(a.kind==='needs-input'?'ChatGPT has a question':'Waiting for ChatGPT')+'</span>'};
  function cardHTML(a){
    return '<article class="card" data-id="'+a.id+'">'+
      '<button type="button" class="pic" data-open="'+a.id+'" aria-label="Open '+esc(a.name)+'">'+(a.src?'<img src="'+a.src+'" alt="" loading="lazy" decoding="async">':waiting(a))+'</button>'+
      (a.premium?'<span class="prem">Premium</span>':'')+'<div class="hov"><button type="button" class="gd-iconbtn gd-iconbtn--outline" data-copy="'+a.id+'" data-tip="Copy link" data-tip-end aria-label="Copy link to '+esc(a.name)+'">'+ic('link')+'</button>'+(a.src?'<button type="button" class="gd-iconbtn gd-iconbtn--outline" data-dl="'+a.id+'" data-tip="Download picture" data-tip-end aria-label="Download '+esc(a.name)+' picture">'+ic('dl')+'</button>':'')+'</div>'+
      '<div class="meta"><div class="row"><h2>'+esc(a.name)+'</h2>'+badge(a)+'</div><div class="sub">'+esc(a.line)+'</div></div></article>';
  }
  function render(){
    counts();
    var list=visible();
    $('grid').innerHTML=list.length?list.map(cardHTML).join(''):
      '<div class="empty"><h2>No agents match</h2><p>Try a different word, or clear the filters.</p><button class="gd-btn" type="button" id="clear">Clear filters</button></div>';
  }

  /* selection comes from the library's tab handler as gd:tab; the bundle rail and the phone strip mirror each other */
  function mirror(value){[].forEach.call(document.querySelectorAll('#rail [role=tab], #strip [role=tab]'),function(t){var on=t.getAttribute('data-value')===value; t.setAttribute('aria-selected',on); t.tabIndex=on?0:-1})}
  document.addEventListener('gd:tab',function(e){
    var g=e.target&&e.target.id, v=e.detail&&e.detail.value;
    if(g==='status'){state.status=v}
    else if(g==='rail'||g==='strip'){state.bundle=v; mirror(v)}
    else return;
    render();
  });
  $('q').addEventListener('input',function(){state.q=this.value.trim().toLowerCase(); render()});
  if(!/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)) $('qkey').textContent='Ctrl K';
  document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('q').focus();$('q').select()}});

  /* link + download. Copy feedback is on the button itself: a toast would sit behind the open quick view. */
  function linkFor(id){return location.origin+location.pathname+'?agent='+encodeURIComponent(id)}
  function flash(btn){
    if(!btn) return; clearTimeout(btn._t);
    if(btn.id==='qcopy'){
      if(!btn._html) btn._html=btn.innerHTML;
      btn.innerHTML=ic('check')+'Link copied';
      btn._t=setTimeout(function(){btn.innerHTML=btn._html;btn._html=null},2000);
    }else{
      if(!btn._html){btn._html=btn.innerHTML;btn._tip=btn.getAttribute('data-tip')}
      btn.innerHTML=ic('check'); btn.setAttribute('data-tip','Link copied');
      btn._t=setTimeout(function(){btn.innerHTML=btn._html;btn.setAttribute('data-tip',btn._tip);btn._html=null},2000);
    }
  }
  function copy(id,btn){
    var url=linkFor(id), done=function(){flash(btn)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,function(){fallback(url,done)})}else fallback(url,done);
  }
  function fallback(text,done){var t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); done()}catch(e){toast('Copy failed. Copy the address bar instead.','error')} t.remove()}
  function download(id){
    var a=byId(id); if(!a||!a.src) return;
    var l=document.createElement('a'); l.href=a.src; l.download=a.file||(id+'.png'); document.body.appendChild(l); l.click(); l.remove(); toast('Downloading '+(a.file||id));
  }

  /* quick view */
  var dlg=$('qv'), cur=null;
  var PIC={approved:function(a){return a.seed?'Current picture on /agents':'Approved in drop-reference'},review:function(a){return 'A new picture is waiting for review'},requested:function(a){return a.seed?'Current picture on /agents. A new one is requested.':'ChatGPT is drawing it'},'needs-input':function(){return 'ChatGPT has a question'}};
  function fill(a){
    cur=a.id;
    $('qbig').innerHTML=a.src?'<img id="qimg" alt="'+esc(a.name)+', the Drop picture">':waiting(a);
    if(a.src){var im=$('qimg'); im.onload=function(){$('qfile').textContent=a.file+' · '+this.naturalWidth+' x '+this.naturalHeight}; im.src=a.src}
    $('qfile').textContent=a.file||'Not drawn yet';
    $('qpic').textContent=PIC[a.kind](a);
    $('qv-name').textContent=a.name; $('qbundle').textContent=a.bundle||'No bundle yet'; $('qblurb').textContent=a.blurb;
    $('qchip').innerHTML=badge(a); $('qprem').innerHTML=a.premium?'<span class="prem">Premium</span>':'';
    var list=visible(), pos=0; for(var k=0;k<list.length;k++) if(list[k].id===a.id) pos=k+1; $('qpos').textContent=pos?pos+' of '+list.length:'';
    var dl={act:'dl',icon:'dl',label:'Download picture'}, main, alt;
    if(a.kind==='approved'){main=dl; alt={act:'req',icon:'refresh',label:'Request new picture'}}
    else if(a.kind==='review'){main={act:'review',icon:'check',label:'Review picture'}; alt={act:'dl',icon:'dl',label:'Download'}}
    else if(a.kind==='needs-input'){main={act:'ask',icon:'question',label:'Answer ChatGPT'}; alt=a.src?{act:'dl',icon:'dl',label:'Download'}:null}
    else {main={act:'work',icon:'clock',label:'See progress'}; alt=a.src?{act:'dl',icon:'dl',label:'Download'}:null}
    var set=function(b,x){b.setAttribute('data-act',x.act); b.innerHTML=ic(x.icon)+x.label; b.removeAttribute('aria-disabled')};
    set($('qmain'),main);
    $('qalt').hidden=!alt; $('qtwo').classList.toggle('one',!alt); if(alt) set($('qalt'),alt);
    if(alt&&alt.act==='req'&&!remote.configured) $('qalt').setAttribute('aria-disabled','true');
  }
  function open(id){
    var a=byId(id); if(!a) return;
    fill(a);
    if(!dlg.open){dlg.showModal(); document.body.classList.add('lock')}
    history.replaceState(null,'',location.pathname+'?agent='+encodeURIComponent(a.id));
  }
  function teardown(){document.body.classList.remove('lock'); if(location.search) history.replaceState(null,'',location.pathname); cur=null}
  function close(){if(dlg.open) dlg.close(); teardown()}
  dlg.addEventListener('close',teardown); dlg.addEventListener('cancel',teardown);
  function step(d){var list=visible(); var i=-1; for(var k=0;k<list.length;k++) if(list[k].id===cur) i=k; if(i<0||!list.length) return; open(list[(i+d+list.length)%list.length].id)}
  $('qprev').addEventListener('click',function(e){e.stopPropagation();step(-1)}); $('qnext').addEventListener('click',function(e){e.stopPropagation();step(1)}); $('qprev2').addEventListener('click',function(){step(-1)}); $('qnext2').addEventListener('click',function(){step(1)});
  $('qclose').addEventListener('click',close);
  $('qwrap').addEventListener('click',function(e){if(e.target===this) close()});
  dlg.addEventListener('keydown',function(e){if(e.key==='ArrowLeft') step(-1); else if(e.key==='ArrowRight') step(1)});
  $('qcopy').addEventListener('click',function(){if(cur) copy(cur,this)});
  function act(btn){
    var a=byId(cur); if(!a) return; var x=btn.getAttribute('data-act');
    if(btn.getAttribute('aria-disabled')==='true'){toast('Drop Studio is not connected to drop-reference yet.'); return}
    if(x==='dl') download(a.id);
    else{close(); if(x==='req') openBrief(a); else if(x==='review') showReview(a); else if(x==='ask') showAsk(a); else showWork(a)}
  }
  $('qmain').addEventListener('click',function(){act(this)}); $('qalt').addEventListener('click',function(){act(this)});

  $('grid').addEventListener('click',function(e){
    var c=e.target.closest('[data-copy]'); if(c){e.stopPropagation(); copy(c.getAttribute('data-copy'),c); return}
    var d=e.target.closest('[data-dl]'); if(d){e.stopPropagation(); download(d.getAttribute('data-dl')); return}
    if(e.target.id==='clear'){state.q='';state.bundle=ALL;state.status='all'; $('q').value=''; mirror(ALL); [].forEach.call(document.querySelectorAll('#status [role=tab]'),function(t){var on=t.getAttribute('data-value')==='all'; t.setAttribute('aria-selected',on); t.tabIndex=on?0:-1}); render(); return}
    var card=e.target.closest('.card'); if(card) open(card.getAttribute('data-id'));
  });

  /* ── talking to drop-reference through /api/drop-studio ── */
  function api(op,body){
    var o=body?{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{credentials:'same-origin',headers:{accept:'application/json'}};
    return fetch(API+'?op='+op,o).then(function(r){
      return r.json().catch(function(){return {}}).then(function(j){ if(!r.ok) throw new Error(j.error||'Something went wrong. Try again.'); return j });
    });
  }
  function refresh(){
    return api('state').then(function(j){
      remote=j; build(); render();
      if(dlg.open&&cur){var a=byId(cur); if(a) fill(a); else close()}
    }).catch(function(){ /* offline or not connected: the page keeps what it has */ });
  }
  setInterval(function(){if(!document.hidden&&remote.configured&&agents.some(function(a){return a.kind==='requested'||a.kind==='needs-input'})) refresh()},60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&remote.configured) refresh()});

  /* ── the create / request / answer / review dialog ── */
  var cr=$('cr'), ctx={}, busy=false;
  var VIEWS=['brief','work','ask','review'];
  function view(v){VIEWS.forEach(function(x){$('v-'+x).hidden=x!==v}); err('')}
  function err(m){var e=$('crerr'); e.hidden=!m; e.firstChild.textContent=m||''}
  function steps(n){$('crsteps').innerHTML=['Brief','ChatGPT','Review'].map(function(s,i){return i+1===n?'<b>'+(i+1)+' '+s+'</b>':'<span>'+(i+1)+' '+s+'</span>'}).join('<span>·</span>')}
  function foot(note,left,right){
    $('crfoot').innerHTML=(note?'<span class="gref">'+note+'</span>':'')+(left||'')+(right?'<span class="acts2">'+right+'</span>':'');
  }
  var btn=function(act,label,cls){return '<button type="button" class="gd-btn'+(cls?' '+cls:'')+'" data-cr="'+act+'">'+label+'</button>'};
  function show(){ if(!cr.open){ if(window.GD&&GD.feedback&&GD.feedback.open) GD.feedback.open(cr); else cr.showModal() } }
  function busyBtn(on,label){busy=on; var b=$('crfoot').querySelector('.gd-btn--primary'); if(!b) return; if(on){b._l=b.innerHTML; b.textContent=label; b.setAttribute('aria-disabled','true')}else if(b._l){b.innerHTML=b._l; b.removeAttribute('aria-disabled')}}
  cr.addEventListener('close',function(){busy=false; ctx={}});

  /* bundle select: options from the page's bundle list, plus "Not sure yet" */
  var BSEL=[{v:'',t:'Not sure yet'}].concat(bundles.map(function(b){return{v:b,t:b}}));
  $('f-bundle-menu').innerHTML=BSEL.map(function(o,i){return '<button type="button" class="gd-menu__item" role="option" data-value="'+esc(o.v)+'" aria-selected="'+(i===0)+'">'+esc(o.t)+'</button>'}).join('');
  function setBundle(v){
    var o=BSEL.filter(function(x){return x.v===v})[0]||BSEL[0];
    $('f-bundle').querySelector('.gd-select__value').textContent=o.t; $('f-bundle-v').value=o.v;
    [].forEach.call($('f-bundle-menu').children,function(m){m.setAttribute('aria-selected',m.getAttribute('data-value')===o.v)});
  }
  $('f-bundle').addEventListener('gd:change',function(e){$('f-bundle-v').value=e.detail&&e.detail.value!=null?e.detail.value:$('f-bundle-v').value});
  function setPose(v){[].forEach.call($('f-pose').children,function(b){var on=b.getAttribute('data-value')===v; b.setAttribute('aria-checked',on); b.tabIndex=on?0:-1})}
  var poseNow=function(){var b=$('f-pose').querySelector('[aria-checked=true]'); return b?b.getAttribute('data-value'):'standing'};

  function openBrief(a){
    ctx={revise:a||null};
    $('cr-t').textContent=a?'New picture for '+a.name:'Create new agent';
    ['fld-name','fld-does','fld-bundle'].forEach(function(id){$(id).hidden=!!a});
    $('f-name').value=a?a.name:''; $('f-name').disabled=!!a;
    $('f-does').value=a?a.blurb:''; setBundle(a?a.bundle:''); $('f-props').value=''; setPose('standing');
    $('fld-notes').hidden=!a; $('f-notes').value='';
    steps(1); view('brief');
    foot(remote.configured?'Saved as a request in drop-reference. ChatGPT makes the picture on its next scheduled check.':'Not connected to drop-reference yet, so a request cannot be sent.','',btn('send',a?'Send request':'Start creating','gd-btn--primary'));
    show(); setTimeout(function(){(a?$('f-does'):$('f-name')).focus()},60);
  }
  function submitBrief(){
    if(busy) return; err('');
    var name=$('f-name').value.trim(), does=$('f-does').value.trim();
    var props=$('f-props').value.split(/[,\n]/).map(function(p){return p.trim()}).filter(Boolean);
    var rev=ctx.revise;
    if(!name) return err('Give the agent a name.');
    if(!does) return err('Say what the agent does.');
    if(props.length&&(props.length<2||props.length>4)) return err('Give 2 to 4 props, or none and ChatGPT will choose.');
    if(!rev){var id=slug(name); if(!id) return err('That name cannot make an agent id.'); if(byId(id)) return err('There is already an agent with that name.')}
    if(!remote.configured) return err('Drop Studio is not connected to drop-reference yet.');
    busyBtn(true,'Sending…');
    api('create',{name:name,does:does,bundle:$('f-bundle-v').value,props:props,pose:poseNow(),notes:rev?$('f-notes').value.trim():'',agentId:rev?rev.id:undefined}).then(function(j){
      busy=false;
      showWork({id:rev?rev.id:slug(name),name:name,seed:!!rev,revise:!!rev,work:{issue:j.issue,url:j.url}});
      refresh();
    }).catch(function(e){busyBtn(false); err(e.message)});
  }

  function tl(items){
    return items.map(function(it){
      var cls=it[0]==='done'?' gd-timeline__item--good':it[0]==='now'?' gd-timeline__item--info':'';
      var icon=it[0]==='done'?ic('check'):it[0]==='now'?ic('clock'):'';
      return '<li class="gd-timeline__item'+cls+'"><span class="gd-timeline__node">'+icon+'</span><div class="gd-timeline__body"><b>'+it[1]+'</b><span>'+it[2]+'</span></div></li>';
    }).join('');
  }
  function showWork(a){
    var w=a.work||{}; ctx={agent:a.id,name:a.name};
    $('cr-t').textContent=a.seed||a.revise?'New picture requested':'Create new agent';
    steps(2); view('work');
    var ref=(w.issue?'#'+w.issue+' · ':'')+esc(a.name);
    $('crtl').innerHTML=tl([['done','Request sent',ref+(remote.owner&&w.url?' · <a class="gd-table__link" href="'+esc(w.url)+'" target="_blank" rel="noopener">See it on GitHub</a>':'')],['now','Waiting for ChatGPT’s next check','You can close this. The card shows Requested until the picture is ready.'],['todo','Generating the picture','From the identity and material masters in drop-reference.'],['todo','Ready to review','The card changes to To review.']]);
    foot('','',btn('close','Close, I’ll come back','gd-btn--primary'));
    show();
  }
  function showAsk(a){
    var w=a.work||{}; ctx={agent:a.id,name:a.name,issue:w.issue};
    $('cr-t').textContent='ChatGPT has a question'; steps(2); view('ask');
    $('askq').innerHTML='<small>ChatGPT, about '+esc(a.name)+'</small>'+esc(w.question||'It left a question on the request.'); $('f-ans').value='';
    foot('Sending puts the request back in the queue.','',btn('answer','Send answer','gd-btn--primary'));
    show(); setTimeout(function(){$('f-ans').focus()},60);
  }
  function submitAnswer(){
    if(busy) return; var text=$('f-ans').value.trim(); if(!text) return err('Write an answer first.');
    busyBtn(true,'Sending…');
    api('answer',{issue:ctx.issue,text:text}).then(function(){busy=false; cr.close(); toast('Answer sent. ChatGPT picks the request up again on its next check.'); refresh()}).catch(function(e){busyBtn(false); err(e.message)});
  }
  function showReview(a){
    var w=a.work||{}; ctx={agent:a.id,name:a.name,file:a.file,src:a.src,mode:'',owner:remote.owner};
    $('cr-t').textContent='Review the new picture'; steps(3); view('review');
    $('rvw').innerHTML=(a.current?'<figure><div class="pic2"><img src="'+a.current+'" alt=""></div><figcaption>Current picture</figcaption></figure>':'')+
      '<figure><div class="pic2"><img src="'+a.src+'" alt="'+esc(a.name)+', new picture"></div><figcaption>'+esc(a.name)+' · '+esc(a.file||'')+'</figcaption></figure>';
    $('rv-notewrap').hidden=true; $('f-rvnote').value='';
    reviewFoot(); show();
  }
  function reviewFoot(){
    if(!ctx.owner){foot('Made by ChatGPT from the drop-reference masters. Only the owner accepts, changes or discards a picture.','',btn('rvdl','Download','gd-btn--primary')); return}
    if(ctx.mode==='changes'){foot('A new request is made as a revision of this picture, with your note.',btn('back','Back'),btn('changes','Send changes','gd-btn--primary')); return}
    if(ctx.mode==='discard'){foot('The file stays in drop-reference; the request is marked discarded.',btn('back','Back'),btn('discard','Discard picture','gd-btn--danger')); return}
    foot('Made by ChatGPT from the drop-reference masters.',btn('changesAsk','Request changes'),btn('discardAsk','Discard')+btn('accept','Accept','gd-btn--primary'));
  }
  function decide(action){
    if(busy) return; var note=$('f-rvnote').value.trim(); err('');
    if(action==='changes'&&!note) return err('Say what should change.');
    busyBtn(true,action==='accept'?'Accepting…':'Sending…');
    api('decide',{agentId:ctx.agent,action:action,note:note}).then(function(){
      busy=false; cr.close();
      toast(action==='accept'?'Accepted. It is saved as the approved picture in drop-reference. Publishing it to /agents comes later.':action==='changes'?'Changes sent. ChatGPT makes a new picture on its next check.':'Discarded.');
      refresh();
    }).catch(function(e){busyBtn(false); err(e.message)});
  }
  $('crfoot').addEventListener('click',function(e){
    var b=e.target.closest('[data-cr]'); if(!b||b.getAttribute('aria-disabled')==='true') return;
    var x=b.getAttribute('data-cr');
    if(x==='send') submitBrief();
    else if(x==='close') cr.close();
    else if(x==='answer') submitAnswer();
    else if(x==='accept') decide('accept');
    else if(x==='changes') decide('changes');
    else if(x==='discard') decide('discard');
    else if(x==='rvdl'){var l=document.createElement('a'); l.href=ctx.src; l.download=ctx.file||'picture.png'; document.body.appendChild(l); l.click(); l.remove()}
    else if(x==='changesAsk'||x==='discardAsk'){ctx.mode=x==='changesAsk'?'changes':'discard'; $('rv-notel').textContent=ctx.mode==='changes'?'What should change':'Why (optional)'; $('f-rvnote').placeholder=ctx.mode==='changes'?'For example: a bigger calculator, no hard hat':''; $('rv-notewrap').hidden=false; err(''); reviewFoot(); $('f-rvnote').focus()}
    else if(x==='back'){ctx.mode=''; $('rv-notewrap').hidden=true; err(''); reviewFoot()}
  });
  $('create').addEventListener('click',function(){openBrief()});

  build(); render();
  var want=new URLSearchParams(location.search).get('agent');
  function deep(){ if(want){ if(byId(want)) open(want); else history.replaceState(null,'',location.pathname); want=null } }
  var first=refresh(); first.then(deep);
  if(want&&byId(want)) deep();
})();
</script>
</body>
</html>
